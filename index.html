<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="description" content="A minimal gym workout tracker.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Track.">
<title>Track.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* JetBrains Mono (variable weight), shipped with the app and cached for offline, so it looks the same everywhere. */
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap; src: url(fonts/jetbrains-mono-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap; src: url(fonts/jetbrains-mono-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: rgba(255, 255, 255, .66);   /* 9:1 on black */
    --faint: rgba(255, 255, 255, .47); /* 4.8:1 on black, still readable in a gym */
    --ghost: rgba(255, 255, 255, .26); /* last session's numbers: there if you look */
    --line: rgba(255, 255, 255, .14);  /* hairlines */
    /* One typeface for everything: JetBrains Mono. Hierarchy comes from size, weight and grey. */
    --font: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --display: var(--font);
    --mono: var(--font);
    --ease: cubic-bezier(.2, .8, .2, 1);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  html {
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font: 400 15px/1.45 var(--font);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    min-height: 100dvh;
  }

  a, button, input, textarea { font: inherit; color: inherit; }
  a { text-decoration: none; }
  button, input, textarea {
    background: none;
    border: 0;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  button { cursor: pointer; text-align: left; touch-action: manipulation; }
  input { width: 100%; min-width: 0; outline: none; caret-color: var(--fg); }
  input::placeholder { color: var(--faint); opacity: 1; }
  /* Chrome draws an arrow on inputs with a datalist; keep the suggestions, drop the arrow.
     Separate rules, because an unknown pseudo-element would void the whole list. */
  input::-webkit-calendar-picker-indicator { display: none !important; }
  input::-webkit-list-button { display: none !important; }
  ::selection { background: var(--fg); color: var(--bg); }
  :focus { outline: none; }
  :focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
  input:focus-visible { outline: none; }

  main {
    max-width: 34rem;
    margin: 0 auto;
    padding:
      max(24px, env(safe-area-inset-top))
      max(24px, env(safe-area-inset-right))
      calc(132px + env(safe-area-inset-bottom)) /* room for the tab bar */
      max(24px, env(safe-area-inset-left));
  }

  /* header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    font-size: 15px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; padding: 10px 0; }
  .mark { width: 19px; height: 19px; flex: none; }
  .warn { margin-top: 8px; font-size: 13px; color: var(--dim); }

  .title {
    margin-top: 56px;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(30px, 9vw, 38px);
    line-height: 1.1;
    letter-spacing: -.02em;
  }
  .sub { margin-top: 12px; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .label { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .label b { color: var(--fg); font-weight: 700; }

  /* profile header: avatar, name (tap to edit), level */
  .profile { display: flex; align-items: center; gap: 12px; min-height: 52px; }
  .avatar { display: grid; place-items: center; flex: none; width: 44px; height: 44px; color: var(--fg); margin-left: -12px; }
  .avatar .mark { width: 20px; height: 20px; }
  .who { flex: 1; min-width: 0; }
  .who-name { display: block; width: 100%; padding: 12px 0; margin: -10px 0; font-family: var(--display); font-size: 17px; font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who-name.empty { color: var(--faint); }
  .who-level { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }

  /* the day's card: the workout, date, ring and three stats */
  .card {
    display: flex;
    flex-direction: column;
    margin-top: 20px;
    padding: 18px 0;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card .title { margin-top: 6px; font-size: clamp(26px, 8vw, 32px); overflow-wrap: anywhere; }
  .card .sub { margin-top: 6px; color: rgba(255, 255, 255, .8); }
  .card .label { color: rgba(255, 255, 255, .8); }
  .ring { position: relative; flex: none; width: 74px; height: 74px; }
  .ring::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--bg); }
  .ring svg, .mini svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle, .mini circle { fill: none; stroke-width: 1.2; }
  .ring .track, .mini .track { stroke: rgba(255, 255, 255, .16); }
  .ring .fill, .mini .fill { stroke: var(--fg); stroke-linecap: butt; transition: stroke-dashoffset .4s var(--ease); }
  .ring-text { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: var(--display); font-size: 16px; font-weight: 700; line-height: 1.1; }
  .ring-text small { font-family: var(--mono); font-size: 9px; letter-spacing: .04em; text-transform: uppercase; color: rgba(255, 255, 255, .75); }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: auto; padding-top: 22px; }
  .stat-v { font-family: var(--display); font-size: 20px; font-weight: 400; line-height: 1; white-space: nowrap; }
  .stat-v small { font-family: var(--mono); font-size: 10px; color: rgba(255, 255, 255, .75); }
  .stat-l { margin-top: 5px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase; color: rgba(255, 255, 255, .75); }
  /* Start / Finish under the numbers. */
  .go { align-self: flex-start; margin: 8px 0 -16px; padding: 16px 48px 16px 0; font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--fg); transition: opacity .2s; }
  .go:active { opacity: .5; }
  .go.stop { color: var(--dim); }
  .stat-v.live { font-variant-numeric: tabular-nums; }
  .next { margin-top: auto; padding-top: 22px; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: rgba(255, 255, 255, .85); }

  /* workout program: heading, one card per exercise (tap to log) */
  .section-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 32px; }
  .section-h h2 { font-family: var(--display); font-size: 17px; font-weight: 700; }
  .section-h span { flex: none; white-space: nowrap; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .list { margin-top: 16px; }
  .ex { margin-bottom: 12px; }
  .ex-card {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 84px;
    padding: 14px 0;
  }
  .ex-info { display: grid; gap: 4px; min-width: 0; }
  .ex-name { font-family: var(--display); font-size: 17px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .ex-sub { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: rgba(255, 255, 255, .8); }
  .ex-meta { margin-top: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: rgba(255, 255, 255, .7); }
  .mini { position: relative; width: 52px; height: 52px; }
  .mini::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--bg); }
  .mini .ring-text { font-size: 11px; }
  /* The set list folds open and shut: rows animate 0fr -> 1fr, so the height follows the content. */
  .ex-body { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .34s var(--ease), opacity .22s ease; }
  .ex.open .ex-body { grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows .34s var(--ease), opacity .3s ease .06s; }
  .ex-fold { min-height: 0; overflow: hidden; }
  .ex-pad { padding: 6px 2px 10px; }
  .ex-card { transition: transform .18s var(--ease); }
  .ex-card:active { transform: scale(.985); }
  .mini .fill, .ring .fill { transition: stroke-dashoffset .5s var(--ease); }
  .remove-ex { min-height: 48px; padding: 14px 32px 14px 0; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
  .sets { margin-top: 6px; }
  .row {
    display: grid;
    grid-template-columns: 1.6em 3.6em 1.7em 1.1em 3.2em 1fr 2.2em;
    align-items: baseline;
    font-size: 15px;
  }
  .row > * { padding: 12px 0; }
  .n { font-family: var(--mono); color: var(--faint); font-size: 12px; }
  .w, .kg { text-align: right; padding-right: .3em; }
  .u { color: var(--dim); }
  .set { cursor: pointer; }
  .act { justify-self: end; align-self: center; min-height: 48px; color: var(--dim); padding: 12px 0 12px 28px; }
  .plus { color: var(--fg); font-size: 24px; font-weight: 400; line-height: 1; min-width: 56px; margin-right: -8px; padding: 12px 8px 12px 24px; text-align: right; }
  /* Always in the accessibility tree; shown on tap (.on) or keyboard focus. */
  .remove { font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .remove.on, .remove:focus-visible { opacity: 1; pointer-events: auto; }
  .plus { grid-column: 7; }
  /* Last session's matching set, barely visible at the right; "remove" takes its place. */
  .prev { grid-column: 6; grid-row: 1; justify-self: end; font-family: var(--mono); font-size: 12px; color: var(--ghost); white-space: nowrap; transition: opacity .15s; }
  .set .remove { grid-column: 6 / 8; grid-row: 1; }
  .remove.on + .prev, .remove:focus-visible + .prev { opacity: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .add-ex input { padding: 16px 0; font-family: var(--display); font-size: 17px; font-weight: 700; }


  /* plan */
  .plan {
    display: block;
    width: 100%;
    margin-top: 28px;
    font-size: 17px;
    line-height: 1.7;
    resize: none;
    overflow: hidden;
    outline: none;
    caret-color: var(--fg);
  }
  .hint { margin-top: 40px; font-size: 13px; line-height: 1.6; color: var(--dim); }
  /* Comfortable tap targets; the negative margins keep the letters aligned with the summary. */
  .lang { display: flex; align-items: center; gap: 0; align-self: flex-start; margin: -14px -14px 0 0; font-family: var(--mono); font-size: 12px; color: var(--ghost); }
  .lang button { min-width: 46px; padding: 14px 14px; text-align: center; color: var(--dim); transition: color .2s; }
  .lang button[aria-pressed="true"] { color: var(--fg); }
  .presets { display: flex; flex-wrap: wrap; gap: 2px 24px; margin-top: 36px; }
  .presets button { padding: 14px 0; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); transition: color .2s; }
  .presets button[aria-pressed="true"] { color: var(--fg); }

  /* history: a month calendar */
  .subrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 4px; }
  .subrow .sub { margin-top: 0; }
  .months { display: flex; gap: 0; margin-right: -16px; }
  .months a, .months span { padding: 14px 16px; font-size: 20px; font-weight: 400; line-height: 1; color: var(--dim); transition: color .2s; }
  .months .off { color: var(--ghost); }
  .cal { margin-top: 44px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; text-align: center; touch-action: pan-y; }
  .wd { padding-bottom: 12px; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .cal-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
    min-height: 56px;
    padding-top: 8px;
    font-family: var(--display);
    font-size: 15px;
    color: var(--ghost);
  }
  .cal-day.has { color: var(--fg); }
  .cal-day.future { color: rgba(255, 255, 255, .14); }
  .cal-day.today .num { text-decoration: underline; text-decoration-color: var(--fg); text-decoration-thickness: 1px; text-underline-offset: 5px; }
  .cal-name {
    max-width: 100%;
    margin-top: 4px;
    overflow: hidden;
    font-family: var(--mono);
    font-size: 8.5px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--dim);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cal-name.rest { color: var(--ghost); }
  footer { margin-top: 72px; font-size: 14px; }
  .backup { font-size: 13px; color: var(--faint); }
  .backup-actions { display: flex; gap: 24px; }
  footer button { color: var(--dim); padding: 16px 0; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; transition: color .2s; }
  footer button.due { color: var(--fg); }

  /* bottom tab bar: History · Today · Plan */
  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: var(--bg);
  }
  /* Each tab fills its whole third of the bar, edge to edge and the bar's full height, so a thumb
     anywhere near an icon lands. The icons themselves stay small and in the same place.
     No long-press link preview or text selection on them (iOS would show one instead of tapping). */
  .tabbar-inner { max-width: 34rem; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  .tab {
    display: grid;
    place-items: center;
    height: 76px;
    padding-bottom: 4px;
    color: var(--dim);
    transition: color .2s;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .tab[aria-current="page"], .tab:active { color: var(--fg); }
  .tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .tab .dot { stroke-width: 2.4; }
  .tab-home svg { width: 28px; height: 28px; fill: currentColor; stroke: none; } /* just the mark, a touch larger */
  /* Out of the way only while the on-screen keyboard is up (see syncKeyboard). */
  body.kb .tabbar { visibility: hidden; }

  /* Rest countdown: a quiet strip above the tab bar, with a hairline that runs out. */
  .restbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(76px + env(safe-area-inset-bottom));
    z-index: 9;
    padding: 0 max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left));
    background: var(--bg);
    transform: translateY(0);
    opacity: 1;
    transition: transform .3s var(--ease), opacity .3s ease;
  }
  .restbar.off { transform: translateY(12px); opacity: 0; pointer-events: none; }
  .rest-in { position: relative; max-width: 34rem; margin: 0 auto; display: flex; align-items: center; gap: 18px; height: 58px; }
  .rest-line { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(255, 255, 255, .14); }
  .rest-line i { display: block; height: 100%; background: var(--fg); transform-origin: left; transition: transform .25s linear; }
  .rest-l { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .rest-t { flex: 1; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .restbar button { padding: 18px 8px; margin: 0 -8px; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .restbar button:active { color: var(--fg); }
  .restbar.done .rest-t { animation: nope .6s ease 2; }
  body.resting main { padding-bottom: calc(190px + env(safe-area-inset-bottom)); }
  body.kb .restbar, body.onboarding .restbar { display: none; }

  /* profile (first launch and from the avatar): artwork, "Welcome, <name>", four fields */
  body.onboarding .tabbar { display: none; }
  body.onboarding main { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  .ob { display: flex; flex-direction: column; min-height: calc(100dvh - max(24px, env(safe-area-inset-top)) - max(24px, env(safe-area-inset-bottom))); }
  .ob-top { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
  .ob-top .lang { text-shadow: 0 0 6px #000, 0 0 2px #000; }
  .ob-close { display: grid; place-items: center; width: 44px; height: 44px; margin-left: -10px; font-size: 22px; }
  .ob-head { margin-top: 14vh; }
  .ob-hello { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 8.5vw, 34px); line-height: 1.15; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .ob-form { display: grid; gap: 20px; margin-top: 22px; }
  .ob-field { display: block; }
  .ob-label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .ob-line { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255, 255, 255, .25); transition: border-color .2s; }
  .ob-line:focus-within { border-bottom-color: var(--fg); }
  .ob-input { flex: 1; padding: 13px 0; font-size: 16px; }
  .ob-tick { flex: none; font-size: 13px; color: var(--dim); }
  .ob-nav { display: flex; justify-content: flex-end; margin-top: auto; padding-top: 28px; }
  .ob-next { padding: 18px 0 18px 36px; font-family: var(--mono); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--fg); }
  .ob-next:active { color: var(--dim); }

  /* cardio rows: minutes and km instead of kg x reps */
  .row.cardio { grid-template-columns: 1.6em 3.6em 2.2em 3.4em 1.9em 1fr 2.2em; }
  .row.cardio .kg, .row.cardio .km { text-align: right; padding-right: .3em; }

  @media (hover: hover) {
    .tab:hover, footer button:hover, .act:hover, .presets button:hover, .lang button:hover, .months a:hover, a.cal-day:hover { color: var(--fg); }
  }
  footer button:active, .act:active, .presets button:active, .months a:active, a.cal-day:active { color: var(--fg); }

  /* motion */
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* Quick, so a tap on a tab shows the new screen right away. */
  .view > * { animation: rise .35s var(--ease) both; }
  .view > :nth-child(2) { animation-delay: .02s; }
  .view > :nth-child(3) { animation-delay: .04s; }
  .view > :nth-child(4) { animation-delay: .06s; }
  .view > :nth-child(n+5) { animation-delay: .08s; }
  .fresh { animation: rise .4s var(--ease) both; }
  @keyframes nope { 50% { opacity: .25; } }
  .nope { animation: nope .5s ease 2; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
