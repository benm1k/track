<meta name="theme-color" content="#000000">

<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: rgba(255, 255, 255, .66);   /* 9:1 on black */
    --faint: rgba(255, 255, 255, .47); /* 4.8:1 on black, still readable in a gym */
    --ghost: rgba(255, 255, 255, .26); /* last session's numbers: there if you look */
    --font: "Geist", "Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  html {
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font: 400 16px/1.4 var(--font);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    min-height: 100dvh;
  }

  a, button, input, textarea { font: inherit; color: inherit; }
  a { text-decoration: none; }
  button, input, textarea {
    background: none;
    border: 0;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  button { cursor: pointer; text-align: left; touch-action: manipulation; }
  input { width: 100%; min-width: 0; outline: none; caret-color: var(--fg); }
  input::placeholder { color: var(--faint); opacity: 1; }
  /* Chrome draws an arrow on inputs with a datalist; keep the suggestions, drop the arrow.
     Separate rules, because an unknown pseudo-element would void the whole list. */
  input::-webkit-calendar-picker-indicator { display: none !important; }
  input::-webkit-list-button { display: none !important; }
  ::selection { background: var(--fg); color: var(--bg); }
  :focus { outline: none; }
  :focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
  input:focus-visible { outline: none; }

  main {
    max-width: 34rem;
    margin: 0 auto;
    padding:
      max(24px, env(safe-area-inset-top))
      max(24px, env(safe-area-inset-right))
      calc(132px + env(safe-area-inset-bottom)) /* room for the tab bar */
      max(24px, env(safe-area-inset-left));
  }

  /* header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    font-size: 15px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 500; letter-spacing: -.01em; padding: 10px 0; }
  .mark { width: 19px; height: 19px; flex: none; }
  .warn { margin-top: 8px; font-size: 13px; color: var(--dim); }

  .title {
    margin-top: 64px;
    font-weight: 100;
    font-size: clamp(48px, 15vw, 64px);
    line-height: .95;
    letter-spacing: -.04em;
  }
  .sub { margin-top: 12px; font-size: 15px; color: var(--dim); }

  /* day */
  .list { margin-top: 56px; }
  .ex { margin-bottom: 44px; }
  .head { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 16px; }
  .head > .remove, .head > .target { grid-column: 2; grid-row: 1; justify-self: end; }
  /* Plain text in the same cell as "remove": it must never catch the tap meant for it. */
  .target { color: var(--dim); font-size: 15px; transition: opacity .15s; pointer-events: none; }
  .remove.on + .target, .remove:focus-visible + .target { opacity: 0; }
  .ex-name {
    padding: 6px 0;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -.01em;
    overflow-wrap: anywhere;
  }

  .row {
    display: grid;
    grid-template-columns: 1.6em 3.6em 1.7em 1.1em 2.6em 1fr 2.2em;
    align-items: baseline;
    font-size: 17px;
  }
  .row > * { padding: 8px 0; }
  .n { color: var(--faint); font-size: 13px; }
  .w, .kg { text-align: right; padding-right: .3em; }
  .u { color: var(--dim); }
  .set { cursor: pointer; }
  .act { justify-self: end; align-self: center; color: var(--dim); padding: 8px 0 8px 20px; }
  .plus { color: var(--fg); font-size: 26px; font-weight: 200; line-height: 1; padding-top: 4px; padding-bottom: 4px; }
  /* Always in the accessibility tree; shown on tap (.on) or keyboard focus. */
  .remove { font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .remove.on, .remove:focus-visible { opacity: 1; pointer-events: auto; }
  .plus { grid-column: 7; }
  /* Last session's matching set, barely visible at the right; "remove" takes its place. */
  .prev { grid-column: 6; grid-row: 1; justify-self: end; font-size: 13px; color: var(--ghost); white-space: nowrap; transition: opacity .15s; }
  .set .remove { grid-column: 6 / 8; grid-row: 1; }
  .remove.on + .prev, .remove:focus-visible + .prev { opacity: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .add-ex input { padding: 8px 0; font-size: 19px; font-weight: 500; letter-spacing: -.01em; }


  /* plan */
  .plan {
    display: block;
    width: 100%;
    margin-top: 28px;
    font-size: 17px;
    line-height: 1.7;
    resize: none;
    overflow: hidden;
    outline: none;
    caret-color: var(--fg);
  }
  .hint { margin-top: 40px; font-size: 13px; line-height: 1.6; color: var(--dim); }
  /* Comfortable tap targets; the negative margins keep the letters aligned with the summary. */
  .lang { display: flex; align-items: center; gap: 2px; align-self: flex-start; margin: -10px -8px 0 0; font-size: 15px; color: var(--ghost); }
  .lang button { padding: 10px 8px; color: var(--dim); transition: color .2s; }
  .lang button[aria-pressed="true"] { color: var(--fg); }
  .presets { display: flex; flex-wrap: wrap; gap: 2px 24px; margin-top: 36px; }
  .presets button { padding: 6px 0; font-size: 15px; color: var(--dim); transition: color .2s; }
  .presets button[aria-pressed="true"] { color: var(--fg); }

  /* history: a month calendar */
  .subrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 4px; }
  .subrow .sub { margin-top: 0; }
  .months { display: flex; gap: 12px; margin-right: -10px; }
  .months a, .months span { padding: 6px 10px; font-size: 26px; font-weight: 200; line-height: 1; color: var(--dim); transition: color .2s; }
  .months .off { color: var(--ghost); }
  .cal { margin-top: 44px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; text-align: center; touch-action: pan-y; }
  .wd { padding-bottom: 12px; font-size: 12px; color: var(--faint); }
  .cal-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
    min-height: 54px;
    padding-top: 8px;
    font-size: 17px;
    color: var(--ghost);
  }
  .cal-day.has { color: var(--fg); font-weight: 500; }
  .cal-day.future { color: rgba(255, 255, 255, .14); }
  .cal-day.today .num { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
  .cal-name {
    max-width: 100%;
    margin-top: 4px;
    overflow: hidden;
    font-size: 10px;
    font-weight: 400;
    color: var(--dim);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cal-name.rest { color: var(--ghost); }
  footer { margin-top: 72px; font-size: 14px; }
  .backup { font-size: 13px; color: var(--faint); }
  .backup-actions { display: flex; gap: 24px; }
  footer button { color: var(--dim); padding: 10px 0; transition: color .2s; }
  footer button.due { color: var(--fg); }

  /* bottom tab bar: History · Today · Plan */
  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: var(--bg);
  }
  /* Each tab fills its whole third of the bar, edge to edge and the bar's full height, so a thumb
     anywhere near an icon lands. The icons themselves stay small and in the same place.
     No long-press link preview or text selection on them (iOS would show one instead of tapping). */
  .tabbar-inner { max-width: 34rem; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  .tab {
    display: grid;
    place-items: center;
    height: 76px;
    padding-bottom: 4px;
    color: var(--dim);
    transition: color .2s;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .tab[aria-current="page"], .tab:active { color: var(--fg); }
  .tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .tab .dot { stroke-width: 2.4; }
  .tab-home svg { width: 28px; height: 28px; fill: currentColor; stroke: none; } /* just the mark, a touch larger */
  /* Out of the way only while the on-screen keyboard is up (see syncKeyboard). */
  body.kb .tabbar { visibility: hidden; }

  @media (hover: hover) {
    .tab:hover, footer button:hover, .act:hover, .presets button:hover, .lang button:hover, .months a:hover, a.cal-day:hover { color: var(--fg); }
  }
  footer button:active, .act:active, .presets button:active, .months a:active, a.cal-day:active { color: var(--fg); }

  /* motion */
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* Quick, so a tap on a tab shows the new screen right away. */
  .view > * { animation: rise .35s var(--ease) both; }
  .view > :nth-child(2) { animation-delay: .02s; }
  .view > :nth-child(3) { animation-delay: .04s; }
  .view > :nth-child(4) { animation-delay: .06s; }
  .view > :nth-child(n+5) { animation-delay: .08s; }
  .fresh { animation: rise .4s var(--ease) both; }
  @keyframes nope { 50% { opacity: .25; } }
  .nope { animation: nope .5s ease 2; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<noscript>Track. needs JavaScript.</noscript>
<script>
(() => {
  'use strict';

  const KEY = 'track.v1';
  const app = document.getElementById('app');
  const namesList = document.getElementById('names');

  /* ---------- DOM helper: strings are always added as text, never as HTML ---------- */

  function el(tag, attrs, ...kids) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids) if (kid != null && kid !== false) node.append(kid);
    return node;
  }

  /* ---------- dates (local time, keyed YYYY-MM-DD) ---------- */

  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dateOf = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => keyOf(new Date());
  const isDayKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k) && keyOf(dateOf(k)) === k;

  /* ---------- language: Lithuanian or English (switch on the Plan screen) ---------- */

  // Lithuanian plural: 1 treniruotė, 2 treniruotės, 10 treniruočių, 21 treniruotė…
  const ltPlural = (n, one, few, many) => {
    const a = n % 10;
    const b = n % 100;
    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 9 && !(b >= 12 && b <= 19)) return few;
    return many;
  };

  const TEXT = {
    en: {
      rest: 'Rest',
      workout: 'Workout',
      addExercise: 'Add exercise',
      remove: 'remove',
      exercises: 'Exercises',
      weight: name => `${name} weight, kg`,
      reps: name => `${name} reps`,
      addSet: name => `Add set to ${name}`,
      removeExercise: name => `Remove ${name}`,
      removeSet: i => `Remove set ${i}`,
      lastTime: 'last time ',
      cantSave: 'Can’t save on this device. Private browsing?',
      days: 'Days',
      month: 'Month',
      prevMonth: 'Previous month',
      nextMonth: 'Next month',
      weekInitials: ['M', 'T', 'W', 'T', 'F', 'S', 'S'],
      workouts: n => `${n} workout${n === 1 ? '' : 's'}`,
      nothingLogged: 'nothing logged',
      exportLabel: 'Export',
      importLabel: 'Import',
      lastBackup: d => `Last backup ${d} days ago.`,
      noBackup: 'Not backed up yet.',
      notABackup: 'That file isn’t a Track. backup.',
      replaceAll: n => `Replace everything here with the ${n} workout${n === 1 ? '' : 's'} in this file?`,
      replacePlan: name => `Replace your plan with “${name}”?`,
      plan: 'Plan',
      presets: 'Presets',
      language: 'Language',
      nothingPlanned: 'Nothing planned.',
      planPlaceholder: 'Monday Push\n- Bench press 4x8',
      dayShort: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      hint: [
        'Tap a preset above to start from it, or write your own. ',
        'Start each workout with the day you train it, e.g. “Monday Push”; it loads on that day, and other days are rest days. ',
        'List exercises as “- Squat 5x8” or with ranges, “- Bench 3-4x6-8”. ',
        'Use / for alternates; they take turns each session. ',
        'Changes apply to days you haven’t started yet.',
      ],
      tabs: { main: 'Main', history: 'History', today: 'Today', plan: 'Plan' },
    },
    lt: {
      rest: 'Poilsis',
      workout: 'Treniruotė',
      addExercise: 'Pridėti pratimą',
      remove: 'šalinti',
      exercises: 'Pratimai',
      weight: name => `${name}: svoris, kg`,
      reps: name => `${name}: pakartojimai`,
      addSet: name => `Pridėti seriją: ${name}`,
      removeExercise: name => `Šalinti: ${name}`,
      removeSet: i => `Šalinti ${i} seriją`,
      lastTime: 'praeitą kartą ',
      cantSave: 'Šiame įrenginyje nepavyksta išsaugoti. Gal įjungtas privatus naršymas?',
      days: 'Dienos',
      month: 'Mėnuo',
      prevMonth: 'Ankstesnis mėnuo',
      nextMonth: 'Kitas mėnuo',
      weekInitials: ['P', 'A', 'T', 'K', 'P', 'Š', 'S'],
      workouts: n => `${n} ${ltPlural(n, 'treniruotė', 'treniruotės', 'treniruočių')}`,
      nothingLogged: 'nieko neužrašyta',
      exportLabel: 'Eksportuoti',
      importLabel: 'Importuoti',
      lastBackup: d => `Paskutinė kopija prieš ${d} d.`,
      noBackup: 'Atsarginės kopijos dar nėra.',
      notABackup: 'Šis failas nėra Track. atsarginė kopija.',
      replaceAll: n => `Pakeisti visus duomenis šiame telefone? Faile: ${n} ${ltPlural(n, 'treniruotė', 'treniruotės', 'treniruočių')}.`,
      replacePlan: name => `Pakeisti planą į „${name}“?`,
      plan: 'Planas',
      presets: 'Paruošti planai',
      language: 'Kalba',
      nothingPlanned: 'Nieko nesuplanuota.',
      planPlaceholder: 'Pirmadienis A\n- Pritūpimai 5x8',
      dayShort: ['Sk', 'Pr', 'An', 'Tr', 'Kt', 'Pn', 'Št'],
      hint: [
        'Pasirink paruoštą planą viršuje arba parašyk savo. ',
        'Kiekvieną treniruotę pradėk savaitės diena, pvz. „Pirmadienis A“: ji įsikels tą dieną, o kitos dienos bus poilsio. ',
        'Pratimus rašyk taip: „- Pritūpimai 5x8“ arba su intervalais „- Spaudimas 3-4x6-8“. ',
        'Alternatyvas atskirk „/“ – jos keičiasi kas treniruotę. ',
        'Pakeitimai galioja dar nepradėtoms dienoms.',
      ],
      tabs: { main: 'Pagrindinis meniu', history: 'Istorija', today: 'Šiandien', plan: 'Planas' },
    },
  };

  // The chosen language, else the phone's (Lithuanian phones start in Lithuanian).
  const lang = () => (db.lang === 'lt' || db.lang === 'en')
    ? db.lang
    : (/^lt\b/i.test(navigator.language || '') ? 'lt' : 'en');
  const T = () => TEXT[lang()];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  const fmt = (k, opts) => dateOf(k).toLocaleDateString(lang() === 'lt' ? 'lt-LT' : 'en-GB', opts);
  // "Monday 19 October" / "Pirmadienis, spalio 19 d." (with the year when it isn't this year)
  function fullDate(k) {
    const otherYear = dateOf(k).getFullYear() !== new Date().getFullYear();
    if (lang() !== 'lt') {
      return fmt(k, Object.assign({ weekday: 'long', day: 'numeric', month: 'long' }, otherYear && { year: 'numeric' }));
    }
    const year = otherYear ? `${dateOf(k).getFullYear()} m. ` : '';
    return `${cap(fmt(k, { weekday: 'long' }))}, ${year}${fmt(k, { month: 'long', day: 'numeric' })}`;
  }

  /* ---------- values ---------- */

  const clean = s => String(s).replace(/\s+/g, ' ').trim().slice(0, 60);
  const norm = s => clean(s).toLowerCase();
  const round2 = n => Math.round(n * 100) / 100;
  const fmtKg = n => String(round2(n));
  const setText = s => `${s.kg ? fmtKg(s.kg) : 'bw'} × ${s.reps}`;

  function parseKg(s) {
    const t = s.trim().replace(',', '.');
    if (!/^(\d+(\.\d*)?|\.\d+)$/.test(t)) return null;
    const v = Number(t);
    return v <= 1000 ? round2(v) : null;
  }

  function parseReps(s) {
    const t = s.trim();
    if (!/^\d+$/.test(t)) return null;
    const v = Number(t);
    return v >= 1 && v <= 999 ? v : null;
  }

  /* ---------- storage ---------- */

  // Ready-made plans, each in English and Lithuanian. The two texts must match line for line:
  // that's how an exercise is linked to its translation (see names()). Add new ones here.
  const PRESETS = [
    {
      name: { en: 'Push Pull Legs', lt: 'Stūmimas Traukimas Kojos' },
      plan: {
        en: `Monday Push
- Shoulder press / Incline press 4x12
- Incline press / Shoulder press 3x12
- Lateral raise 4x15
- Facepull 3x15
- Tricep extension / Overhead tricep extension 4x12

Wednesday Pull
- Lat pulldown 4x12
- Row 3x12
- Upright row 3x12
- Facepull 3x15
- Hammer curl / DB curl 4x12

Friday Legs
- Squat 5x8
- RDL 3x8
- Bulgarian split 3x12
- Leg extension 3x12
- Calf raise 4x20`,
        lt: `Pirmadienis Stūmimas
- Pečių spaudimas / Spaudimas ant pasvirusio suolo 4x12
- Spaudimas ant pasvirusio suolo / Pečių spaudimas 3x12
- Šoniniai kėlimai 4x15
- Lyno trauka prie veido 3x15
- Tricepso tiesimas / Tricepso tiesimas virš galvos 4x12

Trečiadienis Traukimas
- Viršutinio bloko trauka 4x12
- Horizontali trauka 3x12
- Trauka prie smakro 3x12
- Lyno trauka prie veido 3x15
- Plaktuko lenkimas / Hantelių lenkimas 4x12

Penktadienis Kojos
- Pritūpimai 5x8
- Rumuniška mirties trauka 3x8
- Bulgariški įtūpstai 3x12
- Kojų tiesimas 3x12
- Blauzdų kėlimas 4x20`,
      },
    },
    {
      // From "3 Dienų Treniruočių Programa".
      name: { en: '3-day programme', lt: '3 dienų programa' },
      plan: {
        en: `Monday A
- Barbell squat 3x5-6
- Barbell bench press 3-4x6-8
- Seated cable row 3x8-10
- Machine leg curl 3x10-12
- Standing barbell curl 3x10-12
- Plank 3x45-60

Wednesday B
- Trap bar deadlift 3x5
- Smith machine shoulder press 3x6-8
- Lat pulldown to chest 3-4x8-10
- Machine leg extension 3x10-12
- Dumbbell lateral raise 3x12-15
- Cable triceps pushdown 3x10-12

Friday C
- 30° incline dumbbell press 3-4x8-10
- Leg press 3x10-12
- One-arm dumbbell row 3x8-10
- 45° back extension 3x10-12
- Reverse pec deck 3x12-15
- Hanging leg raise 3x10-12`,
        lt: `Pirmadienis A
- Pritūpimai su štanga 3x5-6
- Štangos spaudimas gulint 3-4x6-8
- Horizontalaus bloko trauka sėdint 3x8-10
- Kojų lenkimas staklėse 3x10-12
- Bicepso lenkimas su štanga stovint 3x10-12
- Lenta (Plank) 3x45-60

Trečiadienis B
- Trap Bar mirties trauka 3x5
- Pečių spaudimas Smito mašinoje 3x6-8
- Viršutinio bloko trauka prie krūtinės 3-4x8-10
- Kojų tiesimas treniruoklyje 3x10-12
- Hantelių kėlimas į šalis 3x12-15
- Tricepso tiesimas prie viršutinio bloko 3x10-12

Penktadienis C
- Hantelių spaudimas 30° kampu 3-4x8-10
- Kojų spaudimas treniruoklyje 3x10-12
- Vienos rankos hantelio trauka atsirėmus 3x8-10
- Nugaros ir sėdmenų tiesimas 45° suoliuke 3x10-12
- Galinės deltinių dalies atvedimas (Reverse Pec Deck) 3x12-15
- Kojų kėlimas kybant 3x10-12`,
      },
    },
  ];
  // A new phone starts with Push Pull Legs in its own language.
  const defaultPlan = () => PRESETS[0].plan[/^lt\b/i.test(navigator.language || '') ? 'lt' : 'en'];
  const PLAN_MAX = 10000;

  const empty = () => ({ version: 1, plan: defaultPlan(), filledFrom: null, lastBackup: null, lang: null, days: {} });
  let storageOk = true;

  // A target is sets x reps, each optionally a range ("3-4 x 6-8" -> setsTo 4, repsTo 8).
  const validTarget = t => t && typeof t === 'object' &&
    Number.isInteger(t.sets) && t.sets >= 1 && t.sets <= 20 &&
    Number.isInteger(t.reps) && t.reps >= 1 && t.reps <= 999 &&
    (t.setsTo === undefined || (Number.isInteger(t.setsTo) && t.setsTo > t.sets && t.setsTo <= 20)) &&
    (t.repsTo === undefined || (Number.isInteger(t.repsTo) && t.repsTo > t.reps && t.repsTo <= 999));
  const copyTarget = t => Object.assign({ sets: t.sets, reps: t.reps },
    t.setsTo && { setsTo: t.setsTo }, t.repsTo && { repsTo: t.repsTo });
  const fmtTarget = t => `${t.sets}${t.setsTo ? `–${t.setsTo}` : ''} × ${t.reps}${t.repsTo ? `–${t.repsTo}` : ''}`;

  // Accepts anything (localStorage or an imported file) and returns clean data, or null.
  function sanitize(input) {
    if (!input || typeof input !== 'object' || !input.days ||
        typeof input.days !== 'object' || Array.isArray(input.days)) return null;
    const days = {};
    for (const k of Object.keys(input.days)) {
      const list = input.days[k];
      if (!isDayKey(k) || !Array.isArray(list)) continue;
      const exs = [];
      for (const e of list) {
        if (!e || typeof e !== 'object' || typeof e.name !== 'string') continue;
        const name = clean(e.name);
        if (!name) continue;
        const sets = [];
        if (Array.isArray(e.sets)) {
          for (const s of e.sets) {
            if (!s || typeof s !== 'object') continue;
            const reps = Number(s.reps);
            const kg = Number(s.kg);
            if (!Number.isInteger(reps) || reps < 1 || reps > 999) continue;
            sets.push({ kg: Number.isFinite(kg) && kg >= 0 && kg <= 1000 ? round2(kg) : 0, reps });
          }
        }
        exs.push(validTarget(e.target) ? { name, sets, target: copyTarget(e.target) } : { name, sets });
      }
      days[k] = exs; // an empty day is kept: it means "started, then cleared" (don't reload the plan)
    }
    return {
      version: 1,
      plan: typeof input.plan === 'string' ? input.plan.slice(0, PLAN_MAX) : defaultPlan(),
      // Which day the plan last filled, and the plan text it used (see followPlan).
      filledFrom: input.filledFrom && typeof input.filledFrom === 'object' &&
        isDayKey(input.filledFrom.key) && typeof input.filledFrom.plan === 'string'
        ? { key: input.filledFrom.key, plan: input.filledFrom.plan.slice(0, PLAN_MAX) }
        : null,
      // The day of the last export or import (for the backup reminder in History).
      lastBackup: typeof input.lastBackup === 'string' && isDayKey(input.lastBackup) ? input.lastBackup : null,
      lang: input.lang === 'lt' || input.lang === 'en' ? input.lang : null,
      days,
    };
  }

  function load() {
    let raw;
    try { raw = localStorage.getItem(KEY); } catch (_) { storageOk = false; return empty(); }
    if (raw == null) return empty();
    try {
      const data = sanitize(JSON.parse(raw));
      if (data) return data;
    } catch (_) { /* fall through */ }
    // Never overwrite something we couldn't read: park it under another key first.
    try { localStorage.setItem(`${KEY}.unreadable.${Date.now()}`, raw); } catch (_) { /* ignore */ }
    return empty();
  }

  let db = load();
  let askedPersist = false;

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(db));
      storageOk = true;
    } catch (_) {
      storageOk = false;
    }
    // Show or hide the warning in place, without re-rendering (keeps focus and scroll).
    const warn = app.querySelector('.warn');
    if (warn) warn.hidden = storageOk;
    if (!askedPersist && navigator.storage && navigator.storage.persist) {
      askedPersist = true;
      navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {});
    }
  }

  /* ---------- queries ---------- */

  const sortedKeys = () => Object.keys(db.days).sort();

  // Exercise names from the presets, linked to their translation by position:
  // norm(name) -> { en, lt }. Built on first use.
  let nameMap = null;
  function names() {
    if (nameMap) return nameMap;
    nameMap = new Map();
    const link = (en, lt) => {
      const pair = { en, lt };
      nameMap.set(norm(en), pair);
      nameMap.set(norm(lt), pair);
    };
    for (const p of PRESETS) {
      const en = parsePlan(p.plan.en);
      const lt = parsePlan(p.plan.lt);
      en.forEach((r, i) => {
        if (!lt[i]) return;
        r.items.forEach((it, j) => it.names.forEach((n, k) => {
          const other = lt[i].items[j] && lt[i].items[j].names[k];
          if (other) link(n, other);
        }));
      });
    }
    return nameMap;
  }
  // The same exercise whatever language it was written in ("Squat" = "Pritūpimai").
  const same = name => { const pair = names().get(norm(name)); return pair ? `en:${norm(pair.en)}` : norm(name); };
  // A name shown in the current language, when it's one the presets know.
  const shown = name => { const pair = names().get(norm(name)); return pair ? pair[lang()] : name; };

  // Most recent earlier day that has sets for this exercise.
  function previous(key, name) {
    const n = same(name);
    const keys = sortedKeys();
    for (let i = keys.length - 1; i >= 0; i--) {
      if (keys[i] >= key) continue;
      const ex = db.days[keys[i]].find(e => same(e.name) === n && e.sets.length);
      if (ex) return { key: keys[i], sets: ex.sets };
    }
    return null;
  }

  // What tapping "+" with empty fields would log: today's last set, else last session's
  // first set (with the planned reps, if the exercise came from the plan).
  function suggestion(key, ex) {
    if (ex.sets.length) return ex.sets[ex.sets.length - 1];
    const prev = previous(key, ex.name);
    if (ex.target) return { kg: prev ? prev.sets[0].kg : 0, reps: ex.target.reps };
    return prev ? prev.sets[0] : null;
  }

  // Days with at least one logged set. An exercise added but never done isn't a workout.
  const workoutKeys = days => Object.keys(days).filter(k => days[k].some(e => e.sets.length)).sort();

  function allNames() {
    const seen = new Set();
    const out = [];
    for (const k of sortedKeys().reverse()) {
      for (const e of db.days[k]) {
        if (!e.sets.length) continue;
        const n = same(e.name);
        if (!seen.has(n)) { seen.add(n); out.push(shown(e.name)); }
      }
    }
    return out;
  }

  function refreshNames() {
    namesList.textContent = '';
    for (const n of allNames()) namesList.append(el('option', { value: n }));
  }

  // Reuse the spelling from earlier workouts so "bench press" matches "Bench press".
  const canonical = name => (names().has(norm(name)) ? shown(name) : allNames().find(n => norm(n) === norm(name)) || name);

  /* ---------- plan ---------- */

  const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const WEEKDAYS_LT = ['sekmadienis', 'pirmadienis', 'antradienis', 'treciadienis', 'ketvirtadienis', 'penktadienis', 'sestadienis'];
  const plain = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z]/g, '');

  // The weekday a heading starts with, else -1. English: any 3+ letter prefix ("Mon", "Monday").
  // Lithuanian: the word must reach "…dien…" ("Pirmadienis"), so "Pirma diena" isn't Monday.
  function weekdayOf(word) {
    const w = plain(word);
    if (w.length < 3) return -1;
    const en = WEEKDAYS.findIndex(d => d.toLowerCase().startsWith(w));
    if (en > -1) return en;
    return w.includes('dien') ? WEEKDAYS_LT.findIndex(d => d.startsWith(w)) : -1;
  }

  // The target at the end of an exercise line: "4x12", "3-4x6-8", "(5x8)". Returns the target
  // and where the name ends, or null (then the whole text stays the name, so nothing vanishes).
  // A sets range is written tight and rising ("3-4x8"); otherwise its first number belongs to the
  // name: "Superset 1 - 3x10" → "Superset 1", "Incline 15-3x10" → "Incline 15", both 3 × 10.
  // A reps range that doesn't rise is ignored: "3x12-10" → 3 × 12.
  function readTarget(body) {
    const m = body.match(/(?:^|[\s(])(\d{1,2})(?:[-–—](\d{1,2}))?\s*[x×X*]\s*(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?\s*\)?\.?\s*$/);
    if (!m) return null;
    const lead = m[0].length - m[0].replace(/^[\s(]/, '').length; // the space or "(" before the numbers
    let cut = m.index;
    const t = { sets: Number(m[1]), reps: Number(m[3]) };
    if (m[2] && Number(m[2]) > t.sets) t.setsTo = Number(m[2]);
    else if (m[2]) {
      t.sets = Number(m[2]);
      cut = m.index + lead + m[1].length + 1; // keep "Incline 15-" as the name; the dash is trimmed later
    }
    if (m[4] && Number(m[4]) > t.reps) t.repsTo = Number(m[4]);
    return validTarget(t) ? { target: t, cut } : null;
  }

  // "Monday Push" starts a routine (the weekday is optional), "- A / B 4x12" adds an exercise.
  function parsePlan(text) {
    const routines = [];
    let cur = null;
    for (const raw of String(text || '').split(/\r?\n/)) {
      const line = raw.trim();
      if (!line) continue;
      const item = line.match(/^[-–—•*]\s*(.*)$/);
      if (item) {
        if (!cur) continue;
        let body = item[1];
        const read = readTarget(body);
        const target = read && read.target;
        if (read) body = body.slice(0, read.cut);
        // "Squat: 5x8", "Squat - 5x8" and "Squat (5x8)" all mean "Squat".
        const names = body.split('/').map(s => clean(s.replace(/[\s:,·•–—(-]+$/, ''))).filter(Boolean);
        if (names.length) cur.items.push({ names, target });
        continue;
      }
      const [first, ...rest] = line.split(/\s+/);
      const day = weekdayOf(first);
      const name = day > -1 ? clean(rest.join(' ').replace(/^[:·•–—-]+\s*/, '')) || WEEKDAYS[day] : clean(line);
      cur = { name, day: day > -1 ? day : null, items: [] };
      routines.push(cur);
    }
    return routines.filter(r => r.items.length);
  }

  // Alternates ("A / B") take turns: count the earlier sessions of this routine; every slot
  // moves on one step per session and cycles through however many alternates it has.
  function rotation(key, routine) {
    if (!routine.items.some(it => it.names.length > 1)) return 0;
    let sessions = 0;
    for (const k of sortedKeys()) {
      if (k >= key) break;
      if (db.days[k].some(e => e.sets.length) && dayTitle(k) === routine.name) sessions++;
    }
    return sessions;
  }

  // The big title on a day: the name of the planned workout it matches best ("Push"),
  // "Workout" for anything else, "Rest" when nothing is there.
  function dayTitle(key) {
    const names = (db.days[key] || []).map(e => same(e.name));
    if (!names.length) return T().rest;
    const dow = dateOf(key).getDay();
    let best = null;
    let bestScore = 0;
    for (const r of parsePlan(db.plan)) {
      const pool = new Set(r.items.flatMap(it => it.names.map(same)));
      const score = names.filter(n => pool.has(n)).length;
      if (score > bestScore || (score && score === bestScore && r.day === dow && best.day !== dow)) {
        best = r;
        bestScore = score;
      }
    }
    return best && bestScore * 2 >= names.length ? best.name : T().workout;
  }

  function retitle(key) {
    const t = app.querySelector('.title');
    if (t && current.view === 'day' && current.key === key) t.textContent = dayTitle(key);
  }

  function loadRoutine(key, routine) {
    const turn = rotation(key, routine);
    const day = db.days[key] || (db.days[key] = []);
    for (const it of routine.items) {
      const name = canonical(it.names[turn % it.names.length]);
      if (day.some(e => same(e.name) === same(name))) continue;
      day.push(it.target ? { name, sets: [], target: copyTarget(it.target) } : { name, sets: [] });
    }
    db.filledFrom = { key, plan: db.plan };
    save();
  }

  // Today was filled from an older version of the plan and nothing is logged yet: refill it
  // from the current plan's workout for this weekday (or make it a rest day if there is none).
  // Works however the plan was changed: in the app, before closing it, or by an import.
  function followPlan(key) {
    const from = db.filledFrom;
    const day = db.days[key];
    if (!from || from.key !== key || from.plan === db.plan) return;
    if (!day || !day.length || day.some(e => e.sets.length)) return;
    delete db.days[key];
    const routine = parsePlan(db.plan).find(r => r.day === dateOf(key).getDay());
    if (routine) return loadRoutine(key, routine);
    db.filledFrom = null;
    save();
  }

  /* ---------- tap-to-reveal "remove" ---------- */

  let revealed = null;

  function reveal(btn) {
    if (revealed && revealed !== btn) revealed.classList.remove('on');
    btn.classList.toggle('on');
    revealed = btn.classList.contains('on') ? btn : null;
  }

  function closeReveal() {
    if (revealed) { revealed.classList.remove('on'); revealed = null; }
  }

  document.addEventListener('pointerdown', e => {
    if (revealed && !e.target.closest('.remove, [data-reveal]')) closeReveal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReveal(); });

  /* ---------- views ---------- */

  let current = {};
  const blocks = new WeakMap();

  // The Track. mark (the #mark symbol in the page, same geometry as logo.svg).
  function mark() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 98.71 100');
    svg.setAttribute('class', 'mark');
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS(ns, 'use');
    use.setAttribute('href', '#mark');
    svg.append(use);
    return svg;
  }

  function header() {
    return el('div', null,
      el('header', null, el('a', { href: '#/', class: 'brand' }, mark(), 'Track.')),
      el('p', { class: 'warn', hidden: storageOk }, T().cantSave));
  }

  const tabs = {
    history: document.getElementById('tab-history'),
    today: document.getElementById('tab-today'),
    plan: document.getElementById('tab-plan'),
  };

  // Light up the current tab. A past day belongs to History, whose tab leads back to its month.
  function updateTabs() {
    const pastDay = current.view === 'day' && !current.isToday;
    const active = current.view === 'history' || pastDay ? 'history' : current.view === 'plan' ? 'plan' : 'today';
    for (const [name, tab] of Object.entries(tabs)) {
      if (name === active) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    }
    tabs.history.setAttribute('href', pastDay ? `#/history/${current.key.slice(0, 7)}` : '#/history');
  }

  // Already on today: the middle button goes back to the top.
  tabs.today.addEventListener('click', e => {
    if (current.view === 'day' && current.isToday) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  // Hide the tab bar only while the on-screen keyboard is actually up. Focus alone isn't enough:
  // Android's back gesture (and its Done key) closes the keyboard but leaves the field focused,
  // which used to leave the bar invisible, so the first tap on it did nothing.
  const vv = window.visualViewport;
  // fullHeight is the keyboard-free height; it's re-measured after a rotation or resize (the
  // layout height doesn't shrink for the keyboard on iOS or current Android Chrome).
  let fullHeight = window.innerHeight;
  let lastWidth = window.innerWidth;
  function syncKeyboard() {
    const el = document.activeElement;
    const typing = !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
    const visible = vv ? vv.height * vv.scale : window.innerHeight;
    if (!typing || window.innerWidth !== lastWidth) {
      lastWidth = window.innerWidth;
      fullHeight = Math.max(window.innerHeight, visible);
    } else {
      fullHeight = Math.max(fullHeight, visible);
    }
    document.body.classList.toggle('kb', typing && visible < fullHeight - 120);
  }
  if (vv) vv.addEventListener('resize', syncKeyboard);
  window.addEventListener('resize', syncKeyboard);
  document.addEventListener('focusin', syncKeyboard);
  document.addEventListener('focusout', () => setTimeout(syncKeyboard, 0));
  // iOS only shows :active (the tap feedback on the tabs) when a touch listener exists.
  document.addEventListener('touchstart', () => {}, { passive: true });

  function mount(view) {
    revealed = null;
    refitPlan = null;
    applyLang();
    app.textContent = '';
    app.append(view);
    updateTabs();
    window.scrollTo(0, 0);
  }

  function renderDay(key, isToday) {
    current = { view: 'day', key, isToday };
    if (isToday) followPlan(key);
    // A planned weekday fills itself in the first time it's opened; any other day is a rest day.
    if (isToday && !Object.prototype.hasOwnProperty.call(db.days, key)) {
      const planned = parsePlan(db.plan).find(r => r.day === dateOf(key).getDay());
      if (planned) loadRoutine(key, planned);
    }
    const exs = db.days[key] || [];
    const list = el('section', { class: 'list', 'aria-label': T().exercises });
    for (const ex of exs) list.append(exerciseBlock(key, ex));
    mount(el('div', { class: 'view' },
      header(),
      el('h1', { class: 'title' }, dayTitle(key)),
      el('p', { class: 'sub' }, fullDate(key)),
      list,
      addExerciseForm(key, list)));
  }

  function exerciseBlock(key, ex) {
    const label = shown(ex.name);
    const sets = el('div', { class: 'sets' });
    const nextPrev = el('span', { class: 'prev' });
    const num = el('span', { class: 'n', 'aria-hidden': 'true' });
    const kg = el('input', {
      class: 'kg', inputmode: 'decimal', enterkeyhint: 'next',
      autocomplete: 'off', 'aria-label': T().weight(label),
      onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); reps.focus(); } },
    });
    const reps = el('input', {
      class: 'reps', inputmode: 'numeric', pattern: '[0-9]*', enterkeyhint: 'done',
      autocomplete: 'off', 'aria-label': T().reps(label),
      onkeydown: e => { if (e.key === 'Enter') tapped = false; },
    });

    // Tapping "+" logs and closes the keyboard; Enter keeps focus for fast typing.
    let tapped = false;
    const plus = el('button', {
      class: 'act plus', 'aria-label': T().addSet(label),
      onpointerdown: () => { tapped = true; },
      onpointercancel: () => { tapped = false; },
    }, '+');

    const entry = el('form', { class: 'row entry', novalidate: true, onsubmit: addSet },
      num, kg, el('span', { class: 'u' }, 'kg'), el('span', { class: 'u' }, '×'), reps, nextPrev, plus);

    const remove = el('button', {
      type: 'button', class: 'act remove', 'aria-label': T().removeExercise(label), onclick: removeExercise,
    }, T().remove);
    const name = el('button', {
      type: 'button', class: 'ex-name', 'data-reveal': '', onclick: () => reveal(remove),
    }, label);

    const target = ex.target && el('span', { class: 'target' }, fmtTarget(ex.target));
    const block = el('article', { class: 'ex' }, el('div', { class: 'head' }, name, remove, target), sets, entry);
    blocks.set(ex, block);
    paint(false);
    return block;

    function paint(added) {
      const before = previous(key, ex.name);
      const ref = before ? before.sets : [];
      sets.textContent = '';
      ex.sets.forEach((s, i) => sets.append(setRow(s, i, added && i === ex.sets.length - 1, ref[i])));
      const sug = suggestion(key, ex);
      num.textContent = ex.sets.length + 1;
      kg.placeholder = sug && sug.kg ? fmtKg(sug.kg) : '0';
      reps.placeholder = sug ? String(sug.reps) : '0';
      fillPrev(nextPrev, ref[ex.sets.length]);
    }

    function fillPrev(span, s) {
      span.textContent = '';
      if (s) span.append(el('span', { class: 'sr' }, T().lastTime), setText(s));
      return span;
    }

    // Tap the row to show "remove". The button is always reachable by keyboard and screen readers.
    function setRow(s, i, fresh, then) {
      const rm = el('button', {
        type: 'button', class: 'act remove', 'aria-label': T().removeSet(i + 1),
        onclick: () => {
          const j = ex.sets.indexOf(s);
          if (j > -1) ex.sets.splice(j, 1);
          save();
          paint(false);
        },
      }, T().remove);
      return el('div', {
        class: 'row set' + (fresh ? ' fresh' : ''), 'data-reveal': '',
        onclick: e => { if (!e.target.closest('.remove')) reveal(rm); },
      },
        el('span', { class: 'n' }, i + 1),
        el('span', { class: 'w' }, s.kg ? fmtKg(s.kg) : ''),
        el('span', { class: 'u' }, s.kg ? 'kg' : 'bw'),
        el('span', { class: 'u' }, '×'),
        el('span', null, s.reps),
        rm,
        then && fillPrev(el('span', { class: 'prev' }), then));
    }

    function nudge(input) {
      input.classList.remove('nope');
      void input.offsetWidth; // restart the animation
      input.classList.add('nope');
      input.focus();
      input.select();
    }

    function addSet(e) {
      e.preventDefault();
      const viaTap = tapped;
      tapped = false;
      const sug = suggestion(key, ex);
      const w = kg.value.trim() ? parseKg(kg.value) : (sug ? sug.kg : 0);
      const r = reps.value.trim() ? parseReps(reps.value) : (sug ? sug.reps : null);
      if (w == null) return nudge(kg);
      if (r == null) return nudge(reps);
      ex.sets.push({ kg: w, reps: r });
      save();
      if (ex.sets.length === 1) refreshNames();
      kg.value = '';
      reps.value = '';
      closeReveal();
      paint(true);
      if (viaTap && document.activeElement && entry.contains(document.activeElement)) document.activeElement.blur();
    }

    function removeExercise() {
      const day = db.days[key];
      if (day) {
        const i = day.indexOf(ex);
        if (i > -1) day.splice(i, 1); // an emptied day stays, so the plan doesn't refill it
      }
      save();
      revealed = null;
      block.remove();
      refreshNames();
      retitle(key);
    }
  }

  function addExerciseForm(key, list) {
    const input = el('input', {
      placeholder: T().addExercise, list: 'names', enterkeyhint: 'done', maxlength: '60',
      autocomplete: 'off', autocapitalize: 'sentences', 'aria-label': T().addExercise,
    });
    return el('form', {
      class: 'add-ex',
      onsubmit: e => {
        e.preventDefault();
        const name = clean(input.value);
        if (!name) return;
        input.value = '';
        const day = db.days[key] || [];
        const existing = day.find(x => same(x.name) === same(name));
        if (existing) {
          const b = blocks.get(existing);
          if (b) b.querySelector('.kg').focus();
          return;
        }
        const ex = { name: canonical(name), sets: [] };
        day.push(ex);
        db.days[key] = day;
        save();
        const block = exerciseBlock(key, ex);
        block.classList.add('fresh');
        list.append(block);
        refreshNames();
        retitle(key);
        block.querySelector('.kg').focus();
      },
    }, input);
  }

  const monthKey = (y, m) => `${y}-${pad(m + 1)}`;

  // History is a month calendar: tap a day to open it. Months change with ‹ › or a swipe.
  function renderHistory(ym) {
    const now = new Date();
    const y = ym ? ym.y : now.getFullYear();
    const m = ym ? ym.m : now.getMonth();
    current = { view: 'history', y, m };
    const today = todayKey();
    const prev = m === 0 ? monthKey(y - 1, 11) : monthKey(y, m - 1);
    const next = m === 11 ? monthKey(y + 1, 0) : monthKey(y, m + 1);
    const canNext = next <= monthKey(now.getFullYear(), now.getMonth());

    const cal = el('div', { class: 'cal', role: 'group', 'aria-label': T().days });
    for (const d of T().weekInitials) cal.append(el('span', { class: 'wd', 'aria-hidden': 'true' }, d));
    const lead = (new Date(y, m, 1).getDay() + 6) % 7; // weeks start on Monday
    for (let i = 0; i < lead; i++) cal.append(el('span', { 'aria-hidden': 'true' }));
    let count = 0;
    const last = new Date(y, m + 1, 0).getDate();
    // Today isn't a rest day yet if a workout is planned for it.
    const plannedToday = parsePlan(db.plan).some(r => r.day === now.getDay());
    for (let d = 1; d <= last; d++) {
      const k = `${monthKey(y, m)}-${pad(d)}`;
      const done = (db.days[k] || []).some(e => e.sets.length);
      if (done) count++;
      const future = k > today;
      const rest = !done && !future && !(k === today && plannedToday);
      const cls = `cal-day${done ? ' has' : ''}${k === today ? ' today' : ''}${future ? ' future' : ''}`;
      const name = done ? dayTitle(k) : rest && T().rest;
      const kids = [el('span', { class: 'num' }, d), name && el('span', { class: `cal-name${rest ? ' rest' : ''}` }, name)];
      cal.append(future
        ? el('span', { class: cls, 'aria-hidden': 'true' }, ...kids)
        : el('a', { class: cls, href: `#/${k}`, 'aria-label': name ? `${fullDate(k)}, ${name}` : fullDate(k) }, ...kids));
    }

    // Swipe sideways on the calendar to change month.
    let sx = null;
    let sy = 0;
    cal.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    cal.addEventListener('touchend', e => {
      if (sx == null) return;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      sx = null;
      if (Math.abs(dx) < 60 || Math.abs(dx) < 2 * Math.abs(dy)) return;
      if (dx > 0) location.hash = `#/history/${prev}`;
      else if (canNext) location.hash = `#/history/${next}`;
    });

    const file = el('input', { type: 'file', accept: '.json,application/json', hidden: true, onchange: () => importFile(file) });
    const due = backupDue();
    mount(el('div', { class: 'view' },
      header(),
      el('h1', { class: 'title' }, cap(new Date(y, m, 1).toLocaleDateString(lang() === 'lt' ? 'lt-LT' : 'en-GB', { month: 'long' }))),
      el('div', { class: 'subrow' },
        el('p', { class: 'sub' }, `${y} · ${count ? T().workouts(count) : T().nothingLogged}`),
        el('nav', { class: 'months', 'aria-label': T().month },
          el('a', { href: `#/history/${prev}`, 'aria-label': T().prevMonth }, '‹'),
          canNext
            ? el('a', { href: `#/history/${next}`, 'aria-label': T().nextMonth }, '›')
            : el('span', { class: 'off', 'aria-hidden': 'true' }, '›'))),
      cal,
      el('footer', null,
        due && el('p', { class: 'backup' }, due),
        el('div', { class: 'backup-actions' },
          el('button', { type: 'button', class: due ? 'due' : null, onclick: exportData }, T().exportLabel),
          el('button', { type: 'button', onclick: () => file.click() }, T().importLabel),
          file))));
  }

  // A quiet nudge two weeks after the last backup (or after the first workout, if never backed up),
  // but only when something has been logged since that backup.
  function backupDue() {
    const keys = workoutKeys(db.days);
    if (!keys.length) return null;
    if (db.lastBackup && db.lastBackup >= keys[keys.length - 1]) return null;
    const since = db.lastBackup || keys[0];
    const days = Math.round((dateOf(todayKey()) - dateOf(since)) / 86400000);
    if (days < 14) return null;
    return db.lastBackup ? T().lastBackup(days) : T().noBackup;
  }

  let planTimer = 0;
  function flushPlan() {
    if (!planTimer) return;
    clearTimeout(planTimer);
    planTimer = 0;
    save();
  }
  window.addEventListener('pagehide', flushPlan);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushPlan(); });

  let refitPlan = null;
  window.addEventListener('resize', () => { if (refitPlan) refitPlan(); });

  function setLang(l) {
    if (lang() === l && db.lang === l) return;
    flushPlan();
    // An unedited preset follows the language; a plan you wrote stays as written.
    const now = db.plan.trim();
    const preset = PRESETS.find(p => p.plan.en.trim() === now || p.plan.lt.trim() === now);
    db.lang = l;
    if (preset) db.plan = preset.plan[l];
    save();
    renderPlan();
  }

  // Page language and the tab bar's labels (the bar lives outside the views).
  function applyLang() {
    const t = T();
    document.documentElement.lang = lang();
    document.querySelector('.tabbar').setAttribute('aria-label', t.tabs.main);
    tabs.history.setAttribute('aria-label', t.tabs.history);
    tabs.today.setAttribute('aria-label', t.tabs.today);
    tabs.plan.setAttribute('aria-label', t.tabs.plan);
  }

  const isPreset = (p, text) => p.plan.en.trim() === text.trim() || p.plan.lt.trim() === text.trim();

  function usePreset(preset) {
    const now = db.plan.trim();
    if (now === preset.plan[lang()].trim()) return;
    // Only ask when it would throw away a plan you wrote or changed yourself.
    const own = now && !PRESETS.some(p => isPreset(p, now));
    if (own && !confirm(T().replacePlan(preset.name[lang()]))) return;
    clearTimeout(planTimer);
    planTimer = 0;
    db.plan = preset.plan[lang()];
    save();
    renderPlan();
  }

  function renderPlan() {
    current = { view: 'plan' };
    const summary = el('p', { class: 'sub' });
    const area = el('textarea', {
      class: 'plan', rows: '12', spellcheck: 'false', autocapitalize: 'sentences', 'aria-label': T().plan,
    });
    area.value = db.plan;
    area.placeholder = T().planPlaceholder;
    // Grow to fit the text. Collapsing it to measure would shorten the page for a moment and
    // make the browser jump the scroll, so the scroll position is put back.
    const fit = () => {
      const se = document.scrollingElement || document.documentElement;
      const y = se.scrollTop;
      area.style.height = 'auto';
      area.style.height = `${area.scrollHeight}px`;
      se.scrollTop = y;
    };
    // Presets: tap to load one. The one matching the text is lit.
    const presetButtons = PRESETS.map(p => el('button', { type: 'button', onclick: () => usePreset(p) }, p.name[lang()]));
    const describe = () => {
      const rs = parsePlan(area.value);
      summary.textContent = rs.length
        ? rs.map(r => (r.day == null ? r.name : `${T().dayShort[r.day]} ${r.name}`)).join(' · ')
        : T().nothingPlanned;
      PRESETS.forEach((p, i) => presetButtons[i].setAttribute('aria-pressed', String(isPreset(p, area.value))));
    };
    // Memory is updated on every keystroke (so leaving the screen uses the new plan right
    // away); the write to storage is batched.
    area.addEventListener('input', () => {
      if (area.value.length > PLAN_MAX) area.value = area.value.slice(0, PLAN_MAX);
      db.plan = area.value;
      fit();
      describe();
      clearTimeout(planTimer);
      planTimer = setTimeout(flushPlan, 400);
    });
    area.addEventListener('blur', flushPlan);
    mount(el('div', { class: 'view' },
      header(),
      el('h1', { class: 'title' }, T().plan),
      el('div', { class: 'subrow' },
        summary,
        el('nav', { class: 'lang', 'aria-label': T().language },
          ...['lt', 'en'].flatMap((l, i) => [
            i ? el('span', { 'aria-hidden': 'true' }, '·') : null,
            el('button', { type: 'button', lang: l, 'aria-pressed': String(lang() === l), onclick: () => setLang(l) }, l.toUpperCase()),
          ]))),
      el('div', { class: 'presets', role: 'group', 'aria-label': T().presets }, ...presetButtons),
      area,
      el('p', { class: 'hint' }, ...T().hint)));
    describe();
    refitPlan = fit;
    requestAnimationFrame(fit);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (refitPlan === fit) fit(); });
  }

  /* ---------- backup ---------- */

  async function exportData() {
    const name = `track-${todayKey()}.json`;
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const touch = window.matchMedia('(pointer: coarse)').matches;
    if (touch && typeof File === 'function' && navigator.canShare) {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        let shared = false;
        try { await navigator.share({ files: [file] }); shared = true; } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
        if (shared) return backedUp();
      }
    }
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    backedUp();
  }

  // Clear the reminder in place (a redraw would jump the page back to the top).
  function backedUp() {
    db.lastBackup = todayKey();
    save();
    const note = app.querySelector('footer .backup');
    if (note) note.remove();
    const due = app.querySelector('footer .due');
    if (due) due.classList.remove('due');
  }

  async function importFile(input) {
    const f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    let data = null;
    let parsed = null;
    try { parsed = JSON.parse(await f.text()); data = sanitize(parsed); } catch (_) { /* handled below */ }
    if (!data) { alert(T().notABackup); return; }
    if (typeof parsed.plan !== 'string') data.plan = db.plan; // older backups have no plan: keep yours
    const n = workoutKeys(data.days).length;
    if (!confirm(T().replaceAll(n))) return;
    data.lang = db.lang; // the language is this phone's choice, not the file's
    db = data;
    db.lastBackup = todayKey(); // this phone now matches a backup file you have
    save();
    refreshNames();
    route();
  }

  /* ---------- routing ---------- */

  function route() {
    if (current.view === 'plan') flushPlan();
    let h = location.hash.replace(/^#\/?/, '');
    try { h = decodeURIComponent(h); } catch (_) { h = ''; }
    const hm = h.match(/^history(?:\/(\d{4})-(\d{2}))?$/);
    if (hm) {
      const mm = hm[2] ? Number(hm[2]) - 1 : -1;
      return renderHistory(hm[1] && mm >= 0 && mm <= 11 && Number(hm[1]) >= 1970 ? { y: Number(hm[1]), m: mm } : null);
    }
    if (h === 'plan') return renderPlan();
    // Today's date (e.g. tapped in History) is home, so it rolls over at midnight like home does.
    if (h === todayKey()) { history.replaceState(null, '', '#/'); return renderDay(h, true); }
    if (isDayKey(h)) return renderDay(h, false);
    renderDay(todayKey(), true);
  }

  window.addEventListener('hashchange', route);

  // Another tab changed the data: reload it rather than overwrite it later.
  window.addEventListener('storage', e => {
    if (e.key === KEY || e.key === null) { db = load(); refreshNames(); route(); }
  });

  // Left open past midnight: roll the home screen over to the new day.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && current.view === 'day' &&
        current.isToday && current.key !== todayKey()) route();
  });

  refreshNames();
  route();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
