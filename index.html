    if (!t || typeof t !== 'object') return out;
    for (const k of Object.keys(t)) {
      if (isDayKey(k) && typeof t[k] === 'string') out[k] = clean(t[k]).slice(0, 60);
    }
    return out;
  }

  // Workout clocks: { 'YYYY-MM-DD': { start, end } } in ms; end is null while it runs.
  function cleanTimers(t) {
    const out = {};
    if (!t || typeof t !== 'object') return out;
    for (const k of Object.keys(t)) {
      const v = t[k];
      if (!isDayKey(k) || !v || typeof v !== 'object' || !Number.isFinite(v.start) || v.start <= 0) continue;
      const end = Number.isFinite(v.end) && v.end >= v.start ? v.end : null;
      out[k] = { start: Math.round(v.start), end: end == null ? null : Math.round(end) };
    }
    return out;
  }

  function load() {
    let raw;
    try { raw = localStorage.getItem(KEY); } catch (_) { storageOk = false; return empty(); }
    if (raw == null) return empty();
    try {
      const data = sanitize(JSON.parse(raw));
      if (data) return data;
    } catch (_) { /* fall through */ }
    // Never overwrite something we couldn't read: park it under another key first.
    try { localStorage.setItem(`${KEY}.unreadable.${Date.now()}`, raw); } catch (_) { /* ignore */ }
    return empty();
  }

  let db = load();
  let askedPersist = false;

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(db));
      storageOk = true;
    } catch (_) {
      storageOk = false;
    }
    // Show or hide the warning in place, without re-rendering (keeps focus and scroll).
    const warn = app.querySelector('.warn');
    if (warn) warn.hidden = storageOk;
    if (!askedPersist && navigator.storage && navigator.storage.persist) {
      askedPersist = true;
      navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {});
    }
  }

  /* ---------- queries ---------- */

  const sortedKeys = () => Object.keys(db.days).sort();

  // Exercise names from the presets, linked to their translation by position:
  // norm(name) -> { en, lt }. Built on first use.
  let nameMap = null;
  function names() {
    if (nameMap) return nameMap;
    nameMap = new Map();
    const link = (en, lt) => {
      const pair = { en, lt };
      nameMap.set(norm(en), pair);
      nameMap.set(norm(lt), pair);
      nameMap.set(`~${bare(norm(lt))}`, pair);   // "Spaudimas gulint" finds "Štangos spaudimas gulint"
    };
    for (const p of PRESETS) {
      const en = parsePlan(p.plan.en);
      const lt = parsePlan(p.plan.lt);
      en.forEach((r, i) => {
        if (!lt[i]) return;
        r.items.forEach((it, j) => it.names.forEach((n, k) => {
          const other = lt[i].items[j] && lt[i].items[j].names[k];
          if (other) link(n, other);
        }));
      });
    }
    return nameMap;
  }
  // The same exercise whatever language or spelling it was written in: "Squat" = "Pritūpimai",
  // and a barbell is the default ("Bench press" = "Barbell bench press" = "Štangos spaudimas gulint").
  // So switching plans keeps your last sets for every lift the plans share.
  const bare = n => n.replace(/\b(barbell|flat)\b|\bsu štanga\b|(^|\s)štangos(?=\s|$)/g, ' ').replace(/\s+/g, ' ').trim();
  const sameCache = new Map();   // the presets never change, so neither does the answer for a name
  const same = name => {
    let key = sameCache.get(name);
    if (key !== undefined) return key;
    const n = norm(name);
    const pair = names().get(n) || names().get(`~${bare(n)}`);
    key = bare(pair ? norm(pair.en) : n) || n;
    sameCache.set(name, key);
    return key;
  };

  // Most recent earlier day that has sets for this exercise.
  function previous(key, name) {
    const n = same(name);
    const keys = sortedKeys();
    for (let i = keys.length - 1; i >= 0; i--) {
      if (keys[i] >= key) continue;
      const ex = db.days[keys[i]].find(e => same(e.name) === n && e.sets.length);
      if (ex) return { key: keys[i], sets: ex.sets };
    }
    return null;
  }

  // What tapping "+" with empty fields would log: today's last set, else last session's
  // first set (with the planned reps, if the exercise came from the plan).
  function suggestion(key, ex) {
    if (ex.sets.length) return ex.sets[ex.sets.length - 1];
    const cardio = cardioEx(ex);
    const found = previous(key, ex.name);
    const prev = found && (found.sets[0].min !== undefined) === cardio ? found : null;   // same kind only
    if (cardio) return prev ? prev.sets[0] : ex.aim ? { min: ex.aim.min || 0, km: ex.aim.km || 0 } : null;
    if (ex.target) {
      if (!prev) return { kg: 0, reps: ex.target.reps };
      const up = bumpFrom(prev.sets, ex.target);
      return { kg: up ? round2(up + BUMP) : prev.sets[0].kg, reps: ex.target.reps };
    }
    return prev ? prev.sets[0] : null;
  }

  // Every planned set reached the top of the rep range at your working (heaviest) weight: time
  // to go up from it. Returns that weight, or 0. Lighter warm-up sets don't count either way.
  const BUMP = 2.5;
  function bumpFrom(sets, target) {
    const kg = Math.max(...sets.map(s => s.kg || 0));
    const top = target.repsTo || target.reps;
    return kg && sets.filter(s => s.kg === kg && s.reps >= top).length >= target.sets ? kg : 0;
  }

  // Records: a set's estimated one-rep max (Epley), so heavier and more reps both count.
  // Bodyweight sets and cardio don't take part.
  const e1rm = s => (s.min === undefined && s.kg > 0 ? s.kg * (1 + s.reps / 30) : 0);

  function bestBefore(key, name) {
    const n = same(name);
    let best = 0;
    for (const k of Object.keys(db.days)) {
      if (k >= key) continue;
      for (const e of db.days[k]) if (same(e.name) === n) for (const s of e.sets) best = Math.max(best, e1rm(s));
    }
    return best;
  }

  // The sets on this day that beat everything before them. The first time a lift is logged
  // nothing is a record yet.
  function records(key, ex) {
    const out = new Set();
    let best = bestBefore(key, ex.name);
    if (!best) return out;
    for (const s of ex.sets) {
      const v = e1rm(s);
      if (v > best + 1e-9) { out.add(s); best = v; }
    }
    return out;
  }

  // Days with at least one logged set. An exercise added but never done isn't a workout.
  const workoutKeys = days => Object.keys(days).filter(k => days[k].some(e => e.sets.length)).sort();

  function allNames() {
    const seen = new Set();
    const out = [];
    for (const k of sortedKeys().reverse()) {
      for (const e of db.days[k]) {
        if (!e.sets.length) continue;
        const n = same(e.name);
        if (!seen.has(n)) { seen.add(n); out.push(e.name); }
      }
    }
    return out;
  }

  function refreshNames() {
    namesList.textContent = '';
    for (const n of allNames()) namesList.append(el('option', { value: n }));
  }

  // Reuse the spelling from earlier workouts so "bench press" matches "Bench press".
  const canonical = name => (names().has(norm(name)) ? name : allNames().find(n => norm(n) === norm(name)) || name);

  /* ---------- plan ---------- */

  const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const WEEKDAYS_LT = ['sekmadienis', 'pirmadienis', 'antradienis', 'treciadienis', 'ketvirtadienis', 'penktadienis', 'sestadienis'];
  const plain = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z]/g, '');

  // The weekday a heading starts with, else -1. English: any 3+ letter prefix ("Mon", "Monday").
  // Lithuanian: the word must reach "…dien…" ("Pirmadienis"), so "Pirma diena" isn't Monday.
  function weekdayOf(word) {
    const w = plain(word);
    if (w.length < 3) return -1;
    const en = WEEKDAYS.findIndex(d => d.toLowerCase().startsWith(w));
    if (en > -1) return en;
    return w.includes('dien') ? WEEKDAYS_LT.findIndex(d => d.startsWith(w)) : -1;
  }

  // The target at the end of an exercise line: "4x12", "3-4x6-8", "(5x8)". Returns the target
  // and where the name ends, or null (then the whole text stays the name, so nothing vanishes).
  // A sets range is written tight and rising ("3-4x8"); otherwise its first number belongs to the
  // name: "Superset 1 - 3x10" → "Superset 1", "Incline 15-3x10" → "Incline 15", both 3 × 10.
  // A reps range that doesn't rise is ignored: "3x12-10" → 3 × 12.
  function readTarget(body) {
    const m = body.match(/(?:^|[\s(])(\d{1,2})(?:[-–—](\d{1,2}))?\s*[x×X*]\s*(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?\s*\)?\.?\s*$/);
    if (!m) return null;
    const lead = m[0].length - m[0].replace(/^[\s(]/, '').length; // the space or "(" before the numbers
    let cut = m.index;
    const t = { sets: Number(m[1]), reps: Number(m[3]) };
    if (m[2] && Number(m[2]) > t.sets) t.setsTo = Number(m[2]);
    else if (m[2]) {
      t.sets = Number(m[2]);
      cut = m.index + lead + m[1].length + 1; // keep "Incline 15-" as the name; the dash is trimmed later
    }
    if (m[4] && Number(m[4]) > t.reps) t.repsTo = Number(m[4]);
    return validTarget(t) ? { target: t, cut } : null;
  }

  // "Monday Push" starts a routine (the weekday is optional), "- A / B 4x12" adds an exercise.
  function parsePlan(text) {
    const routines = [];
    let cur = null;
    for (const raw of String(text || '').split(/\r?\n/)) {
      const line = raw.trim();
      if (!line) continue;
      const item = line.match(/^[-–—•*]\s*(.*)$/);
      if (item) {
        if (!cur) continue;
        let body = item[1];
        const read = readTarget(body);
        const target = read && read.target;
        if (read) body = body.slice(0, read.cut);
        let aim = null;
        const c = !read && body.match(/(?:^|[\s(])(\d{1,3}(?:[.,]\d+)?)\s*(min|km)\b(?:\s*[·,/]?\s*(\d{1,3}(?:[.,]\d+)?)\s*(min|km)\b)?\s*\)?\.?\s*$/i);
        if (c) {
          aim = {};
          aim[c[2].toLowerCase()] = Number(c[1].replace(',', '.'));
          if (c[3]) aim[c[4].toLowerCase()] = Number(c[3].replace(',', '.'));
          if (validAim(aim) && isCardio(body.slice(0, c.index))) body = body.slice(0, c.index);
          else aim = null;
        }
        // "Squat: 5x8", "Squat - 5x8" and "Squat (5x8)" all mean "Squat".
        const names = body.split('/').map(s => clean(s.replace(/[\s:,·•–—(-]+$/, ''))).filter(Boolean);
        if (names.length) cur.items.push({ names, target, aim });
        continue;
      }
      const [first, ...rest] = line.split(/\s+/);
      const day = weekdayOf(first);
      const name = day > -1 ? clean(rest.join(' ').replace(/^[:·•–—-]+\s*/, '')) || WEEKDAYS[day] : clean(line);
      cur = { name, day: day > -1 ? day : null, items: [] };
      routines.push(cur);
    }
    return routines.filter(r => r.items.length);
  }

  // Alternates ("A / B") take turns: count the earlier sessions of this routine; every slot
  // moves on one step per session and cycles through however many alternates it has.
  function rotation(key, routine) {
    if (!routine.items.some(it => it.names.length > 1)) return 0;
    let sessions = 0;
    for (const k of sortedKeys()) {
      if (k >= key) break;
      if (db.days[k].some(e => e.sets.length) && dayTitle(k) === titleIn(routine.name)) sessions++;
    }
    return sessions;
  }

  // The big title on a day: the name of the planned workout it matches best ("Push"),
  // "Cardio" or "Workout" for anything else, "Rest" when nothing is there.
  function dayTitle(key) {
    const exs = db.days[key] || [];
    if (!exs.length) return T().rest;
    // Finished days keep the name they had; today's follows what's in it.
    if (key < todayKey() && Object.prototype.hasOwnProperty.call(db.titles, key)) return db.titles[key] ? titleIn(db.titles[key]) : offPlanTitle(exs);
    return planTitle(key, exs.map(e => same(e.name))) || offPlanTitle(exs);
  }

  const cardioDay = exs => exs.length > 0 && exs.every(cardioEx);
  const offPlanTitle = exs => (cardioDay(exs) ? T().cardio : T().workout);

  // A preset's workout name in the app's language ("Push" <-> "Stūmimas"); anything else as written.
  let titleMap = null;
  function titleIn(name) {
    if (!titleMap) {
      titleMap = new Map();
      for (const p of PRESETS) {
        const en = parsePlan(p.plan.en);
        const lt = parsePlan(p.plan.lt);
        en.forEach((r, i) => {
          if (!lt[i]) return;
          const pair = { en: r.name, lt: lt[i].name };
          titleMap.set(r.name, pair);
          titleMap.set(lt[i].name, pair);
        });
      }
    }
    const pair = titleMap.get(name);
    return pair ? pair[lang()] : name;
  }

  // The planned workout these exercises match best, by the current plan, or null.
  function planTitle(key, names) {
    const dow = dateOf(key).getDay();
    let best = null;
    let bestScore = 0;
    for (const r of parsePlan(db.plan)) {
      const pool = new Set(r.items.flatMap(it => it.names.map(same)));
      const score = names.filter(n => pool.has(n)).length;
      if (score > bestScore || (score && score === bestScore && r.day === dow && best.day !== dow)) {
        best = r;
        bestScore = score;
      }
    }
    return best && bestScore * 2 >= names.length ? best.name : null;
  }

  // Today's numbers: sets done of planned, exercises finished.
  function dayStats(key) {
    const stats = { sets: 0, planned: 0, done: 0, total: 0 };
    for (const e of db.days[key] || []) {
      stats.total++;
      stats.sets += e.sets.length;
      stats.planned += e.target ? Math.max(e.target.sets, e.sets.length)
        : cardioEx(e) ? Math.max(1, e.sets.length) : e.sets.length;
      if (e.sets.length && e.sets.length >= (e.target ? e.target.sets : 1)) stats.done++;
    }
    return stats;
  }

  // 1:05, 12:40, 1:02:09
  function fmtClock(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const sec = pad(t % 60);
    return h ? `${h}:${pad(m)}:${sec}` : `${m}:${sec}`;
  }
  const elapsed = key => {
    const t = db.timers[key];
    return t ? (t.end || Date.now()) - t.start : 0;
  };
  const running = key => !!db.timers[key] && !db.timers[key].end;

  // Forgot to tap Finish? A clock from an earlier day stops by itself: at most 3 h, never past midnight.
  function settleTimers() {
    const today = todayKey();
    let changed = false;
    for (const [k, t] of Object.entries(db.timers)) {
      if (t.end || k >= today) continue;
      const d = dateOf(k);
      const midnight = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
      t.end = Math.max(t.start, Math.min(t.start + 3 * 3600e3, midnight));
      changed = true;
    }
    if (changed) save();
  }

  function startWorkout(key) {
    if (db.timers[key]) return;
    db.timers[key] = { start: Date.now(), end: null };
    save();
    refreshCard(key);
    syncWake();
  }

  function finishWorkout(key) {
    const t = db.timers[key];
    if (!t || t.end) return;
    t.end = Date.now();
    save();
    rest.stop();
    refreshCard(key);
    syncWake();
    // Something was logged: the workout ends on today's progress, then its summary.
    if ((db.days[key] || []).some(e => e.sets.length)) location.hash = `#/progress/${key}`;
  }

  // The screen stays on while today's workout clock runs, so the rest countdown is there to see.
  let wake = null;
  let waking = false;
  async function syncWake() {
    if (!navigator.wakeLock || waking) return;
    const want = running(todayKey()) && document.visibilityState === 'visible';
    if (want && !wake) {
      waking = true;
      try {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      } catch (_) { wake = null; }
      waking = false;
      if (!running(todayKey()) && wake) syncWake();   // finished while asking
    } else if (!want && wake) {
      const w = wake;
      wake = null;
      w.release().catch(() => {});
    }
  }
  // The phone drops the lock whenever the app is hidden; take it again on the way back.
  document.addEventListener('visibilitychange', syncWake);

  // A quiet line for a rest day: "This week 2/3 · 41 sets · 2 h 40 min" (weeks start on Monday).
  function weekSummary(key) {
    const from = mondayOf(key);
    const keys = workoutKeys(db.days).filter(k => k >= from && k <= key);
    if (!keys.length) return null;
    const t = T();
    const planned = new Set(parsePlan(db.plan).filter(r => r.day != null).map(r => r.day)).size;
    const sets = keys.reduce((n, k) => n + db.days[k].reduce((m, e) => m + e.sets.filter(s => s.min === undefined).length, 0), 0);
    const ms = keys.reduce((n, k) => n + (db.timers[k] && db.timers[k].end ? db.timers[k].end - db.timers[k].start : 0), 0);
    const mins = Math.round(ms / 60000);
    const parts = [t.thisWeek(keys.length, planned)];
    if (sets) parts.push(t.setCount(sets));
    if (mins) parts.push(t.duration(Math.floor(mins / 60), mins % 60));
    return parts.join(' · ');
  }

  // The next planned workout after today, e.g. "Next: Push, Monday".
  function nextWorkout(key) {
    const routines = parsePlan(db.plan);
    const d = dateOf(key);
    for (let i = 1; i <= 7; i++) {
      const next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i);
      const r = routines.find(x => x.day === next.getDay());
      if (r) return T().next(r.name, fmt(keyOf(next), { weekday: 'long' }));
    }
    return null;
  }

  let refreshCard = () => {};
  let clock = null;

  function dayCard(key, isToday) {
    const title = el('h1', { class: 'title' });
    const stat = () => {
      const v = el('div', { class: 'stat-v' });
      const l = el('div', { class: 'stat-l' });
      return { v, l, node: el('div', null, v, l) };
    };
    // Sets and exercises; minutes and km on a day of only cardio.
    const first = stat();
    const second = stat();
    const time = stat();
    time.l.textContent = T().time;
    time.v.classList.add('live');
    const statsRow = el('div', { class: 'stats' }, first.node, second.node, time.node);
    const go = el('button', {
      type: 'button', class: 'go',
      onclick: () => (running(key) ? finishWorkout(key) : startWorkout(key)),
    });
    // A finished workout (today once it's over, any earlier day) opens its summary again.
    const summary = el('a', { class: 'go', href: `#/done/${key}` }, `${T().summary} ▸`);
    const week = el('p', { class: 'next' });
    const next = el('p', { class: 'next' });
    const card = el('section', { class: 'card' },
      el('p', { class: 'label' }, el('b', null, '#'), isToday ? T().tabs.today : T().tabs.history),
      title,
      el('p', { class: 'sub' }, fullDate(key)),
      statsRow, go, summary, week, next);

    // The clock ticks once a second while the workout runs, and stops with the view.
    const tickClock = () => {
      if (!card.isConnected) { clearInterval(clock); clock = null; return; }
      time.v.textContent = fmtClock(elapsed(key));
    };
    const update = () => {
      const st = dayStats(key);
      const exs = db.days[key] || [];
      title.textContent = dayTitle(key);
      const active = st.total > 0;
      statsRow.hidden = !active;
      if (active && cardioDay(exs)) {
        const sum = f => fmtKg(exs.reduce((n, e) => n + e.sets.reduce((m, s) => m + (s[f] || 0), 0), 0));
        first.l.textContent = T().minutes;
        first.v.textContent = sum('min');
        second.l.textContent = T().km;
        second.v.textContent = sum('km');
      } else if (active) {
        first.l.textContent = T().sets;
        first.v.textContent = `${st.sets}/${st.planned}`;
        second.l.textContent = T().exercises;
        second.v.textContent = `${st.done}/${st.total}`;
      }
      if (active) {
        time.v.textContent = fmtClock(elapsed(key));
        time.v.style.color = db.timers[key] ? '' : 'var(--faint)';
      }
      // Start and Finish belong to today; a finished workout just shows its time.
      const t = db.timers[key];
      go.hidden = !active || !isToday || !!(t && t.end);
      go.textContent = t ? `${T().finishWorkout} ■` : `${T().startWorkout} ▸`;
      go.classList.toggle('stop', !!t);
      summary.hidden = !st.sets || (isToday && !(t && t.end));
      clearInterval(clock);
      clock = running(key) ? setInterval(tickClock, 1000) : null;
      // A rest day: how the week went, and what's next.
      const sofar = !active && isToday ? weekSummary(key) : null;
      week.hidden = !sofar;
      if (sofar) week.textContent = sofar;
      const upcoming = !active && isToday ? nextWorkout(key) : null;
      next.hidden = !upcoming;
      if (upcoming) next.textContent = upcoming;
    };
    update();
    refreshCard = k => { if (k === key && current.view === 'day' && current.key === key) update(); };
    return card;
  }

  function loadRoutine(key, routine) {
    const turn = rotation(key, routine);
    const day = db.days[key] || (db.days[key] = []);
    for (const it of routine.items) {
      const name = canonical(it.names[turn % it.names.length]);
      if (day.some(e => same(e.name) === same(name))) continue;
      const ex = it.target ? { name, sets: [], target: copyTarget(it.target) } : { name, sets: [] };
      if (it.aim) ex.aim = copyAim(it.aim);
      day.push(ex);
    }
    db.filledFrom = { key, plan: db.plan };
    save();
  }

  // Today was filled from an older version of the plan: rebuild it from the current plan's
  // workout for this weekday. Everything you logged stays (with its sets), and so does anything
  // you added yourself; only the old plan's untouched exercises make way. No workout today in
  // the new plan and nothing done: a rest day. Works however the plan was changed: in the app,
  // before closing it, by switching language, or by an import.
  function followPlan(key) {
    const from = db.filledFrom;
    const day = db.days[key];
    if (!from || from.key !== key || from.plan === db.plan) return;
    if (!day || !day.length) return;   // emptied by hand: stays empty
    const dow = dateOf(key).getDay();
    const old = parsePlan(from.plan).find(r => r.day === dow);
    const fromOld = new Set(old ? old.items.flatMap(it => it.names.map(same)) : []);
    const keep = day.filter(e => e.sets.length || !fromOld.has(same(e.name)));
    const routine = parsePlan(db.plan).find(r => r.day === dow);
    if (routine) {
      db.days[key] = keep;
      loadRoutine(key, routine);   // adds what's missing
      // In the plan's order; anything off the plan you already did goes first.
      const at = new Map();
      routine.items.forEach((it, i) => it.names.forEach(n => at.set(same(n), i)));
      db.days[key].sort((a, b) => (at.has(same(a.name)) ? at.get(same(a.name)) : -1) - (at.has(same(b.name)) ? at.get(same(b.name)) : -1));
      return save();
    }
    if (keep.length) db.days[key] = keep;
    else delete db.days[key];
    db.filledFrom = null;
    save();
  }

  // Finished days keep the name they had, whatever the plan becomes. Days from before titles
  // were saved get theirs from the plan in use now (the one they were done with).
  function freezeTitles() {
    const today = todayKey();
    let changed = false;
    for (const k of workoutKeys(db.days)) {
      if (k >= today || Object.prototype.hasOwnProperty.call(db.titles, k)) continue;
      db.titles[k] = planTitle(k, db.days[k].map(e => same(e.name))) || '';
      changed = true;
    }
    if (changed) save();
  }

  /* ---------- "remove" next to the set you tapped ---------- */

  let revealed = null;

  function closeReveal() {
    if (revealed) { revealed.classList.remove('on'); revealed = null; }
  }

  document.addEventListener('pointerdown', e => {
    if (revealed && !e.target.closest('.remove, [data-reveal]')) closeReveal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReveal(); });

  /* ---------- views ---------- */

  let current = {};
  const blocks = new WeakMap();
  const openEx = new WeakSet(); // exercises whose card is open
  const folds = new WeakMap();  // card element -> open/close it

  // After the fold settles, make sure the opened card and its first rows are on screen.
  function bringIntoView(block) {
    setTimeout(() => {
      if (!block.isConnected) return;
      const r = block.getBoundingClientRect();
      const bottom = window.innerHeight - 150;   // above the tab bar and the rest strip
      if (r.top < 12) window.scrollBy({ top: r.top - 12, behavior: 'smooth' });
      else if (r.top > bottom - 160) window.scrollBy({ top: Math.min(r.top - 80, r.bottom - bottom), behavior: 'smooth' });
    }, 360);
  }

  // The Track. mark (the #mark symbol in the page, same geometry as logo.svg).
  function mark() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 98.71 100');
    svg.setAttribute('class', 'mark');
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS(ns, 'use');
    use.setAttribute('href', '#mark');
    svg.append(use);
    return svg;
  }

  // Level by number of workouts logged.
  function level() {
    const n = workoutKeys(db.days).length;
    return T().levels[n < 5 ? 0 : n < 25 ? 1 : n < 100 ? 2 : 3];
  }

  // The mark, your name and level. Tap it for the profile (name and language).
  // Given a redraw (Today), a quiet LT · EN sits on the right too.
  function header(redraw) {
    return el('div', null,
      el('header', null,
        el('a', { href: '#/profile', class: 'profile' },
          el('span', { class: 'avatar' }, mark()),
          el('span', { class: 'who' },
            el('span', { class: `who-name${db.name ? '' : ' empty'}` }, db.name || T().yourName),
            el('span', { class: 'who-level' }, level()))),
        redraw && langSwitch(redraw)),
      el('p', { class: 'warn', hidden: storageOk }, T().cantSave));
  }

  const tabs = {
    history: document.getElementById('tab-history'),
    today: document.getElementById('tab-today'),
    stats: document.getElementById('tab-stats'),
    plan: document.getElementById('tab-plan'),
  };

  // Light up the current tab. A past day belongs to History, whose tab leads back to its month,
  // and so does a lift's history.
  function updateTabs() {
    const pastDay = current.view === 'day' && !current.isToday;
    const active = current.view === 'history' || current.view === 'exercise' || pastDay ? 'history'
      : current.view === 'stats' || current.view === 'muscle' ? 'stats' : current.view === 'plan' ? 'plan' : 'today';
    for (const [name, tab] of Object.entries(tabs)) {
      if (name === active) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    }
    tabs.history.setAttribute('href', pastDay ? `#/history/${current.key.slice(0, 7)}` : '#/history');
  }

  // Already on today: the middle button goes back to the top.
  tabs.today.addEventListener('click', e => {
    if (current.view === 'day' && current.isToday) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  // Hide the tab bar only while the on-screen keyboard is actually up. Focus alone isn't enough:
  // Android's back gesture (and its Done key) closes the keyboard but leaves the field focused,
  // which used to leave the bar invisible, so the first tap on it did nothing.
  const vv = window.visualViewport;
  // fullHeight is the keyboard-free height; it's re-measured after a rotation or resize (the
  // layout height doesn't shrink for the keyboard on iOS or current Android Chrome).
  let fullHeight = window.innerHeight;
  let lastWidth = window.innerWidth;
  function syncKeyboard() {
    const el = document.activeElement;
    const typing = !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
    const visible = vv ? vv.height * vv.scale : window.innerHeight;
    if (!typing || window.innerWidth !== lastWidth) {
      lastWidth = window.innerWidth;
      fullHeight = Math.max(window.innerHeight, visible);
    } else {
      fullHeight = Math.max(fullHeight, visible);
    }
    document.body.classList.toggle('kb', typing && visible < fullHeight - 120);
  }
  if (vv) vv.addEventListener('resize', syncKeyboard);
  window.addEventListener('resize', syncKeyboard);
  document.addEventListener('focusin', syncKeyboard);
  document.addEventListener('focusout', () => setTimeout(syncKeyboard, 0));
  // iOS only shows :active (the tap feedback on the tabs) when a touch listener exists.
  document.addEventListener('touchstart', () => {}, { passive: true });

  function mount(view) {
    revealed = null;
    refitPlan = null;
    applyLang();
    app.textContent = '';
    app.append(view);
    updateTabs();
    document.body.classList.toggle('onboarding', current.view === 'onboarding' || current.view === 'profile');
    document.body.classList.toggle('sheet', current.view === 'progress' || current.view === 'done');
    window.scrollTo(0, 0);
  }

  function renderDay(key, isToday) {
    current = { view: 'day', key, isToday };
    if (isToday) followPlan(key);
    // A planned weekday fills itself in the first time it's opened; any other day is a rest day.
    if (isToday && !Object.prototype.hasOwnProperty.call(db.days, key)) {
      const planned = parsePlan(db.plan).find(r => r.day === dateOf(key).getDay());
      if (planned) loadRoutine(key, planned);
    }
    const exs = db.days[key] || [];
    const list = el('section', { class: 'list', 'aria-label': T().exercises });
    for (const ex of exs) list.append(exerciseBlock(key, ex));
    // Today: the first exercise that isn't finished is open, ready to log.
    if (isToday && !exs.some(e => openEx.has(e))) {
      const first = exs.find(e => e.sets.length < (e.target ? e.target.sets : 1));
      if (first) blocks.get(first).toggle(true, true);
    }
    mount(el('div', { class: 'view' },
      header(isToday && (() => renderDay(key, isToday))),
      dayCard(key, isToday),
      list,
      addExerciseForm(key, list)));
  }

  function exerciseBlock(key, ex) {
    const label = ex.name;
    const sets = el('div', { class: 'sets' });
    const nextPrev = el('span', { class: 'prev' });
    const num = el('span', { class: 'n', 'aria-hidden': 'true' });
    const kg = el('input', {
      class: 'kg', inputmode: 'decimal', enterkeyhint: 'next',
      autocomplete: 'off', 'aria-label': T().weight(label),
      onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); reps.focus(); } },
    });
    const reps = el('input', {
      class: 'reps', inputmode: 'numeric', pattern: '[0-9]*', enterkeyhint: 'done',
      autocomplete: 'off', 'aria-label': T().reps(label),
      onkeydown: e => { if (e.key === 'Enter') tapped = false; },
    });
    for (const input of [kg, reps]) input.addEventListener('keydown', e => { if (e.key === 'Escape' && editing) stopEdit(); });

    // Tapping "+" logs and closes the keyboard; Enter keeps focus for fast typing.
    let tapped = false;
    const plus = el('button', {
      class: 'act plus', 'aria-label': T().addSet(label),
      onpointerdown: () => { tapped = true; },
      onpointercancel: () => { tapped = false; },
    }, '+');
    // A logged set you tapped to change: its numbers are in the fields and "+" saves it in place.
    let editing = null;

    // Cardio: the two fields are minutes and km.
    const cardio = cardioEx(ex);
    if (cardio) {
      reps.className = 'km';
      reps.setAttribute('inputmode', 'decimal');
      reps.removeAttribute('pattern');
      kg.setAttribute('aria-label', `${label}: min`);
      reps.setAttribute('aria-label', `${label}: km`);
    }
    const entry = cardio
      ? el('form', { class: 'row entry cardio', novalidate: true, onsubmit: addSet },
        num, kg, el('span', { class: 'u' }, 'min'), reps, el('span', { class: 'u' }, 'km'), nextPrev, plus)
      : el('form', { class: 'row entry', novalidate: true, onsubmit: addSet },
        num, kg, el('span', { class: 'u' }, 'kg'), el('span', { class: 'u' }, '×'), reps, nextPrev, plus);

    const meta = el('span', { class: 'ex-meta' });
    const card = el('button', { type: 'button', class: 'ex-card', 'aria-expanded': 'false', onclick: () => toggle() },
      el('span', { class: 'ex-info' },
        el('span', { class: 'ex-name' }, label),
        ex.target && el('span', { class: 'ex-sub' }, fmtTarget(ex.target)),
        ex.aim && el('span', { class: 'ex-sub' }, fmtCardio({ min: ex.aim.min || 0, km: ex.aim.km || 0 }).replace(/^0 min · /, '')),
        meta));
    const hist = el('a', { href: `#/ex/${encodeURIComponent(label)}` }, T().history);
    const removeEx = el('button', {
      type: 'button', 'aria-label': T().removeExercise(label), onclick: removeExercise,
    }, T().removeExerciseText);
    const body = el('div', { class: 'ex-body' }, el('div', { class: 'ex-fold' }, el('div', { class: 'ex-pad' },
      sets, entry, el('div', { class: 'ex-foot' }, hist, removeEx))));
    body.inert = true;
    const block = el('article', { class: 'ex' }, card, body);
    blocks.set(ex, { block, toggle, focus: () => { toggle(true, true); kg.focus({ preventScroll: true }); bringIntoView(block); } });
    folds.set(block, open => toggle(open));
    if (openEx.has(ex)) toggle(true, true);
    paint(false);
    return block;

    // One card open at a time: opening this one folds the others shut.
    function toggle(open = !block.classList.contains('open'), quiet = false) {
      if (open === block.classList.contains('open')) return;
      if (!open && editing) stopEdit();
      if (open && block.parentElement) {
        for (const other of block.parentElement.querySelectorAll('.ex.open')) {
          if (other !== block && folds.has(other)) folds.get(other)(false);
        }
      }
      body.inert = !open;
      card.setAttribute('aria-expanded', String(open));
      block.classList.toggle('open', open);
      if (open) openEx.add(ex);
      else openEx.delete(ex);
      if (open && !quiet) bringIntoView(block);
    }

    function paint(added) {
      if (editing && !ex.sets.includes(editing)) editing = null;
      const before = previous(key, ex.name);
      const ref = before ? before.sets : [];
      const prs = records(key, ex);
      if (revealed && sets.contains(revealed)) revealed = null;
      sets.textContent = '';
      ex.sets.forEach((s, i) => sets.append(setRow(s, i, added && i === ex.sets.length - 1, ref[i], prs.has(s))));
      // The entry row: the next set, or the one being changed.
      const at = editing ? ex.sets.indexOf(editing) : ex.sets.length;
      num.textContent = at + 1;
      fillPrev(nextPrev, ref[at]);
      plus.textContent = editing ? '✓' : '+';
      plus.classList.toggle('save', !!editing);
      plus.setAttribute('aria-label', editing ? T().saveSet(at + 1) : T().addSet(label));
      const sug = !editing ? suggestion(key, ex)
        : cardio ? { min: editing.min, km: 0 } : { kg: 0, reps: editing.reps };   // what an emptied field saves
      const lastSet = ex.sets[ex.sets.length - 1];
      if (cardio) {
        kg.placeholder = sug && sug.min ? fmtKg(sug.min) : '0';
        reps.placeholder = sug && sug.km ? fmtKg(sug.km) : '0';
        const mins = ex.sets.reduce((m, s) => m + (s.min || 0), 0);
        const kms = ex.sets.reduce((m, s) => m + (s.km || 0), 0);
        meta.textContent = ex.sets.length ? fmtCardio({ min: mins, km: kms }) : '0 min';
      } else {
        kg.placeholder = sug && sug.kg ? fmtKg(sug.kg) : '0';
        reps.placeholder = sug ? String(sug.reps) : '0';
        const want = ex.target ? ex.target.sets : 0;
        meta.textContent = `${ex.sets.length}${want ? `/${want}` : ''} ${T().sets}` + (lastSet ? ` · ${setText(lastSet)}` : '');
      }
      block.classList.toggle('done', key === todayKey() && !unfinished(ex));
      hist.hidden = !(ex.sets.length || before);
      refreshCard(key);
    }

    // Tap a logged set to change it (its numbers go up into the fields); tap it again to leave it.
    function startEdit(s) {
      editing = s;
      if (s.min !== undefined) {
        kg.value = fmtKg(s.min);
        reps.value = s.km ? fmtKg(s.km) : '';
      } else {
        kg.value = s.kg ? fmtKg(s.kg) : '';
        reps.value = String(s.reps);
      }
      paint(false);
    }

    function stopEdit() {
      editing = null;
      kg.value = '';
      reps.value = '';
      paint(false);
    }

    function fillPrev(span, s) {
      span.textContent = '';
      if (s) span.append(el('span', { class: 'sr' }, T().lastTime), setText(s));
      return span;
    }

    // Tap the row to change the set; "remove" shows up next to it. The button is always
    // reachable by keyboard and screen readers.
    function setRow(s, i, fresh, then, pr) {
      const rm = el('button', {
        type: 'button', class: 'act remove', 'aria-label': T().removeSet(i + 1),
        onclick: () => {
          const j = ex.sets.indexOf(s);
          if (j > -1) ex.sets.splice(j, 1);
          if (editing === s) { editing = null; kg.value = ''; reps.value = ''; }
          save();
          paint(false);
        },
      }, T().remove);
      const isEditing = editing === s;
      if (isEditing) {
        closeReveal();
        rm.classList.add('on');
        revealed = rm;
      }
      const cls = `row set${s.min !== undefined ? ' cardio' : ''}${fresh ? ' fresh' : ''}${isEditing ? ' editing' : ''}`;
      const onclick = e => {
        if (e.target.closest('.remove')) return;
        if (isEditing) stopEdit();
        else startEdit(s);
      };
      const record = pr && el('span', { class: 'pr' }, el('span', { class: 'sr' }, T().pr), el('span', { 'aria-hidden': 'true' }, 'PR'));
      if (s.min !== undefined) {
        return el('div', { class: cls, 'data-reveal': '', onclick },
          el('span', { class: 'n' }, i + 1),
          el('span', { class: 'w' }, fmtKg(s.min)),
          el('span', { class: 'u' }, 'min'),
          el('span', { class: 'w' }, s.km ? fmtKg(s.km) : ''),
          el('span', { class: 'u' }, s.km ? 'km' : ''),
          rm,
          then && fillPrev(el('span', { class: 'prev' }), then));
      }
      return el('div', { class: cls, 'data-reveal': '', onclick },
        el('span', { class: 'n' }, i + 1),
        el('span', { class: 'w' }, s.kg ? fmtKg(s.kg) : ''),
        el('span', { class: 'u' }, s.kg ? 'kg' : 'bw'),
        el('span', { class: 'u' }, '×'),
        el('span', null, s.reps),
        rm,
        then && fillPrev(el('span', { class: 'prev' }), then),
        record);
    }

    function nudge(input) {
      input.classList.remove('nope');
      void input.offsetWidth; // restart the animation
      input.classList.add('nope');
      input.focus();
      input.select();
    }

    function addSet(e) {
      e.preventDefault();
      const viaTap = tapped;
      tapped = false;
      if (editing) return saveEdit(viaTap);
      const sug = suggestion(key, ex);
      if (cardio) {
        const m = kg.value.trim() ? parseKg(kg.value) : (sug ? sug.min : null);
        const d = reps.value.trim() ? parseKg(reps.value) : (sug ? sug.km || 0 : 0);
        if (m == null || m < 0.1) return nudge(kg);
        if (d == null) return nudge(reps);
        ex.sets.push({ min: m, km: d });
      } else {
        const w = kg.value.trim() ? parseKg(kg.value) : (sug ? sug.kg : 0);
        const r = reps.value.trim() ? parseReps(reps.value) : (sug ? sug.reps : null);
        if (w == null) return nudge(kg);
        if (r == null) return nudge(reps);
        ex.sets.push({ kg: w, reps: r });
      }
      save();
      if (ex.sets.length === 1) refreshNames();
      kg.value = '';
      reps.value = '';
      closeReveal();
      paint(true);
      afterSet(key, ex);
      if (viaTap && document.activeElement && entry.contains(document.activeElement)) document.activeElement.blur();
    }

    // The changed numbers replace the set's own. An emptied weight (or distance) means none;
    // emptied reps (or minutes) stay as they were, as the grey placeholder shows.
    function saveEdit(viaTap) {
      const s = editing;
      if (s.min !== undefined) {
        const m = kg.value.trim() ? parseKg(kg.value) : s.min;
        const d = reps.value.trim() ? parseKg(reps.value) : 0;
        if (m == null || m < 0.1) return nudge(kg);
        if (d == null) return nudge(reps);
        s.min = m;
        s.km = d;
      } else {
        const w = kg.value.trim() ? parseKg(kg.value) : 0;
        const r = reps.value.trim() ? parseReps(reps.value) : s.reps;
        if (w == null) return nudge(kg);
        if (r == null) return nudge(reps);
        s.kg = w;
        s.reps = r;
      }
      save();
      if (viaTap && document.activeElement && entry.contains(document.activeElement)) document.activeElement.blur();
      stopEdit();
    }

    function removeExercise() {
      // Logged sets go with it, so ask first; an untouched exercise just goes.
      if (ex.sets.length && !confirm(T().removeAsk(label, ex.sets.length))) return;
      const day = db.days[key];
      if (day) {
        const i = day.indexOf(ex);
        if (i > -1) day.splice(i, 1); // an emptied day stays, so the plan doesn't refill it
      }
      save();
      closeReveal();
      block.remove();
      refreshNames();
      refreshCard(key);
    }
  }

  // Rest between sets, longer between exercises, then the next exercise opens by itself.
  const unfinished = e => e.sets.length < (e.target ? e.target.sets : 1);
  function afterSet(key, ex) {
    if (key !== todayKey()) return;
    startWorkout(key);
    if (cardioEx(ex)) return;
    const done = ex.target ? ex.sets.length >= ex.target.sets : false;
    if (!done) return rest.start('set');
    const next = (db.days[key] || []).find(e => e !== ex && unfinished(e));
    if (!next) return rest.stop();   // last set of the day: no rest, the card offers Finish
    rest.start('exercise');
    const b = blocks.get(next);
    const typing = !!document.activeElement && !!document.activeElement.closest && !!document.activeElement.closest('.ex-body');
    if (b) setTimeout(() => (typing ? b.focus() : b.toggle(true)), 420);
  }

  function addExerciseForm(key, list) {
    const input = el('input', {
      placeholder: T().addExercise, list: 'names', enterkeyhint: 'done', maxlength: '60',
      autocomplete: 'off', autocapitalize: 'sentences', 'aria-label': T().addExercise,
    });
    return el('form', {
      class: 'add-ex',
      onsubmit: e => {
        e.preventDefault();
        const name = clean(input.value);
        if (!name) return;
        input.value = '';
        const day = db.days[key] || [];
        const existing = day.find(x => same(x.name) === same(name));
        if (existing) {
          const b = blocks.get(existing);
          if (b) b.focus();
          return;
        }
        const ex = { name: canonical(name), sets: [] };
        day.push(ex);
        db.days[key] = day;
        save();
        const block = exerciseBlock(key, ex);
        block.classList.add('fresh');
        list.append(block);
        refreshNames();
        refreshCard(key);
        blocks.get(ex).focus();
      },
    }, input);
  }

  const monthKey = (y, m) => `${y}-${pad(m + 1)}`;

  // History is a month calendar: tap a day to open it. Months change with ‹ › or a swipe.
  function renderHistory(ym) {
    const now = new Date();
    const y = ym ? ym.y : now.getFullYear();
    const m = ym ? ym.m : now.getMonth();
    current = { view: 'history', y, m };
    const today = todayKey();
    const prev = m === 0 ? monthKey(y - 1, 11) : monthKey(y, m - 1);
    const next = m === 11 ? monthKey(y + 1, 0) : monthKey(y, m + 1);
    const canNext = next <= monthKey(now.getFullYear(), now.getMonth());

    const cal = el('div', { class: 'cal', role: 'group', 'aria-label': T().days });
    for (const d of T().weekInitials) cal.append(el('span', { class: 'wd', 'aria-hidden': 'true' }, d));
    const lead = (new Date(y, m, 1).getDay() + 6) % 7; // weeks start on Monday
    for (let i = 0; i < lead; i++) cal.append(el('span', { 'aria-hidden': 'true' }));
    let count = 0;
    const last = new Date(y, m + 1, 0).getDate();
    // Only training days are named; the rest stay a dim number.
    for (let d = 1; d <= last; d++) {
      const k = `${monthKey(y, m)}-${pad(d)}`;
      const done = (db.days[k] || []).some(e => e.sets.length);
      if (done) count++;
      const future = k > today;
      const cls = `cal-day${done ? ' has' : ''}${k === today ? ' today' : ''}${future ? ' future' : ''}`;
      const name = done && dayTitle(k);
      const kids = [el('span', { class: 'num' }, d), name && el('span', { class: 'cal-name' }, name)];
      cal.append(future
        ? el('span', { class: cls, 'aria-hidden': 'true' }, ...kids)
        : el('a', { class: cls, href: `#/${k}`, 'aria-label': name ? `${fullDate(k)}, ${name}` : fullDate(k) }, ...kids));
    }

    // Swipe sideways on the calendar to change month.
    let sx = null;
    let sy = 0;
    cal.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    cal.addEventListener('touchend', e => {
      if (sx == null) return;
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      sx = null;
      if (Math.abs(dx) < 60 || Math.abs(dx) < 2 * Math.abs(dy)) return;
      if (dx > 0) location.hash = `#/history/${prev}`;
      else if (canNext) location.hash = `#/history/${next}`;
    });

    const file = el('input', { type: 'file', accept: '.json,application/json', hidden: true, onchange: () => importFile(file) });
    const due = backupDue();
    mount(el('div', { class: 'view' },
      header(),
      el('h1', { class: 'title' }, cap(new Date(y, m, 1).toLocaleDateString(lang() === 'lt' ? 'lt-LT' : 'en-GB', { month: 'long' }))),
      el('div', { class: 'subrow' },
        el('p', { class: 'sub' }, `${y} · ${count ? T().workouts(count) : T().nothingLogged}`),
        el('nav', { class: 'months', 'aria-label': T().month },
          el('a', { href: `#/history/${prev}`, 'aria-label': T().prevMonth }, '‹'),
          canNext
            ? el('a', { href: `#/history/${next}`, 'aria-label': T().nextMonth }, '›')
            : el('span', { class: 'off', 'aria-hidden': 'true' }, '›'))),
      cal,
      el('footer', null,
        due && el('p', { class: 'backup' }, due),
        el('div', { class: 'backup-actions' },
          el('button', { type: 'button', class: due ? 'due' : null, onclick: exportData }, T().exportLabel),
          el('button', { type: 'button', onclick: () => file.click() }, T().importLabel),
          file))));
  }

  // A quiet nudge two weeks after the last backup (or after the first workout, if never backed up),
  // but only when something has been logged since that backup.
  function backupDue() {
    const keys = workoutKeys(db.days);
    if (!keys.length) return null;
    if (db.lastBackup && db.lastBackup >= keys[keys.length - 1]) return null;
    const since = db.lastBackup || keys[0];
    const days = Math.round((dateOf(todayKey()) - dateOf(since)) / 86400000);
    if (days < 14) return null;
    return db.lastBackup ? T().lastBackup(days) : T().noBackup;
  }

  let planTimer = 0;
  function flushPlan() {
    if (!planTimer) return;
    clearTimeout(planTimer);
    planTimer = 0;
    save();
  }
  window.addEventListener('pagehide', flushPlan);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushPlan(); });

  let refitPlan = null;
  window.addEventListener('resize', () => { if (refitPlan) refitPlan(); });

  // Switch the app's language. An unedited preset plan follows it (today's untouched workout
  // follows the plan, see followPlan); a plan you wrote yourself is left as it is.
  function changeLang(l) {
    flushPlan();
    db.lang = l;
    const p = PRESETS.find(x => isPreset(x, db.plan));
    if (p) db.plan = p.plan[l];
    save();
  }

  // Two short beeps when a rest runs out: iPhones can't vibrate for a web app. The sound is set up
  // on the tap that starts the rest (phones only allow sound after a tap) and mixes with your music.
  const chime = (() => {
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx = null;
    function ready() {
      if (!AC) return;
      try {
        if (navigator.audioSession) navigator.audioSession.type = 'ambient';
        if (!ctx) ctx = new AC();
        if (ctx.state !== 'running') ctx.resume().catch(() => {});
      } catch (_) { ctx = null; }
    }
    function play() {
      if (!ctx || ctx.state !== 'running') return;
      const t0 = ctx.currentTime + 0.02;
      for (const at of [0, 0.24]) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t0 + at);
        gain.gain.exponentialRampToValueAtTime(0.3, t0 + at + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.17);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0 + at);
        osc.stop(t0 + at + 0.2);
      }
    }
    // Let the phone's audio go quiet again between rests.
    function sleep() { if (ctx && ctx.state === 'running') ctx.suspend().catch(() => {}); }
    return { ready, play, sleep };
  })();

  // The rest countdown lives outside the views, so it keeps running across tabs and reloads.
  // Tap the time to change how long you rest: 1:00, 1:30, 2:00 or 3:00 between sets.
  const rest = (() => {
    const RKEY = 'track.rest';
    const line = el('i');
    const label = el('span', { class: 'rest-l' });
    const clockEl = el('button', { type: 'button', class: 'rest-t', 'aria-live': 'off', onclick: () => cycle() });
    const more = el('button', { type: 'button', onclick: () => add(15) }, '+15');
    const skip = el('button', { type: 'button', onclick: () => stop() });
    const node = el('div', { class: 'restbar off', role: 'timer', 'aria-hidden': 'true' },
      el('div', { class: 'rest-in' }, el('div', { class: 'rest-line' }, line), label, clockEl, more, skip));
    node.inert = true;
    document.body.append(node);
    let state = null;   // { until, total } in ms, and kind: 'set' or 'exercise'
    let timer = null;
    let doneAt = 0;
    try { state = JSON.parse(localStorage.getItem(RKEY)); } catch (_) { state = null; }
    if (!state || !Number.isFinite(state.until) || !Number.isFinite(state.total) || state.until < Date.now() - 5000) state = null;

    const length = kind => (kind === 'exercise' ? Math.min(300, db.rest * 2) : db.rest);

    function persist() {
      try { if (state) localStorage.setItem(RKEY, JSON.stringify(state)); else localStorage.removeItem(RKEY); } catch (_) { /* ignore */ }
    }
    function paint() {
      const t = T();
      skip.textContent = t.skipRest;
      clockEl.setAttribute('aria-label', t.restLength(fmtClock(db.rest * 1000)));
      if (!state) return;
      const left = state.until - Date.now();
      if (left <= 0) {
        if (!doneAt) {
          doneAt = Date.now();
          node.classList.add('done');
          if (document.visibilityState === 'visible') {
            if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
            chime.play();
          }
        }
        label.textContent = t.goNow;
        clockEl.textContent = '0:00';
        line.style.transform = 'scaleX(0)';
        if (Date.now() - doneAt > 2600) stop();
        return;
      }
      label.textContent = t.restLabel;
      clockEl.textContent = fmtClock(left + 999);
      line.style.transform = `scaleX(${Math.min(1, left / state.total)})`;
    }
    function show(on) {
      node.classList.toggle('off', !on);
      node.setAttribute('aria-hidden', String(!on));
      node.inert = !on;
      document.body.classList.toggle('resting', on);
    }
    function run() {
      clearInterval(timer);
      doneAt = 0;
      node.classList.remove('done');
      paint();
      show(true);
      timer = setInterval(paint, 250);
    }
    function start(kind) {
      chime.ready();
      const ms = length(kind) * 1000;
      state = { until: Date.now() + ms, total: ms, kind };
      persist();
      run();
    }
    function add(seconds) {
      if (!state) return;
      chime.ready();
      const base = Math.max(Date.now(), state.until);
      state = { until: base + seconds * 1000, total: Math.max(state.total, base + seconds * 1000 - Date.now()), kind: state.kind };
      persist();
      run();
    }
    // The next length along, kept for every rest from now on; this one starts over at it.
    function cycle() {
      const i = REST_STEPS.indexOf(db.rest);
      db.rest = REST_STEPS[(i + 1) % REST_STEPS.length];
      save();
      if (state && state.until > Date.now()) start(state.kind === 'exercise' ? 'exercise' : 'set');
      else paint();
    }
    function stop() {
      clearInterval(timer);
      timer = null;
      state = null;
      persist();
      show(false);
      setTimeout(() => { if (!state) chime.sleep(); }, 1000);   // after the beeps have played
    }
    if (state) run();
    document.addEventListener('visibilitychange', () => { if (state && document.visibilityState === 'visible') paint(); });
    return { start, stop, active: () => !!state };
  })();

  // Page language and the tab bar's labels (the bar lives outside the views).
  function applyLang() {
    const t = T();
    document.documentElement.lang = lang();
    document.querySelector('.tabbar').setAttribute('aria-label', t.tabs.main);
    tabs.history.setAttribute('aria-label', t.tabs.history);
    tabs.today.setAttribute('aria-label', t.tabs.today);
    tabs.stats.setAttribute('aria-label', t.tabs.stats);
    tabs.plan.setAttribute('aria-label', t.tabs.plan);
  }

  const isPreset = (p, text) => p.plan.en.trim() === text.trim() || p.plan.lt.trim() === text.trim();

  function usePreset(preset) {
    const now = db.plan.trim();
    if (now === presetPlan(preset).trim()) return;
    // Only ask when it would throw away a plan you wrote or changed yourself.
    const own = now && !PRESETS.some(p => isPreset(p, now));
    if (own && !confirm(T().replacePlan(presetName(preset)))) return;
    clearTimeout(planTimer);
    planTimer = 0;
    db.plan = presetPlan(preset);
    save();
    renderPlan();
  }

  function renderPlan() {
    current = { view: 'plan' };
    const summary = el('p', { class: 'sub' });
    const area = el('textarea', {
      class: 'plan', rows: '12', spellcheck: 'false', autocapitalize: 'sentences', 'aria-label': T().plan,
    });
    area.value = db.plan;
    area.placeholder = T().planPlaceholder;
    // Grow to fit the text. Collapsing it to measure would shorten the page for a moment and
    // make the browser jump the scroll, so the scroll position is put back.
    const fit = () => {
      const se = document.scrollingElement || document.documentElement;
      const y = se.scrollTop;
      area.style.height = 'auto';
      area.style.height = `${area.scrollHeight}px`;
      se.scrollTop = y;
    };
    // Presets: tap to load one. The one matching the text is lit.
    const presetButtons = PRESETS.map(p => el('button', { type: 'button', onclick: () => usePreset(p) }, presetName(p)));
    const describe = () => {
      const rs = parsePlan(area.value);
      summary.textContent = rs.length
        ? rs.map(r => (r.day == null ? r.name : `${T().dayShort[r.day]} ${r.name}`)).join(' · ')
        : T().nothingPlanned;
      PRESETS.forEach((p, i) => presetButtons[i].setAttribute('aria-pressed', String(isPreset(p, area.value))));
    };
    // Memory is updated on every keystroke (so leaving the screen uses the new plan right
    // away); the write to storage is batched.
    area.addEventListener('input', () => {
      if (area.value.length > PLAN_MAX) area.value = area.value.slice(0, PLAN_MAX);
      db.plan = area.value;
      fit();
      describe();
      clearTimeout(planTimer);
      planTimer = setTimeout(flushPlan, 400);
    });
    area.addEventListener('blur', flushPlan);
    mount(el('div', { class: 'view' },
      header(),
      el('h1', { class: 'title' }, T().plan),
      summary,
      el('div', { class: 'presets', role: 'group', 'aria-label': T().presets }, ...presetButtons),
      area,
      el('p', { class: 'hint' }, ...T().hint.flatMap(([line, what]) => [el('code', null, line), el('span', null, what)]))));
    describe();
    refitPlan = fit;
    requestAnimationFrame(fit);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (refitPlan === fit) fit(); });
  }

  /* ---------- backup ---------- */

  async function exportData() {
    const name = `track-${todayKey()}.json`;
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const touch = window.matchMedia('(pointer: coarse)').matches;
    if (touch && typeof File === 'function' && navigator.canShare) {
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        let shared = false;
        try { await navigator.share({ files: [file] }); shared = true; } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
        if (shared) return backedUp();
      }
    }
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    backedUp();
  }

  // Clear the reminder in place (a redraw would jump the page back to the top).
  function backedUp() {
    db.lastBackup = todayKey();
    save();
    const note = app.querySelector('footer .backup');
    if (note) note.remove();
    const due = app.querySelector('footer .due');
    if (due) due.classList.remove('due');
  }

  async function importFile(input) {
    const f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    let data = null;
    let parsed = null;
    try { parsed = JSON.parse(await f.text()); data = sanitize(parsed); } catch (_) { /* handled below */ }
    if (!data) { alert(T().notABackup); return; }
    if (typeof parsed.plan !== 'string') data.plan = db.plan; // older backups have no plan: keep yours
    if (!REST_STEPS.includes(parsed.rest)) data.rest = db.rest; // nor a rest length
    const n = workoutKeys(data.days).length;
    if (!confirm(T().replaceAll(n))) return;
    data.lang = db.lang; // the language is this phone's choice, not the file's
    if (!data.name) data.name = db.name;
    data.onboarded = true; // you're past the intro on this phone, whatever the file says
    db = data;
    const preset = PRESETS.find(p => isPreset(p, db.plan));
    if (preset) db.plan = presetPlan(preset); // an unedited preset comes in this phone's language
    db.lastBackup = todayKey(); // this phone now matches a backup file you have
    save();
    refreshNames();
    route();
  }

  /* ---------- routing ---------- */

  // LT · EN, redrawing the current screen.
  function langSwitch(redraw) {
    return el('nav', { class: 'lang', 'aria-label': T().language },
      ...['lt', 'en'].flatMap((l, i) => [
        i ? el('span', { 'aria-hidden': 'true' }, '·') : null,
        el('button', {
          type: 'button', lang: l, 'aria-pressed': String(lang() === l),
          onclick: () => { changeLang(l); redraw(); },
        }, l.toUpperCase()),
      ]));
  }

  // First launch, and later from the header: your name, and the language. Stays on this phone.
  function renderProfile(first, draft) {
    current = { view: first ? 'onboarding' : 'profile' };
    const t = T();
    const hello = el('span');
    const input = el('input', {
      class: 'ob-input', value: draft != null ? draft : db.name, maxlength: '40',
      autocomplete: 'given-name', enterkeyhint: 'done', autocapitalize: 'words',
    });
    const tick = el('span', { class: 'ob-tick', 'aria-hidden': 'true' }, '✓');
    const sync = () => {
      tick.hidden = !clean(input.value);
      hello.textContent = clean(input.value) || '…';
    };
    input.addEventListener('input', sync);
    sync();
    const done = () => {
      const name = clean(input.value).slice(0, 40);
      if (!name) {
        input.classList.remove('nope');
        void input.offsetWidth;
        input.classList.add('nope');
        input.focus();
        return;
      }
      db.name = name;
      db.onboarded = true;
      save();
      location.hash = '#/';
      route();
    };
    input.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      done();
    });
    mount(el('div', { class: 'ob' },
      el('div', { class: 'ob-top' },
        first ? el('span') : el('a', { href: '#/', class: 'ob-close', 'aria-label': t.tabs.today }, '←'),
        langSwitch(() => renderProfile(first, input.value))),
      // "Welcome," only greets you the first time; after that it's just your name.
      el('div', { class: 'ob-head' }, el('h1', { class: 'ob-hello' }, ...(first ? [t.ob.welcome, el('br')] : []), hello)),
      el('div', { class: 'ob-form' },
        el('label', { class: 'ob-field' }, el('span', { class: 'ob-label' }, t.ob.name), el('span', { class: 'ob-line' }, input, tick))),
      el('div', { class: 'ob-nav' }, el('button', { type: 'button', class: 'ob-next', onclick: done }, first ? t.ob.start : t.ob.save, ' ▸'))));
  }

  // "70 × 12, 12, 11 · 75 × 8": a session's sets, with repeated weights written once.
  function setsLine(sets) {
    const parts = [];
    for (const s of sets) {
      const last = parts[parts.length - 1];
      if (s.min !== undefined) parts.push({ text: fmtCardio(s) });
      else if (last && last.kg === s.kg) last.reps.push(s.reps);
      else parts.push({ kg: s.kg, reps: [s.reps] });
    }
    return parts.map(p => p.text || `${p.kg ? fmtKg(p.kg) : 'bw'} × ${p.reps.join(', ')}`).join(' · ');
  }

  const LT_MONTHS = ['saus.', 'vas.', 'kov.', 'bal.', 'geg.', 'birž.', 'liep.', 'rugp.', 'rugs.', 'spal.', 'lapkr.', 'gruod.'];

  // Your best set of a lift: the strongest by estimated max, else the most reps (bodyweight),
  // else the farthest or longest (cardio).
  function bestSet(sets) {
    const by = f => sets.reduce((a, b) => (f(b) > f(a) ? b : a));
    if (sets.some(s => e1rm(s) > 0)) return by(e1rm);
    if (sets.some(s => s.min !== undefined)) return by(s => (s.km || 0) * 1000 + (s.min || 0));
    return by(s => s.reps || 0);
  }

  // One lift's history: every session, newest first. Tap one to open that day.
  function renderExercise(name, back) {
    current = { view: 'exercise', name };
    const n = same(name);
    const sessions = [];
    let best = 0;
    for (const k of sortedKeys()) {
      const e = db.days[k].find(x => same(x.name) === n && x.sets.length);
      if (!e) continue;
      const top = Math.max(...e.sets.map(e1rm));
      sessions.push({ k, sets: e.sets, pr: best > 0 && top > best + 1e-9 });
      best = Math.max(best, top);
    }
    sessions.reverse();
    const t = T();
    const all = sessions.flatMap(s => s.sets);
    // "12 Oct" / "spal. 12" (Lithuanian has no short month names of its own in the browser).
    const date = k => {
      const d = dateOf(k);
      const year = d.getFullYear() !== new Date().getFullYear() ? ` ’${String(d.getFullYear()).slice(2)}` : '';
      return lang() === 'lt' ? `${LT_MONTHS[d.getMonth()]} ${d.getDate()}${year}` : `${fmt(k, { day: 'numeric', month: 'short' })}${year}`;
    };
    mount(el('div', { class: 'view hist' },
      el('a', { href: back, class: 'back', 'aria-label': t.back }, '←'),
      el('h1', { class: 'title' }, name),
      el('p', { class: 'sub' }, sessions.length ? `${t.sessions(sessions.length)} · ${t.best} ${setText(bestSet(all))}` : t.nothingYet),
      sessions.length > 0 && el('div', { class: 'sessions' },
        ...sessions.map(s => el('a', { class: 'session', href: `#/${s.k}`, 'aria-label': `${fullDate(s.k)}: ${setsLine(s.sets)}${s.pr ? `, ${t.pr}` : ''}` },
          el('span', { class: 'session-d' }, date(s.k)),
          el('span', { class: 'session-s' }, setsLine(s.sets)),
          s.pr ? el('span', { class: 'pr', 'aria-hidden': 'true' }, 'PR') : el('span'))))));
  }

  /* ---------- stats: muscles, the body, and the screens after a workout ---------- */

  // Every muscle on the figure: real ones you can see and train, in body order (a tie in the
  // ranking keeps this order), with the side and the crop the small figures show it from.
  const MUSCLE_VIEW = {
    pecs: ['front', 'chest'], frontDelt: ['front', 'shoulders'], sideDelt: ['front', 'shoulders'], rearDelt: ['back', 'shoulders'],
    biceps: ['front', 'arm'], brachialis: ['front', 'arm'], triceps: ['back', 'arm'], brachioradialis: ['front', 'forearm'],
    flexors: ['front', 'forearm'], extensors: ['back', 'forearm'], traps: ['back', 'upper'], infraspinatus: ['back', 'upper'],
    teres: ['back', 'upper'], lats: ['back', 'trunk'], serratus: ['front', 'chest'], abs: ['front', 'trunk'],
    obliques: ['front', 'trunk'], erectors: ['back', 'trunk'], gluteMax: ['back', 'hips'], gluteMed: ['back', 'hips'],
    quads: ['front', 'thighs'], adductors: ['front', 'thighs'], hamstrings: ['back', 'thighs'], gastrocnemius: ['back', 'shins'],
    soleus: ['back', 'shins'], tibialis: ['front', 'shins'],
  };
  const MUSCLES = Object.keys(MUSCLE_VIEW);

  // What a lift works, from its name in either language: [pattern, main muscles, helpers].
  // The first match wins, so the specific ones come first ("leg curl" before "curl").
  const MOVES = [
    [/rear delt|reverse (pec|fly|flye)|galin|atvedim/, ['rearDelt'], ['infraspinatus', 'traps', 'teres']],
    [/face ?pull|prie veido/, ['rearDelt', 'infraspinatus'], ['traps']],
    [/external rotation|išorin\S* rotacij/, ['infraspinatus'], ['rearDelt']],
    [/upright row|prie smakro/, ['sideDelt', 'traps'], ['frontDelt', 'biceps']],
    [/lateral|side raise|šonini|į šalis|i šalis/, ['sideDelt'], ['traps']],
    [/front raise|į priekį/, ['frontDelt'], ['pecs']],
    [/back extension|hyperext|good morning|nugaros.*tiesim|sėdmenų tiesim/, ['erectors'], ['gluteMax', 'hamstrings']],
    [/leg curl|hamstring curl|nordic|kojų lenkim/, ['hamstrings'], ['gastrocnemius']],
    [/leg extension|kojų tiesim/, ['quads'], []],
    [/seated calf|sėdint.*blauzd|blauzd.*sėdint/, ['soleus'], ['gastrocnemius']],
    [/calf|calves|blauzd/, ['gastrocnemius'], ['soleus']],
    [/tibialis|tib raise/, ['tibialis'], []],
    [/abduct|atitraukim|clamshell/, ['gluteMed'], []],
    [/glute|hip thrust|bridge|klubų|sėdmen/, ['gluteMax'], ['hamstrings', 'gluteMed']],
    [/tricep|push-?down|skull|kickback|french press|close.?grip (bench|press)/, ['triceps'], []],
    [/reverse curl|reverse wrist|wrist extension|atbulin/, ['extensors', 'brachioradialis'], ['biceps']],
    [/wrist|forearm|farmer|carry|gripper|grip trainer|dilb|riešo|ūkinink/, ['flexors'], ['traps', 'brachioradialis']],
    [/hammer|plaktuk/, ['brachialis', 'brachioradialis'], ['biceps']],
    [/curl|bicep|lenkim/, ['biceps'], ['brachialis', 'brachioradialis', 'flexors']],
    [/romanian|rdl|stiff|rumuniš/, ['hamstrings', 'gluteMax'], ['erectors', 'flexors']],
    [/trap ?bar/, ['quads', 'gluteMax'], ['hamstrings', 'erectors', 'traps', 'flexors']],
    [/sumo/, ['gluteMax', 'adductors', 'hamstrings'], ['quads', 'erectors', 'traps', 'flexors']],
    [/deadlift|mirties/, ['gluteMax', 'hamstrings', 'erectors'], ['quads', 'traps', 'flexors', 'lats']],
    [/shrug|gūžč|trapec/, ['traps'], ['flexors']],
    [/adduct|pritraukim/, ['adductors'], []],
    [/lunge|split|bulgar|step.?up|įtūpst|žingsn/, ['quads', 'gluteMax'], ['adductors', 'gluteMed', 'hamstrings']],
    [/leg press|hack|kojų spaudim/, ['quads'], ['gluteMax', 'adductors']],
    [/squat|pritūp/, ['quads', 'gluteMax'], ['adductors', 'erectors']],
    [/chin-?ups?|atvirkštiniu suėmimu/, ['lats', 'biceps', 'teres'], ['brachialis', 'rearDelt']],
    [/pull-?down|pull-?ups?|\blats?\b|viršutinio bloko|prisitrauk/, ['lats', 'teres'], ['biceps', 'brachialis', 'rearDelt', 'traps']],
    [/pullover/, ['lats'], ['pecs', 'serratus', 'teres', 'triceps']],
    [/row|trauk|irklav/, ['lats', 'traps'], ['teres', 'rearDelt', 'infraspinatus', 'biceps', 'brachialis']],
    [/shoulder press|overhead press|military|\bohp\b|arnold|pečių spaud|virš galvos/, ['frontDelt'], ['sideDelt', 'triceps', 'traps', 'serratus']],

  const workedCache = new Map();
  function worked(name) {
    let w = workedCache.get(name);
    if (w !== undefined) return w;
    const text = `${same(name)} ${norm(name)}`;
    const hit = !isCardio(name) && MOVES.find(([re]) => re.test(text));
    w = hit ? { main: hit[1], help: hit[2] } : null;
    workedCache.set(name, w);
    return w;
  }

  // Two ways to train each muscle, for one you haven't trained yet. Each one maps to that
  // muscle in the list above.
  const TRAIN_WITH = {

  // Sets per muscle over the days from..to: a lift's main muscles get the whole set, the ones
  // that help get half. Cardio, and lifts the list above doesn't know, don't count.
  function muscleSets(from, to) {
    const out = Object.fromEntries(MUSCLES.map(m => [m, 0]));
    for (const k of Object.keys(db.days)) {
      if (k < from || k > to) continue;
      for (const e of db.days[k]) {
        const n = e.sets.filter(s => s.min === undefined).length;
        const w = n && worked(e.name);
        if (!w) continue;
        for (const m of w.main) out[m] += n;
        for (const m of w.help) out[m] += n / 2;
      }
    }
    return out;
  }

  // Zones by sets a week: 0 not trained, 1 maintaining (1–5), 2 growing (6–11),
  // 3 the focus zone (12–15), 4 done (16, the goal, or more).
  const GOAL = 16;
  const zoneOf = v => (v >= GOAL ? 4 : v >= 12 ? 3 : v >= 6 ? 2 : v >= 1 ? 1 : 0);
  const ZONE_NEXT = [6, 6, 12, GOAL];   // where the next zone starts
  const ZONE_COLOR = ['var(--ghost)', 'var(--maintain)', 'var(--grow)', 'var(--focus)', 'var(--focus)'];

  // Levels, as in a game: every set is experience for the muscles it works, 10 XP for a main
  // muscle and 5 for a helper, and a record is worth 20 more. Level n starts at 30·(n−1)² XP,
  // so the first levels come in a session or two and the high ones take years.
  const XP_MAIN = 10;
  const XP_HELP = 5;
  const XP_PR = 20;
  const levelOf = xp => (xp > 0 ? Math.floor(Math.sqrt(xp / 30)) + 1 : 0);
  const xpAt = lv => 30 * (lv - 1) ** 2;
  const TIERS = [[50, 'elite'], [35, 'diamond'], [20, 'platinum'], [10, 'gold'], [5, 'silver'], [1, 'bronze'], [0, 'untrained']];
  const tierOf = lv => TIERS.find(([from]) => lv >= from)[1];

  // Everything the stats know about each muscle, from the whole log up to `upTo`: experience,
  // sets, volume, the days it was trained, and the lifts that train it.
  function muscleBook(upTo) {
    const book = {};
    for (const m of MUSCLES) book[m] = { xp: 0, sets: 0, volume: 0, days: 0, last: null, lifts: new Map() };
    const bestSoFar = new Map();   // lift -> best estimated max, for records
    for (const k of sortedKeys()) {
      if (k > upTo) break;
      const hit = new Set();
      for (const e of db.days[k]) {
        const sets = e.sets.filter(s => s.min === undefined);
        const w = sets.length && worked(e.name);
        if (!w) continue;
        const id = same(e.name);
        const before = bestSoFar.get(id) || 0;
        let top = before;
        let prs = 0;
        for (const s of sets) {
          const v = e1rm(s);
          if (before && v > top + 1e-9) prs++;   // the first time a lift is logged nothing is a record
          top = Math.max(top, v);
        }
        bestSoFar.set(id, top);
        const volume = sets.reduce((n, s) => n + s.kg * s.reps, 0);
        for (const [list, main] of [[w.main, true], [w.help, false]]) {
          for (const m of list) {
            const b = book[m];
            b.xp += sets.length * (main ? XP_MAIN : XP_HELP) + (main ? prs * XP_PR : 0);
            b.sets += main ? sets.length : sets.length / 2;
            if (main) b.volume += volume;
            b.last = k;
            hit.add(m);
            const lift = b.lifts.get(id) || { name: e.name, main: false, last: k, best: 0 };
            lift.name = e.name;
            lift.main = lift.main || main;
            lift.last = k;
            lift.best = Math.max(lift.best, ...sets.map(e1rm));
            b.lifts.set(id, lift);
          }
        }
      }
      for (const m of hit) book[m].days++;
    }
    for (const m of MUSCLES) {
      const b = book[m];
      b.level = levelOf(b.xp);
      b.liftList = [...b.lifts.values()].sort((x, y) => (y.main - x.main) || (y.last > x.last ? 1 : y.last < x.last ? -1 : 0));
      b.str = b.liftList.filter(l => l.main).reduce((best, l) => (l.best > (best ? best.best : 0) ? l : best), null);
    }
    return book;
  }

  // Weeks in a row (Monday to Sunday) with a workout, up to the week of `key`. The week you're
  // in only counts once you've trained, and doesn't break the streak before it's over.
  function weekStreak(key) {
    const weeks = new Set(workoutKeys(db.days).filter(k => k <= key).map(mondayOf));
    let w = mondayOf(key);
    if (!weeks.has(w)) w = shiftDays(w, -7);
    let n = 0;
    while (weeks.has(w)) { n++; w = shiftDays(w, -7); }
    return n;
  }

  // How a lift moves up, from its sessions up to `upTo`: the reps and sets still missing at your
  // working weight before the next 2.5 kg. A planned lift goes by its plan (sets × the top of the
  // rep range, the rule Today's prefill follows); one you added yourself is ready once every
  // working set matches your best one. A bodyweight lift at the top moves to a harder version.
  // The pace is your own: the reps a session you've been adding at this weight, so the estimate
  // needs two sessions at it.
  function nextStep(name, upTo) {
    const id = same(name);
    const runs = [];   // this lift's sessions, newest first
    const keys = sortedKeys();
    for (let i = keys.length - 1; i >= 0 && runs.length < 8; i--) {
      if (keys[i] > upTo) continue;
      const e = db.days[keys[i]].find(x => same(x.name) === id && x.sets.length);
      if (e) runs.push(e);
    }
    if (!runs.length || cardioEx(runs[0])) return null;
    let target = runs[0].target;
    if (!target) {
      const kg = Math.max(...runs[0].sets.map(s => s.kg || 0));
      const working = runs[0].sets.filter(s => (s.kg || 0) === kg);
      target = { sets: working.length, reps: Math.max(...working.map(s => s.reps)) };
    }
    const top = target.repsTo || target.reps;
    const score = e => {
      const kg = Math.max(...e.sets.map(s => s.kg || 0));
      const reps = e.sets.filter(s => (s.kg || 0) === kg).map(s => s.reps).sort((a, b) => b - a).slice(0, target.sets);
      return { kg, reps, done: reps.reduce((n, r) => n + Math.min(r, top), 0) };
    };
    const now = score(runs[0]);
    const step = {
      kg: now.kg,
      short: now.reps.reduce((n, r) => n + Math.max(0, top - r), 0),
      missing: target.sets - now.reps.length,
      sessions: 0,
    };
    step.ready = !step.short && !step.missing;
    if (now.kg) step.next = round2(now.kg + BUMP);
    else step.harder = harderOf(name);
    const streak = [now];
    for (const e of runs.slice(1)) {
      const s = score(e);
      if (s.kg !== now.kg) break;
      streak.push(s);
    }
    const gain = streak.length > 1 ? (now.done - streak[streak.length - 1].done) / (streak.length - 1) : 0;
    if (!step.ready && gain > 0) step.sessions = Math.ceil((target.sets * top - now.done) / gain);
    return step;
  }
