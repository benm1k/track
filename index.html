    abs: [['Hanging leg raise', 'Kojų kėlimas kybant'], ['Cable crunch', 'Pilvo presas su lynu']],
    obliques: [['Side plank', 'Šoninė lenta'], ['Russian twist', 'Rusiškas pasukimas']],
    erectors: [['Back extension', 'Nugaros tiesimas'], ['Deadlift', 'Mirties trauka']],
    gluteMax: [['Hip thrust', 'Klubų kėlimas su štanga'], ['Squat', 'Pritūpimai']],
    gluteMed: [['Hip abduction', 'Kojų atitraukimas'], ['Clamshell', 'Kriauklė (clamshell)']],
    tfl: [['Hip abduction', 'Kojų atitraukimas']],
    quads: [['Squat', 'Pritūpimai'], ['Leg extension', 'Kojų tiesimas']],
    sartorius: [['Cable hip flexion', 'Klubo lenkimas su lynu']],
    adductors: [['Adductor machine', 'Kojų pritraukimas'], ['Copenhagen plank', 'Kopenhagos lenta']],
    gracilis: [['Adductor machine', 'Kojų pritraukimas'], ['Copenhagen plank', 'Kopenhagos lenta']],
    hamstrings: [['RDL', 'Rumuniška mirties trauka'], ['Leg curl', 'Kojų lenkimas']],
    gastrocnemius: [['Calf raise', 'Blauzdų kėlimas']],
    soleus: [['Seated calf raise', 'Blauzdų kėlimas sėdint']],
    tibialis: [['Tibialis raise', 'Tibialis kėlimas']],
    peroneals: [['Band ankle eversion', 'Pėdos išvertimas su guma']],
  };

  // Sets per muscle over the days from..to: a lift's main muscles get the whole set, the ones
  // that help get half. Cardio, and lifts the list above doesn't know, don't count.
  function muscleSets(from, to) {
    const out = Object.fromEntries(MUSCLES.map(m => [m, 0]));
    for (const k of Object.keys(db.days)) {
      if (k < from || k > to) continue;
      for (const e of db.days[k]) {
        const n = e.sets.filter(s => s.min === undefined).length;
        const w = n && worked(e.name);
        if (!w) continue;
        for (const m of w.main) out[m] += n;
        for (const m of w.help) out[m] += n / 2;
      }
    }
    return out;
  }

  // Zones by sets a week: 0 not trained, 1 maintaining (1–5), 2 growing (6–11),
  // 3 the focus zone (12–15), 4 done (16, the goal, or more).
  const GOAL = 16;
  const zoneOf = v => (v >= GOAL ? 4 : v >= 12 ? 3 : v >= 6 ? 2 : v >= 1 ? 1 : 0);
  const ZONE_NEXT = [6, 6, 12, GOAL];   // where the next zone starts
  const ZONE_COLOR = ['var(--ghost)', 'var(--maintain)', 'var(--grow)', 'var(--focus)', 'var(--focus)'];

  // Levels, as in a game: every set is experience for the muscles it works, 10 XP for a main
  // muscle and 5 for a helper, and a record is worth 20 more. Level n starts at 30·(n−1)² XP,
  // so the first levels come in a session or two and the high ones take years.
  const XP_MAIN = 10;
  const XP_HELP = 5;
  const XP_PR = 20;
  const levelOf = xp => (xp > 0 ? Math.floor(Math.sqrt(xp / 30)) + 1 : 0);
  const xpAt = lv => 30 * (lv - 1) ** 2;
  const TIERS = [[50, 'elite'], [35, 'diamond'], [20, 'platinum'], [10, 'gold'], [5, 'silver'], [1, 'bronze'], [0, 'untrained']];
  const tierOf = lv => TIERS.find(([from]) => lv >= from)[1];

  // Everything the stats know about each muscle, from the whole log up to `upTo`: experience,
  // sets, volume, the days it was trained, and the lifts that train it.
  function muscleBook(upTo) {
    const book = {};
    for (const m of MUSCLES) book[m] = { xp: 0, sets: 0, volume: 0, days: 0, last: null, lifts: new Map() };
    const bestSoFar = new Map();   // lift -> best estimated max, for records
    for (const k of sortedKeys()) {
      if (k > upTo) break;
      const hit = new Set();
      for (const e of db.days[k]) {
        const sets = e.sets.filter(s => s.min === undefined);
        const w = sets.length && worked(e.name);
        if (!w) continue;
        const id = same(e.name);
        const before = bestSoFar.get(id) || 0;
        let top = before;
        let prs = 0;
        for (const s of sets) {
          const v = e1rm(s);
          if (before && v > top + 1e-9) prs++;   // the first time a lift is logged nothing is a record
          top = Math.max(top, v);
        }
        bestSoFar.set(id, top);
        const volume = sets.reduce((n, s) => n + s.kg * s.reps, 0);
        for (const [list, main] of [[w.main, true], [w.help, false]]) {
          for (const m of list) {
            const b = book[m];
            b.xp += sets.length * (main ? XP_MAIN : XP_HELP) + (main ? prs * XP_PR : 0);
            b.sets += main ? sets.length : sets.length / 2;
            if (main) b.volume += volume;
            b.last = k;
            hit.add(m);
            const lift = b.lifts.get(id) || { name: e.name, main: false, last: k, best: 0 };
            lift.name = e.name;
            lift.main = lift.main || main;
            lift.last = k;
            lift.best = Math.max(lift.best, ...sets.map(e1rm));
            b.lifts.set(id, lift);
          }
        }
      }
      for (const m of hit) book[m].days++;
    }
    for (const m of MUSCLES) {
      const b = book[m];
      b.level = levelOf(b.xp);
      b.liftList = [...b.lifts.values()].sort((x, y) => (y.main - x.main) || (y.last > x.last ? 1 : y.last < x.last ? -1 : 0));
      b.str = b.liftList.filter(l => l.main).reduce((best, l) => (l.best > (best ? best.best : 0) ? l : best), null);
    }
    return book;
  }

  // Weeks in a row (Monday to Sunday) with a workout, up to the week of `key`. The week you're
  // in only counts once you've trained, and doesn't break the streak before it's over.
  function weekStreak(key) {
    const weeks = new Set(workoutKeys(db.days).filter(k => k <= key).map(mondayOf));
    let w = mondayOf(key);
    if (!weeks.has(w)) w = shiftDays(w, -7);
    let n = 0;
    while (weeks.has(w)) { n++; w = shiftDays(w, -7); }
    return n;
  }

  // How a lift moves up, from its sessions up to `upTo`. A planned lift goes by its plan (sets ×
  // the top of the rep range, the rule Today's prefill follows); one you added yourself is ready
  // once every working set matches your best one. Then the weight goes up a step (bumpFor) and
  // the reps to aim for come from your best set (repsAt). Three sessions in a row at one weight
  // without a rep gained is a stall: drop about 10% and build back. A bodyweight lift at the top
  // moves to its harder version. The estimate is your own pace at this weight (two sessions
  // there at least), given as a range and left out past 12 workouts.
  function nextStep(name, upTo) {
    const id = same(name);
    const runs = [];   // this lift's sessions, newest first
    const keys = sortedKeys();
    for (let i = keys.length - 1; i >= 0 && runs.length < 8; i--) {
      if (keys[i] > upTo) continue;
      const e = db.days[keys[i]].find(x => same(x.name) === id && x.sets.length);
      if (e) runs.push(e);
    }
    if (!runs.length || cardioEx(runs[0])) return null;
    let target = runs[0].target;
    if (!target) {
      const kg = Math.max(...runs[0].sets.map(s => s.kg || 0));
      const working = runs[0].sets.filter(s => (s.kg || 0) === kg);
      target = { sets: working.length, reps: Math.max(...working.map(s => s.reps)) };
    }
    const top = target.repsTo || target.reps;
    const score = e => {
      const kg = Math.max(...e.sets.map(s => s.kg || 0));
      const reps = e.sets.filter(s => (s.kg || 0) === kg).map(s => s.reps).sort((a, b) => b - a).slice(0, target.sets);
      return { kg, reps, done: reps.reduce((n, r) => n + Math.min(r, top), 0) };
    };
    const now = score(runs[0]);
    const step = {
      kg: now.kg,
      short: now.reps.reduce((n, r) => n + Math.max(0, top - r), 0),
      missing: target.sets - now.reps.length,
    };
    step.ready = !step.short && !step.missing;
    step.held = HOLD.test(`${same(name)} ${norm(name)}`);   // a hold's "reps" are seconds
    if (now.kg) {
      step.next = round2(now.kg + bumpFor(name, now.kg));
      if (step.ready) step.nextReps = repsAt(runs[0].sets, now.kg, step.next, top);
    } else {
      step.harder = harderOf(name);
    }
    const streak = [now];   // sessions in a row at this same weight
    for (const e of runs.slice(1)) {
      const s = score(e);
      if (s.kg !== now.kg) break;
      streak.push(s);
    }
    if (!step.ready && !step.missing && now.kg && streak.length >= 3 && streak[0].done <= streak[2].done) {
      const s = bumpFor(name, now.kg);
      step.stall = round2(Math.min(now.kg - s, Math.round(now.kg * 0.9 / s) * s));
      if (step.stall <= 0) delete step.stall;
    }
    const gain = streak.length > 1 ? (now.done - streak[streak.length - 1].done) / (streak.length - 1) : 0;
    if (!step.ready && !step.stall && gain > 0) {
      const left = (target.sets * top - now.done) / gain;
      const soon = Math.max(1, Math.ceil(left));
      if (soon <= 12) step.eta = [soon, Math.max(soon, Math.ceil(left * 1.5))];
    }
    return step;
  }

  const HOLD = /plank|\bhold\b|dead hang|wall sit|\bl.?sit\b|lenta|laikym|kabojim/;

  // The next rung of a bodyweight lift, easiest first within each ladder (push-ups to one arm,
  // pike to handstand, rows, core, squats to pistol, bridges). Anything else gets weight added.
  const HARDER = [
    [/wall push|atsispaud\S* nuo sienos/, 'Incline push-ups', 'Atsispaudimai nuo suoliuko'],
    [/knee push|incline push|atsispaud\S* nuo (kelių|suoliuko)/, 'Push-ups', 'Atsispaudimai'],

    [/diamond|deimant/, 'Pseudo-planche push-ups', 'Pseudo planšės atsispaudimai'],
    [/weighted|su svoriu|freestanding|be sienos|long.?lever/, null, null],   // the top of a ladder: add weight
    [/handstand|ant rankų/, 'Freestanding handstand push-ups', 'Atsispaudimai stovint ant rankų be sienos'],

    [/one.?arm push|viena ranka/, 'Weighted push-ups', 'Atsispaudimai su svoriu'],
    [/push-?ups?|press-?ups?|atsispaud/, 'Diamond push-ups', 'Deimanto atsispaudimai'],
    [/bench dip|dip.*suoliuk/, 'Dips', 'Lygiagretės'],
    [/negative|neigiam/, 'Pull-ups', 'Prisitraukimai'],
    [/wide.?grip inverted|plati inversin/, 'Archer rows', 'Lankininko trauka'],
    [/inverted row|australian|inversin/, 'Wide-grip inverted rows', 'Plati inversinė trauka'],
    [/side plank|šoninė lenta/, 'Side plank with a raised leg', 'Šoninė lenta pakėlus koją'],
    [/kneeling.*(ab wheel|rollout)|ratukas nuo kelių/, 'Standing ab wheel rollout', 'Pilvo ratukas stovint'],
    [/hollow/, 'Kneeling ab wheel rollout', 'Pilvo ratukas nuo kelių'],
    [/copenhagen|kopenhag/, 'Long-lever Copenhagen plank', 'Kopenhagos lenta ištiesta koja (long-lever)'],
    [/plank|lenta/, 'Hollow hold', 'Tuščiaviduris laikymas (hollow)'],
    [/toes to bar|iki skersinio/, 'Windshield wipers', 'Valytuvai (windshield wipers)'],

  const SVG_NS = 'http://www.w3.org/2000/svg';
  function svgPath(d, cls) {
    const p = document.createElementNS(SVG_NS, 'path');

    p.setAttribute('class', cls);
    return p;
  }

  // The figure, front or back. Its parts are stored for the right half and mirrored, except the
  // outline and the parts that cross the middle. paint: muscle -> CSS colour; the rest is grey.
  function bodySvg(side, paint, view) {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', view || '0 4 200 450');
    svg.setAttribute('class', 'body');
    svg.setAttribute('aria-hidden', 'true');
    svg.append(svgPath(BODY.outline, 'sil'));
    for (const [m, d, middle] of BODY[side]) {
      for (const flip of middle ? [false] : [false, true]) {
        const p = svgPath(d, m === '~' ? 'ln' : m ? 'mu' : 'mu x');
        if (flip) p.setAttribute('transform', 'matrix(-1 0 0 1 200 0)');
        if (m && m !== '~') {
          p.setAttribute('data-m', m);
          if (paint[m]) p.style.fill = paint[m];
        }
        svg.append(p);
      }
    }
    return svg;
  }

  // Stats: the body in this week's colours, a few numbers, and every muscle ranked with its level.
  function renderStats() {
    current = { view: 'stats' };
    const t = T();
    const today = todayKey();
    const week = muscleSets(shiftDays(today, -6), today);
    const book = muscleBook(today);
    const weekly = m => Math.round(week[m]);
    const byWeek = (a, b) => week[b] - week[a];
    const byLevel = (a, b) => (book[b].xp - book[a].xp) || byWeek(a, b);
    const ranked = MUSCLES.slice().sort(statsSort === 'week' ? (a, b) => byWeek(a, b) || (book[b].xp - book[a].xp) : byLevel);
    const paint = {};
    for (const m of MUSCLES) if (weekly(m)) paint[m] = ZONE_COLOR[zoneOf(weekly(m))];

    // A rank only means something once the muscle has been trained (by the sort's measure).
    const counts = m => (statsSort === 'week' ? weekly(m) > 0 : book[m].xp > 0);
    const list = el('div', null, ...ranked.map((m, i) => muscleCard(m, counts(m) && i + 1, weekly(m), book[m], today)));
    const fig = el('div', { class: 'figure' });
    const sideButtons = ['front', 'back'].map((s, i) => el('button', {
      type: 'button', onclick: () => { statsSide = s; draw(); },
    }, t.sides[i]));
    const sides = el('nav', { class: 'sides', 'aria-label': t.figure }, ...sideButtons);
    fig.append(sides);
    // Only the drawing is swapped, so the button you pressed keeps focus.
    function draw() {
      const old = fig.querySelector('svg.body');
      const svg = bodySvg(statsSide, paint);
      if (old) old.replaceWith(svg);
      else fig.prepend(svg);
      sideButtons.forEach((b, i) => b.setAttribute('aria-pressed', String(['front', 'back'][i] === statsSide)));
    }
    // Tap a muscle on the figure to find it in the list.
    fig.addEventListener('click', e => {
      const part = e.target.closest('[data-m]');
      const card = part && list.querySelector(`.mcard[data-m="${part.getAttribute('data-m')}"]`);
      if (!card) return;
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.remove('flash');
      void card.offsetWidth;
      card.classList.add('flash');
    });
    draw();

    const stat = (v, unit, label) => el('div', null,
      el('div', { class: 'stat-v' }, String(v), unit && el('small', null, ` ${unit}`)),
      el('div', { class: 'stat-l' }, label));
    mount(el('div', { class: 'view stats-view' },
      header(),
      fig,
      el('p', { class: 'legend', 'aria-hidden': 'true' },
        ...[1, 2, 3].map(z => el('span', null, dot(ZONE_COLOR[z]), t.zones[z]))),
      el('div', { class: 'stats' },
        stat(weekStreak(today), t.wk, t.streak),
        stat(MUSCLES.reduce((n, m) => n + book[m].level, 0), null, t.totalLevel),
        stat(strengthSets(shiftDays(today, -6), today), null, t.setsWeek)),
      el('section', { class: 'panel', 'aria-label': t.yourProgress },
        el('div', { class: 'panel-head' },
          el('h2', null, t.yourProgress),
          el('button', {
            type: 'button', class: 'chip',
            onclick: () => {
              const y = window.scrollY;
              statsSort = statsSort === 'level' ? 'week' : 'level';
              renderStats();
              window.scrollTo(0, y);
              app.querySelector('.chip').focus({ preventScroll: true });
            },
          }, t.sorts[statsSort === 'level' ? 0 : 1], el('span', { 'aria-hidden': 'true' }, ' ▾'))),
        list)));
    if (statsY != null) { window.scrollTo(0, statsY); statsY = null; }
  }

  // One muscle, like a character sheet: its level and XP, its numbers, and the lifts that train it.
  function renderMuscle(m, back) {
    current = { view: 'muscle', m };
    const t = T();
    const today = todayKey();
    const book = muscleBook(today);
    const b = book[m];
    const v = Math.round(muscleSets(shiftDays(today, -6), today)[m]);
    const z = zoneOf(v);
    const rank = MUSCLES.slice().sort((x, y) => book[y].xp - book[x].xp).indexOf(m) + 1;
    const lv = b.level;
    const from = lv ? xpAt(lv) : 0;
    const to = xpAt(lv + 1);
    const share = lv ? Math.min(1, (b.xp - from) / (to - from)) : 0;
    const days = b.last ? Math.round((dateOf(today) - dateOf(b.last)) / 86400000) : null;
    const row = (label, ...value) => el('div', { class: 'sheet-row' }, el('dt', null, label), el('dd', null, ...value));
    const lifts = b.liftList.map(l => {
      const st = nextStep(l.name, today);
      return el('a', { class: 'lift', href: `#/ex/${encodeURIComponent(l.name)}` },
        el('span', { class: 'lift-n' }, l.name, !l.main && el('span', { class: 'lift-h' }, ` · ${t.helps}`)),
        st && el('span', { class: `lift-s${st.ready ? ' ready' : st.stall ? ' stall' : ''}` }, stepText(st)));
    });
    const untried = trainWith(m).filter(n => !b.liftList.some(l => same(l.name) === same(n)));

    mount(el('div', { class: 'view hist mus' },
      el('a', { href: back, class: 'back', 'aria-label': t.back }, '←'),
      el('h1', { class: 'title' }, t.muscles[m][0]),
      el('p', { class: 'sub' }, b.xp ? `${t.muscles[m][1]} · ${t.rankOf(rank, MUSCLES.length)}` : t.muscles[m][1]),
      el('div', { class: 'mus-fig' }, bodySvg(MUSCLE_VIEW[m][0], { [m]: z ? ZONE_COLOR[z] : 'rgba(255, 255, 255, .55)' })),
      el('div', { class: `lv-box tier-${tierOf(lv)}` },
        el('p', { class: 'lv-n' }, `${t.lv} ${lv}`, el('span', { class: 'lv-t' }, t.tiers[tierOf(lv)])),
        el('div', { class: 'xp', role: 'img', 'aria-label': `${bigNumber(b.xp)} XP` }, el('i', { style: `width:${Math.round(share * 100)}%` })),
        el('p', { class: 'xp-l' }, el('span', null, `${bigNumber(b.xp)} XP`), lv > 0 && el('span', null, t.xpLeft(bigNumber(to - b.xp), lv + 1)))),
      el('dl', { class: 'mus-sheet' },
        row(t.rows.week, el('b', null, `${v}`), ` / ${GOAL}`, el('span', { class: 'sheet-z' }, dot(ZONE_COLOR[z]), t.zones[z])),
        row(t.rows.strength, b.str ? el('b', null, `${fmtKg(Math.round(b.str.best * 2) / 2)} kg`) : '—',
          b.str && el('span', { class: 'sheet-c' }, ` ${t.est1rm} · ${b.str.name}`)),
        row(t.rows.sets, el('b', null, bigNumber(b.sets))),
        row(t.rows.volume, el('b', null, bigNumber(b.volume)), ' kg'),
        row(t.rows.sessions, el('b', null, String(b.days))),
        row(t.rows.last, days == null ? '—' : el('b', null, t.ago(days)),
          days != null && el('span', { class: 'sheet-c' }, ` · ${days >= 2 ? t.recovered : t.recovering}`))),
      el('h2', { class: 'mus-h' }, t.lifts),
      lifts.length ? el('div', { class: 'lifts' }, ...lifts) : el('p', { class: 'empty-note' }, t.noLifts),
      untried.length > 0 && el('p', { class: 'mus-try' }, `${t.trainWith}: ${untried.join(' · ')}`)));
  }

  // "Push day", "workout A": what the screens after a workout call it.
  function donePhrase(key) {
    const t = T();
    const title = dayTitle(key);
    return t.donePhrase(title, title === t.workout || title === t.cardio);
  }

  const clockTime = ms => new Date(ms).toLocaleTimeString(lang() === 'lt' ? 'lt-LT' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
  const bigNumber = n => Math.round(n).toLocaleString(lang() === 'lt' ? 'lt-LT' : 'en-GB');

  // After Finish: the streak counts up, each muscle the workout hit and where its week stands,
  // and what each lift needs next time to go up.
  function renderProgress(key) {
    const exs = (db.days[key] || []).filter(e => e.sets.length);
    if (!exs.length) { location.hash = '#/'; return; }
    current = { view: 'progress', key };
    const t = T();
    const streak = weekStreak(key);
    const grew = !workoutKeys(db.days).some(k => k >= mondayOf(key) && k < key);   // the week's first workout
    const today = muscleSets(key, key);
    const week = muscleSets(shiftDays(key, -6), key);
    const hit = MUSCLES.filter(m => today[m] > 0).sort((a, b) => today[b] - today[a]).slice(0, 8);

    const nums = [streak - 2, streak - 1, streak, streak + 1, streak + 2];
    const roll = grew && streak > 0;
    const strip = el('div', { class: 'drum-strip', style: `--i:${roll ? 1 : 2}` },
      ...nums.map(n => el('span', null, n >= 0 ? String(n) : '')));
    const streakCard = el('div', { class: 'streak-card', role: 'img', 'aria-label': `${t.workoutStreak}: ${t.weeks(streak)}` },
      el('p', { class: 'sc-l' }, t.workoutStreak),
      el('div', { class: 'drum' }, strip),
      el('p', { class: 'sc-u' }, t.weeksWord(streak)));

    const cards = hit.map(m => {
      const v = Math.round(week[m]);
      const d = Math.max(1, Math.round(today[m]));
      const z = Math.max(1, zoneOf(v));
      const dots = el('div', { class: 'dots', 'aria-hidden': 'true' });
      for (let s = 1; s <= GOAL; s++) dots.append(el('i', { class: s <= v - d ? 'was' : s <= v ? 'new' : null }));
      const [n, of] = t.setsOf(v, GOAL);
      return el('a', { class: 'pcard', href: `#/muscle/${m}`, style: `--z:${ZONE_COLOR[z]}`, 'aria-label': `${t.muscles[m][0]}: ${t.zones[z]}, ${n}${of}` },
        mini(m, ZONE_COLOR[z]),
        el('p', { class: 'pcard-n' }, t.muscles[m][0]),
        el('p', { class: 'zone' }, dot(ZONE_COLOR[z]), t.zones[z]),
        dots,
        el('p', { class: 'dots-l', 'aria-hidden': 'true' }, el('span', null, '0'), el('span', null, `+${d}`), el('span', null, String(GOAL))));
    });

    // Each lift once, in the order you did them.
    const seen = new Set();
    const steps = [];
    for (const e of exs) {
      if (cardioEx(e) || seen.has(same(e.name))) continue;
      seen.add(same(e.name));
      const st = nextStep(e.name, key);
      if (st) steps.push(el('a', { class: 'lift', href: `#/ex/${encodeURIComponent(e.name)}` },
        el('span', { class: 'lift-n' }, e.name),
        el('span', { class: `lift-s${st.ready ? ' ready' : st.stall ? ' stall' : ''}` }, stepText(st))));
    }

    mount(el('div', { class: 'view pg' },
      el('h1', { class: 'pg-title' }, t.todaysProgress),
      el('p', { class: 'pg-sub' }, t.congrats(donePhrase(key))),
      el('div', { class: 'carousel' }, streakCard, ...cards),
      steps.length > 0 && el('section', { class: 'next-up', 'aria-label': t.nextTime },
        el('h2', { class: 'mus-h' }, t.nextTime), ...steps),
      el('div', { class: 'dock' }, el('a', { class: 'pill', href: `#/done/${key}` }, t.continueLabel))));
    // This workout grew the streak: last week's number is laid out first, then rolls over.
    if (roll) {
      void strip.offsetWidth;
      strip.style.setProperty('--i', '2');
    }
  }

  // The workout's summary: its record (or best set), the streak, the time, volume and sets,
  // and the lifts that went up since last time.
  function renderDone(key) {
    const exs = (db.days[key] || []).filter(e => e.sets.length);
    const home = key === todayKey() ? '#/' : `#/${key}`;
    if (!exs.length) { location.hash = home; return; }
    current = { view: 'done', key };
    const t = T();

    let pr = null;
    let top = null;
    const improved = [];
    for (const e of exs) {
      const recs = records(key, e);
      for (const s of e.sets) {
        const v = e1rm(s);
        if (!v) continue;
        if (recs.has(s) && (!pr || v > e1rm(pr.s))) pr = { e, s };
        if (!top || v > e1rm(top.s)) top = { e, s };
      }
      // Better than last time: a heavier best set, or more reps on the same weight.
      const before = cardioEx(e) ? null : previous(key, e.name);
      if (!before || before.sets[0].min !== undefined) continue;
      const a = bestSet(e.sets);
      const b = bestSet(before.sets);
      if (!(e1rm(a) > e1rm(b) + 1e-9 || (a.kg === b.kg && a.reps > b.reps))) continue;
      improved.push({ e, a, delta: a.kg > b.kg ? `+${fmtKg(a.kg - b.kg)} kg` : a.reps > b.reps ? t.plusReps(a.reps - b.reps) : '↑' });
    }
    const best = pr || top;
    const st = dayStats(key);
    const all = exs.flatMap(e => e.sets);
    const volume = all.reduce((n, s) => n + (s.min === undefined ? s.kg * s.reps : 0), 0);
    const km = all.reduce((n, s) => n + (s.km || 0), 0);
    const timer = db.timers[key];
    const streak = weekStreak(key);

    const tile = (tone, icon, label, ...value) => el('div', { class: `tile ${tone}` },
      ico(icon), el('div', null, el('p', { class: 'tile-l' }, label), el('p', { class: 'tile-v' }, ...value)));
    let time = null;
    if (timer && timer.end) {
      const mins = Math.max(1, Math.round((timer.end - timer.start) / 60000));
      const ruler = el('div', { class: 'ruler', 'aria-hidden': 'true' });
      for (let i = 0; i < 41; i++) ruler.append(el('i', { class: i % 5 ? null : 'big' }));
      ruler.append(el('span', { class: 'ruler-pill' }, t.duration(Math.floor(mins / 60), mins % 60)));
      time = el('div', { class: 'tile t-blue wide' },
        ico('clock'),
        el('div', { class: 'times' },
          el('div', null, el('p', { class: 'tile-l' }, t.startTime), el('p', { class: 'tile-v' }, clockTime(timer.start))),
          el('div', null, el('p', { class: 'tile-l' }, t.endTime), el('p', { class: 'tile-v' }, clockTime(timer.end)))),
        ruler);
    }

    const list = improved.length ? el('section', { class: 'imp', hidden: true },
      ...improved.map(({ e, a, delta }) => el('a', { href: `#/ex/${encodeURIComponent(e.name)}` },
        el('span', { class: 'imp-n' }, e.name),
        el('span', { class: 'imp-s' }, setText(a)),
        el('span', { class: 'imp-d' }, delta)))) : null;
    const more = list && el('button', {
      type: 'button', class: 'pill ghost', 'aria-expanded': 'false',
      onclick: () => {
        list.hidden = !list.hidden;
        more.setAttribute('aria-expanded', String(!list.hidden));
        if (!list.hidden) list.scrollIntoView({ behavior: 'smooth', block: 'start' });
      },
    }, ico('sparkle'), t.improved(improved.length));

    const title = el('h1', { class: 'done-title' }, el('em', null, t.wellDone), t.completed(donePhrase(key)));
    mount(el('div', { class: 'view done' },
      el('a', { href: home, class: 'back', 'aria-label': t.back }, '←'),
      title,
      el('div', { class: 'tiles' },
        best
          ? tile('t-gold', 'trophy', pr ? t.prOf(best.e.name) : t.bestOf(best.e.name), `${fmtKg(best.s.kg)} kg`, el('small', null, ` × ${best.s.reps}`))
          : tile('t-gold', 'trophy', t.exercises, `${st.done}/${st.total}`),
        tile('t-red', 'calendar', t.streak, String(streak), el('small', null, ` ${t.weeksWord(streak).toLowerCase()}`)),
        time,
        volume ? tile('t-green', 'weight', t.volume, bigNumber(volume), el('small', null, ' kg'))
          : km ? tile('t-green', 'weight', t.distance, fmtKg(km), el('small', null, ' km'))
            : tile('t-green', 'weight', t.repsLabel, String(all.reduce((n, s) => n + (s.reps || 0), 0))),
        tile('t-amber', 'flame', t.sets, String(st.sets), st.planned > st.sets ? el('small', null, ` / ${st.planned}`) : null)),
      list,
      el('div', { class: 'dock' }, el('a', { class: 'pill', href: home }, t.finishWorkout), more)));
  }

  // Where a lift's history goes back to: the screen it was opened from. A muscle goes back the
  // same way (to Stats, or to today's progress after a workout).
  let backTo = '#/';
  let muscleBack = '#/stats';

  function route() {
    settleTimers();
    freezeTitles();
    syncWake();
    if (!db.onboarded) return renderProfile(true);
    if (current.view === 'plan') flushPlan();
    let h = location.hash.replace(/^#\/?/, '');
    try { h = decodeURIComponent(h); } catch (_) { h = ''; }
    if (h.startsWith('ex/') && clean(h.slice(3))) return renderExercise(clean(h.slice(3)), backTo);
    const muscle = h.startsWith('muscle/') && Object.prototype.hasOwnProperty.call(MUSCLE_VIEW, h.slice(7)) && h.slice(7);
    if (!muscle) muscleBack = `#/${h === todayKey() ? '' : h}`;
    if (!muscle && h !== 'stats') statsY = null;
    backTo = `#/${h === todayKey() ? '' : h}`;
    const hm = h.match(/^history(?:\/(\d{4})-(\d{2}))?$/);
    if (hm) {
      const mm = hm[2] ? Number(hm[2]) - 1 : -1;
      return renderHistory(hm[1] && mm >= 0 && mm <= 11 && Number(hm[1]) >= 1970 ? { y: Number(hm[1]), m: mm } : null);
    }
    if (h === 'plan') return renderPlan();
    if (h === 'stats') return renderStats();
    if (muscle) return renderMuscle(muscle, muscleBack);
    if (h === 'profile') return renderProfile(false);
    const after = h.match(/^(progress|done)\/(.+)$/);
    if (after && isDayKey(after[2])) return after[1] === 'progress' ? renderProgress(after[2]) : renderDone(after[2]);
    // Today's date (e.g. tapped in History) is home, so it rolls over at midnight like home does.
    if (h === todayKey()) { history.replaceState(null, '', '#/'); return renderDay(h, true); }
    if (isDayKey(h)) return renderDay(h, false);
    renderDay(todayKey(), true);
  }

  window.addEventListener('hashchange', route);

  // Another tab changed the data: reload it rather than overwrite it later.
  window.addEventListener('storage', e => {
    if (e.key === KEY || e.key === null) { db = load(); refreshNames(); route(); }
  });

  // Left open past midnight: roll the home screen over to the new day.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && current.view === 'day' &&
        current.isToday && current.key !== todayKey()) route();
  });

  freezeTitles();

  // An unedited preset saved in the other language moves to the app's language (today follows it).
  if (!db.onboarded && workoutKeys(db.days).length) {
    db.onboarded = true;
    save();
  }

  const savedPreset = PRESETS.find(p => isPreset(p, db.plan));
  if (savedPreset && db.plan.trim() !== presetPlan(savedPreset).trim()) {
    db.plan = presetPlan(savedPreset);
    save();
  }

  refreshNames();
  route();

  /* ---------- updates ---------- */

  // The app opens from its offline copy, and sw.js says when a newer one has come in. It's put
  // in place at a quiet moment: straight away if it lands while the app is still opening, else
  // the next time the app goes to the background or comes back, but never mid-workout or while
  // you're typing.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const openedAt = Date.now();
    let touched = false;
    let updateReady = false;
    document.addEventListener('pointerdown', () => { touched = true; }, { capture: true, passive: true });
    const busy = () => running(todayKey()) || rest.active() ||
      current.view === 'profile' || current.view === 'onboarding' ||
      !!(document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) ||
      [...app.querySelectorAll('.entry input, .add-ex input')].some(i => i.value.trim());
    const update = () => {
      if (!updateReady || busy()) return;
      try {   // never more than once in a short while, whatever happens
        if (Date.now() - Number(sessionStorage.getItem('track.updated') || 0) < 30000) return;
        sessionStorage.setItem('track.updated', String(Date.now()));
      } catch (_) { return; }
      flushPlan();
      location.reload();
    };
    navigator.serviceWorker.addEventListener('message', e => {
      if (!e.data || e.data.type !== 'updated') return;
      updateReady = true;
      if (!touched && Date.now() - openedAt < 4000) update();
    });
    document.addEventListener('visibilitychange', update);
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
