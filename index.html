<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="description" content="A minimal gym workout tracker.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Track.">
<title>Track.</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* JetBrains Mono (variable weight), shipped with the app and cached for offline, so it looks the same everywhere. */
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap; src: url(fonts/jetbrains-mono-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap; src: url(fonts/jetbrains-mono-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: rgba(255, 255, 255, .74);   /* 11:1 on black */
    --faint: rgba(255, 255, 255, .56); /* 6.4:1 on black, readable in a gym */
    --ghost: rgba(255, 255, 255, .34); /* last session's numbers: there if you look */
    --line: rgba(255, 255, 255, .14);  /* hairlines */
    /* One typeface for everything: JetBrains Mono. Hierarchy comes from size, weight and grey. */
    --font: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --display: var(--font);
    --mono: var(--font);
    --ease: cubic-bezier(.2, .8, .2, 1);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  html {
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font: 400 16px/1.45 var(--font);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    min-height: 100dvh;
  }

  a, button, input, textarea { font: inherit; color: inherit; }
  a { text-decoration: none; }
  button, input, textarea {
    background: none;
    border: 0;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  button { cursor: pointer; text-align: left; touch-action: manipulation; }
  input { width: 100%; min-width: 0; outline: none; caret-color: var(--fg); }
  input::placeholder { color: var(--faint); opacity: 1; }
  /* Chrome draws an arrow on inputs with a datalist; keep the suggestions, drop the arrow.
     Separate rules, because an unknown pseudo-element would void the whole list. */
  input::-webkit-calendar-picker-indicator { display: none !important; }
  input::-webkit-list-button { display: none !important; }
  ::selection { background: var(--fg); color: var(--bg); }
  :focus { outline: none; }
  :focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
  input:focus-visible { outline: none; }

  main {
    max-width: 34rem;
    margin: 0 auto;
    padding:
      max(24px, env(safe-area-inset-top))
      max(24px, env(safe-area-inset-right))
      calc(132px + env(safe-area-inset-bottom)) /* room for the tab bar */
      max(24px, env(safe-area-inset-left));
  }

  /* header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    font-size: 16px;
  }
  .mark { width: 19px; height: 19px; flex: none; }
  .warn { margin-top: 8px; font-size: 14px; color: var(--dim); }

  .title {
    margin-top: 56px;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(30px, 9vw, 38px);
    line-height: 1.1;
    letter-spacing: -.02em;
  }
  .sub { margin-top: 12px; font-family: var(--mono); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .label { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .label b { color: var(--fg); font-weight: 700; }

  /* profile header: the mark, your name and level; the whole row opens the profile */
  .profile { display: flex; align-items: center; gap: 12px; min-width: 0; min-height: 52px; transition: opacity .2s; -webkit-touch-callout: none; }
  .profile:active { opacity: .6; }
  .avatar { display: grid; place-items: center; flex: none; width: 44px; height: 44px; color: var(--fg); margin-left: -12px; }
  .avatar .mark { width: 20px; height: 20px; }
  .who { flex: 1; min-width: 0; }
  .who-name { display: block; font-family: var(--display); font-size: 18px; font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who-name.empty { color: var(--faint); }
  .who-level { display: block; font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }

  /* the day's card: the workout, date and three stats */
  .card {
    display: flex;
    flex-direction: column;
    margin-top: 20px;
    padding: 18px 0;
  }
  .card .title { margin-top: 6px; font-size: clamp(26px, 8vw, 32px); overflow-wrap: anywhere; }
  .card .sub { margin-top: 6px; color: rgba(255, 255, 255, .86); }
  .card .label { color: rgba(255, 255, 255, .86); }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: auto; padding-top: 22px; }
  .stat-v { font-family: var(--display); font-size: 21px; font-weight: 400; line-height: 1; white-space: nowrap; }
  .stat-v small { font-family: var(--mono); font-size: 11.5px; color: rgba(255, 255, 255, .82); }
  .stat-l { margin-top: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: rgba(255, 255, 255, .82); }
  /* Start / Finish under the numbers. */
  .go { align-self: flex-start; margin: 8px 0 -16px; padding: 16px 48px 16px 0; font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--fg); transition: opacity .2s; }
  .go:active { opacity: .5; }
  .go.stop { color: var(--dim); }
  .stat-v.live { font-variant-numeric: tabular-nums; }
  .next { margin-top: auto; padding-top: 22px; font-family: var(--mono); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: rgba(255, 255, 255, .9); }
  .next + .next { margin-top: 0; padding-top: 8px; }

  /* the workout: one card per exercise (tap to log) */
  .list { margin-top: 24px; }
  .ex { margin-bottom: 12px; }
  .ex-card {
    position: relative;
    display: grid;
    align-content: center;
    width: 100%;
    min-height: 84px;
    padding: 14px 0;
  }
  .ex-info { display: grid; gap: 4px; min-width: 0; }
  .ex-name { font-family: var(--display); font-size: 18px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; transition: color .3s; }
  .ex.done .ex-name { color: var(--dim); }   /* today: finished lifts step back */
  .ex-sub { font-family: var(--mono); font-size: 12.5px; letter-spacing: .04em; color: rgba(255, 255, 255, .86); }
  .ex-meta { margin-top: 6px; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: rgba(255, 255, 255, .78); }
  /* The set list folds open and shut: rows animate 0fr -> 1fr, so the height follows the content. */
  .ex-body { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .34s var(--ease), opacity .22s ease; }
  .ex.open .ex-body { grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows .34s var(--ease), opacity .3s ease .06s; }
  .ex-fold { min-height: 0; overflow: hidden; }
  .ex-pad { padding: 6px 2px 10px; }
  .ex-card { transition: transform .18s var(--ease); }
  .ex-card:active { transform: scale(.985); }
  /* Under the sets: the lift's history on the left, remove on the right. */
  .ex-foot { display: flex; justify-content: space-between; gap: 16px; }
  .ex-foot a, .ex-foot button { display: flex; align-items: center; min-height: 48px; padding: 14px 0; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); transition: color .2s; }
  .ex-foot a { padding-right: 32px; color: var(--dim); }
  .ex-foot button { margin-left: auto; padding-left: 32px; }
  .sets { margin-top: 6px; }
  .row {
    display: grid;
    grid-template-columns: 1.6em 3.6em 1.7em 1.1em 2.8em 1fr 2.2em;
    align-items: baseline;
    font-size: 16px;
  }
  .row > * { padding: 12px 0; }
  .n { font-family: var(--mono); color: var(--faint); font-size: 13px; }
  .w, .kg { text-align: right; padding-right: .3em; }
  .u { color: var(--dim); }
  .set { cursor: pointer; }
  .act { justify-self: end; align-self: center; min-height: 48px; color: var(--dim); padding: 12px 0 12px 28px; }
  .plus { color: var(--fg); font-size: 24px; font-weight: 400; line-height: 1; min-width: 56px; margin-right: -8px; padding: 12px 8px 12px 24px; text-align: right; }
  /* Always in the accessibility tree; shown on tap (.on) or keyboard focus. */
  .remove { font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .remove.on, .remove:focus-visible { opacity: 1; pointer-events: auto; }
  .plus { grid-column: 7; }
  .plus.save { font-size: 18px; }   /* ✓ while changing a logged set */
  /* Last session's matching set, barely visible at the right; "remove" takes its place. */
  .prev { grid-column: 6; grid-row: 1; justify-self: end; font-family: var(--mono); font-size: 12px; color: var(--ghost); white-space: nowrap; transition: opacity .15s; }
  .set .remove { grid-column: 6 / 8; grid-row: 1; }
  .remove.on + .prev, .remove:focus-visible + .prev { opacity: 0; }
  /* A set that beat your best for the lift. */
  .pr { grid-column: 6; grid-row: 1; justify-self: start; padding-left: .5em; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--fg); }
  /* The set being changed: its numbers are up in the fields below. */
  .set.editing, .set.editing .u { color: var(--faint); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .add-ex input { padding: 16px 0; font-family: var(--display); font-size: 18px; font-weight: 700; }


  /* plan */
  .plan {
    display: block;
    width: 100%;
    margin-top: 28px;
    font-size: 17px;
    line-height: 1.7;
    resize: none;
    overflow: hidden;
    outline: none;
    caret-color: var(--fg);
  }
  /* How to write a plan: a few example lines, each with a word on what it does. */
  .hint { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 18px; margin-top: 40px; font-size: 13px; line-height: 1.5; }
  .hint code { font: inherit; color: var(--dim); white-space: nowrap; }
  .hint span { color: var(--faint); }
  /* Comfortable tap targets; the negative margins keep the letters aligned with the summary. */
  .lang { display: flex; align-items: center; gap: 0; align-self: flex-start; margin: -14px -14px 0 0; font-family: var(--mono); font-size: 13px; color: var(--ghost); }
  .lang button { min-width: 46px; padding: 14px 14px; text-align: center; color: var(--dim); transition: color .2s; }
  .lang button[aria-pressed="true"] { color: var(--fg); }
  /* On Today, across from your name: smaller and dimmer than in the profile. */
  header .lang { flex: none; align-self: center; margin: 0 -14px 0 0; font-size: 12px; }
  header .lang button { color: var(--ghost); }
  header .lang button[aria-pressed="true"] { color: var(--dim); }
  .presets { display: flex; flex-wrap: wrap; gap: 2px 24px; margin-top: 36px; }
  .presets button { padding: 14px 0; font-family: var(--mono); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); transition: color .2s; }
  .presets button[aria-pressed="true"] { color: var(--fg); }

  /* history: a month calendar */
  .subrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 4px; }
  .subrow .sub { margin-top: 0; }
  .months { display: flex; gap: 0; margin-right: -16px; }
  .months a, .months span { padding: 14px 16px; font-size: 22px; font-weight: 400; line-height: 1; color: var(--dim); transition: color .2s; }
  .months .off { color: var(--ghost); }
  .cal { margin-top: 44px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; text-align: center; touch-action: pan-y; }
  .wd { padding-bottom: 12px; font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .cal-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
    min-height: 56px;
    padding-top: 8px;
    font-family: var(--display);
    font-size: 16px;
    color: var(--ghost);
  }
  .cal-day.has { color: var(--fg); }
  .cal-day.future { color: rgba(255, 255, 255, .18); }
  .cal-day.today .num { text-decoration: underline; text-decoration-color: var(--fg); text-decoration-thickness: 1px; text-underline-offset: 5px; }
  .cal-name {
    max-width: 100%;
    margin-top: 4px;
    overflow: hidden;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0;
    text-transform: uppercase;
    color: var(--dim);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  footer { margin-top: 72px; font-size: 15px; }
  .backup { font-size: 14px; color: var(--faint); }
  .backup-actions { display: flex; gap: 24px; }
  footer button { color: var(--dim); padding: 16px 0; font-family: var(--mono); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; transition: color .2s; }
  footer button.due { color: var(--fg); }

  /* bottom tab bar: History · Today · Plan */
  .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: var(--bg);
  }
  /* Each tab fills its whole third of the bar, edge to edge and the bar's full height, so a thumb
     anywhere near an icon lands. The icons themselves stay small and in the same place.
     No long-press link preview or text selection on them (iOS would show one instead of tapping). */
  .tabbar-inner { max-width: 34rem; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  .tab {
    display: grid;
    place-items: center;
    height: 76px;
    padding-bottom: 4px;
    color: var(--dim);
    transition: color .2s;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .tab[aria-current="page"], .tab:active { color: var(--fg); }
  .tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .tab .dot { stroke-width: 2.4; }
  .tab-home svg { width: 28px; height: 28px; fill: currentColor; stroke: none; } /* just the mark, a touch larger */
  /* Out of the way only while the on-screen keyboard is up (see syncKeyboard). */
  body.kb .tabbar { visibility: hidden; }

  /* Rest countdown: a quiet strip above the tab bar, with a hairline that runs out. */
  .restbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(76px + env(safe-area-inset-bottom));
    z-index: 9;
    padding: 0 max(24px, env(safe-area-inset-right)) 0 max(24px, env(safe-area-inset-left));
    background: var(--bg);
    transform: translateY(0);
    opacity: 1;
    transition: transform .3s var(--ease), opacity .3s ease;
  }
  .restbar.off { transform: translateY(12px); opacity: 0; pointer-events: none; }
  .rest-in { position: relative; max-width: 34rem; margin: 0 auto; display: flex; align-items: center; gap: 18px; height: 58px; }
  .rest-line { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(255, 255, 255, .14); }
  .rest-line i { display: block; height: 100%; background: var(--fg); transform-origin: left; transition: transform .25s linear; }
  .rest-l { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .rest-t { flex: 1; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .restbar button { padding: 18px 8px; margin: 0 -8px; font-family: var(--mono); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .restbar button:active { color: var(--fg); }
  /* The countdown itself: tap it to change how long you rest. */
  .restbar .rest-t { margin: 0; padding: 16px 0; font-family: var(--font); font-size: 24px; letter-spacing: 0; text-transform: none; color: var(--fg); }
  .restbar .rest-t:active { opacity: .6; }
  .restbar.done .rest-t { animation: nope .6s ease 2; }
  body.resting main { padding-bottom: calc(190px + env(safe-area-inset-bottom)); }
  body.kb .restbar, body.onboarding .restbar { display: none; }

  /* profile (first launch, and from the header): your name and the language */
  body.onboarding .tabbar { display: none; }
  body.onboarding main { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  .ob { display: flex; flex-direction: column; min-height: calc(100dvh - max(24px, env(safe-area-inset-top)) - max(24px, env(safe-area-inset-bottom))); }
  .ob-top { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
  .ob-close { display: grid; place-items: center; width: 44px; height: 44px; margin-left: -10px; font-size: 22px; }
  .ob-head { margin-top: 14vh; }
  .ob-hello { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 8.5vw, 34px); line-height: 1.15; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .ob-form { display: grid; gap: 20px; margin-top: 22px; }
  .ob-field { display: block; }
  .ob-label { display: block; font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
  .ob-line { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255, 255, 255, .25); transition: border-color .2s; }
  .ob-line:focus-within { border-bottom-color: var(--fg); }
  .ob-input { flex: 1; padding: 13px 0; font-size: 17px; }
  .ob-tick { flex: none; font-size: 14px; color: var(--dim); }
  .ob-nav { display: flex; justify-content: flex-end; margin-top: auto; padding-top: 28px; }
  .ob-next { padding: 18px 0 18px 36px; font-family: var(--mono); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--fg); }
  .ob-next:active { color: var(--dim); }

  /* cardio rows: minutes and km instead of kg x reps */
  .row.cardio { grid-template-columns: 1.6em 3.6em 2.2em 3.4em 1.9em 1fr 2.2em; }
  .row.cardio .kg, .row.cardio .km { text-align: right; padding-right: .3em; }
  /* "30 min · 5.5 km" is wider than its slot on a phone: let it fold rather than run over the units. */
  .row.cardio .prev { white-space: normal; text-align: right; line-height: 1.3; }

  /* one lift's history: every session, newest first */
  .back { display: grid; place-items: center; width: 44px; height: 44px; margin: -6px 0 0 -12px; font-size: 22px; }
  .hist .title { margin-top: 28px; overflow-wrap: anywhere; }
  .sessions { margin-top: 36px; }
  .session { display: grid; grid-template-columns: 5.4em minmax(0, 1fr) 2em; gap: 12px; align-items: baseline; padding: 13px 0; font-size: 15px; }
  .session-d { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
  .session-s { overflow-wrap: anywhere; }
  .session .pr { grid-column: 3; padding-left: 0; justify-self: end; }
  .empty-note { margin-top: 36px; font-size: 14px; color: var(--faint); }

  @media (hover: hover) {
    .tab:hover, footer button:hover, .act:hover, .presets button:hover, .lang button:hover, .months a:hover, a.cal-day:hover, .ex-foot a:hover, .ex-foot button:hover, a.session:hover .session-d { color: var(--fg); }
  }
  footer button:active, .act:active, .presets button:active, .months a:active, a.cal-day:active, .ex-foot a:active, .ex-foot button:active, a.session:active .session-d { color: var(--fg); }

  /* motion */
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* Quick, so a tap on a tab shows the new screen right away. */
  .view > * { animation: rise .35s var(--ease) both; }
  .view > :nth-child(2) { animation-delay: .02s; }
  .view > :nth-child(3) { animation-delay: .04s; }
  .view > :nth-child(4) { animation-delay: .06s; }
  .view > :nth-child(n+5) { animation-delay: .08s; }
  .fresh { animation: rise .4s var(--ease) both; }
  @keyframes nope { 50% { opacity: .25; } }
  .nope { animation: nope .5s ease 2; }

<script>
(() => {
  'use strict';

  const KEY = 'track.v1';

  // A fresh start for every phone: the first time this version opens, everything Track. saved
  // (workouts, plan, name, rest timer) is cleared, once. A new RESET date wipes everyone again.
  const RESET = '2026-10-18';
  try {
    if (localStorage.getItem('track.reset') !== RESET) {
      for (const k of Object.keys(localStorage)) if (k.startsWith('track.')) localStorage.removeItem(k);
      localStorage.setItem('track.reset', RESET);
    }
  } catch (_) { /* no storage: nothing to clear */ }

  const app = document.getElementById('app');
  const namesList = document.getElementById('names');

  /* ---------- DOM helper: strings are always added as text, never as HTML ---------- */

  function el(tag, attrs, ...kids) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids) if (kid != null && kid !== false) node.append(kid);
    return node;
  }

  /* ---------- dates (local time, keyed YYYY-MM-DD) ---------- */

  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dateOf = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => keyOf(new Date());
  const isDayKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k) && keyOf(dateOf(k)) === k;

  /* ---------- language: Lithuanian or English (switch on the Plan screen) ---------- */

  // Lithuanian plural: 1 treniruotė, 2 treniruotės, 10 treniruočių, 21 treniruotė…
  const ltPlural = (n, one, few, many) => {
    const a = n % 10;
    const b = n % 100;
    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 9 && !(b >= 12 && b <= 19)) return few;
    return many;
  };

  const TEXT = {
    en: {
      rest: 'Rest',
      workout: 'Workout',
      cardio: 'Cardio',
      addExercise: 'Add exercise',

      removeSet: i => `Remove set ${i}`,
      lastTime: 'last time ',
      pr: 'Personal record',
      history: 'History',
      back: 'Back',
      best: 'best',
      sessions: n => `${n} session${n === 1 ? '' : 's'}`,
      nothingYet: 'Nothing logged yet.',
      minutes: 'Minutes',
      km: 'Km',
      thisWeek: (n, planned) => (planned ? `This week ${n}/${planned}` : `This week: ${n} workout${n === 1 ? '' : 's'}`),
      setCount: n => `${n} set${n === 1 ? '' : 's'}`,
      duration: (h, m) => (h ? `${h} h ${m} min` : `${m} min`),
      restLength: s => `Rest length ${s}, tap to change`,
      cantSave: 'Can’t save on this device. Private browsing?',
      days: 'Days',
      month: 'Month',
      prevMonth: 'Previous month',
      nextMonth: 'Next month',
      weekInitials: ['M', 'T', 'W', 'T', 'F', 'S', 'S'],
      workouts: n => `${n} workout${n === 1 ? '' : 's'}`,
      nothingLogged: 'nothing logged',
      exportLabel: 'Export',
      importLabel: 'Import',
      lastBackup: d => `Last backup ${d} days ago.`,
      noBackup: 'Not backed up yet.',
      notABackup: 'That file isn’t a Track. backup.',
      replaceAll: n => `Replace everything here with the ${n} workout${n === 1 ? '' : 's'} in this file?`,
      replacePlan: name => `Replace your plan with “${name}”?`,
      plan: 'Plan',
      presets: 'Presets',
      language: 'Language',
      nothingPlanned: 'Nothing planned.',
      planPlaceholder: 'Monday Push\n- Bench press 4x8',
      dayShort: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
      hint: [
        ['Monday Push', 'a workout for Mondays'],
        ['- Squat 5x8', 'sets × reps'],
        ['- Bench 3-4x6-8', 'or ranges'],
        ['- Running 30min 5km', 'cardio'],
        ['- Row / Pulldown 3x12', 'take turns'],
      ],
      tabs: { main: 'Main', history: 'History', today: 'Today', plan: 'Plan' },
      sets: 'Sets',
      time: 'Time',
      startWorkout: 'Start',
      finishWorkout: 'Finish',
      restLabel: 'Rest',
      skipRest: 'Skip',
      goNow: 'Go',
      next: (name, day) => `Next: ${name}, ${day}`,
      removeExerciseText: 'Remove exercise',
      yourName: 'Your name',
      levels: ['Gym beginner', 'Regular', 'Dedicated', 'Veteran'],
      ob: {
        welcome: 'Welcome,',
        name: 'Name',
        start: 'Start',
        save: 'Save',
      },
    },
    lt: {
      rest: 'Poilsis',
      workout: 'Treniruotė',
      cardio: 'Kardio',
      addExercise: 'Pridėti pratimą',
      remove: 'šalinti',
      exercises: 'Pratimai',
      weight: name => `${name}: svoris, kg`,
      reps: name => `${name}: pakartojimai`,
      addSet: name => `Pridėti seriją: ${name}`,
      saveSet: i => `Išsaugoti ${i} seriją`,
      removeExercise: name => `Šalinti: ${name}`,
      removeAsk: (name, n) => `Šalinti „${name}“ ir ${n} ${ltPlural(n, 'seriją', 'serijas', 'serijų')}?`,
      removeSet: i => `Šalinti ${i} seriją`,
      lastTime: 'praeitą kartą ',
      pr: 'Asmeninis rekordas',
      history: 'Istorija',
      back: 'Atgal',
      best: 'geriausia',
      sessions: n => `${n} ${ltPlural(n, 'treniruotė', 'treniruotės', 'treniruočių')}`,
      nothingYet: 'Dar nieko neužrašyta.',
      minutes: 'Minutės',
      km: 'Km',
      thisWeek: (n, planned) => (planned ? `Šią savaitę ${n}/${planned}` : `Šią savaitę: ${n} ${ltPlural(n, 'treniruotė', 'treniruotės', 'treniruočių')}`),
      setCount: n => `${n} ${ltPlural(n, 'serija', 'serijos', 'serijų')}`,
      duration: (h, m) => (h ? `${h} val. ${m} min` : `${m} min`),
      restLength: s => `Poilsio trukmė ${s}, bakstelk, kad pakeistum`,
      cantSave: 'Šiame įrenginyje nepavyksta išsaugoti. Gal įjungtas privatus naršymas?',
      days: 'Dienos',
      month: 'Mėnuo',
      prevMonth: 'Ankstesnis mėnuo',
      nextMonth: 'Kitas mėnuo',
      weekInitials: ['P', 'A', 'T', 'K', 'P', 'Š', 'S'],
      workouts: n => `${n} ${ltPlural(n, 'treniruotė', 'treniruotės', 'treniruočių')}`,
      nothingLogged: 'nieko neužrašyta',
      exportLabel: 'Eksportuoti',
      importLabel: 'Importuoti',
      lastBackup: d => `Paskutinė kopija prieš ${d} d.`,
      noBackup: 'Atsarginės kopijos dar nėra.',
      notABackup: 'Šis failas nėra Track. atsarginė kopija.',
      replaceAll: n => `Pakeisti visus duomenis šiame telefone? Faile: ${n} ${ltPlural(n, 'treniruotė', 'treniruotės', 'treniruočių')}.`,
      replacePlan: name => `Pakeisti planą į „${name}“?`,
      plan: 'Planas',
      presets: 'Paruošti planai',
      language: 'Kalba',
      nothingPlanned: 'Nieko nesuplanuota.',
      planPlaceholder: 'Pirmadienis A\n- Pritūpimai 5x8',
      dayShort: ['Sk', 'Pr', 'An', 'Tr', 'Kt', 'Pn', 'Št'],
      hint: [
        ['Pirmadienis A', 'treniruotė pirmadieniais'],
        ['- Pritūpimai 5x8', 'serijos × kartai'],
        ['- Spaudimas 3-4x6-8', 'arba intervalai'],
        ['- Bėgimas 30min 5km', 'kardio'],
        ['- Trauka / Lenkimas 3x12', 'keičiasi kas kartą'],
      ],
      tabs: { main: 'Pagrindinis meniu', history: 'Istorija', today: 'Šiandien', plan: 'Planas' },
      sets: 'Serijos',
      time: 'Laikas',
      startWorkout: 'Pradėti',
      finishWorkout: 'Baigti',
      restLabel: 'Poilsis',
      skipRest: 'Praleisti',
      goNow: 'Pirmyn',
      next: (name, day) => `Kita: ${name}, ${day}`,
      removeExerciseText: 'Šalinti pratimą',
      yourName: 'Tavo vardas',
      levels: ['Pradedantysis', 'Reguliarus', 'Atsidavęs', 'Veteranas'],
      ob: {
        welcome: 'Sveiki,',
        name: 'Vardas',
        start: 'Pradėti',
        save: 'Išsaugoti',
      },
    },
  };

  // The chosen language, else the phone's (Lithuanian phones start in Lithuanian).
  const deviceLang = () => (/^lt\b/i.test(navigator.language || '') ? 'lt' : 'en');
  const lang = () => (db.lang === 'lt' || db.lang === 'en' ? db.lang : deviceLang());
  const T = () => TEXT[lang()];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  const fmt = (k, opts) => dateOf(k).toLocaleDateString(lang() === 'lt' ? 'lt-LT' : 'en-GB', opts);
  // "Monday 19 October" / "Pirmadienis, spalio 19 d." (with the year when it isn't this year)
  function fullDate(k) {
    const otherYear = dateOf(k).getFullYear() !== new Date().getFullYear();
    if (lang() !== 'lt') {
      return fmt(k, Object.assign({ weekday: 'long', day: 'numeric', month: 'long' }, otherYear && { year: 'numeric' }));
    }
    const year = otherYear ? `${dateOf(k).getFullYear()} m. ` : '';
    return `${cap(fmt(k, { weekday: 'long' }))}, ${year}${fmt(k, { month: 'long', day: 'numeric' })}`;
  }

  /* ---------- values ---------- */

  const clean = s => String(s).replace(/\s+/g, ' ').trim().slice(0, 60);
  const norm = s => clean(s).toLowerCase();
  const round2 = n => Math.round(n * 100) / 100;
  const fmtKg = n => String(round2(n));
  const setText = s => (s.min !== undefined ? fmtCardio(s) : `${s.kg ? fmtKg(s.kg) : 'bw'} × ${s.reps}`);

  function parseKg(s) {
    const t = s.trim().replace(',', '.');
    if (!/^(\d+(\.\d*)?|\.\d+)$/.test(t)) return null;
    const v = Number(t);
    return v <= 1000 ? round2(v) : null;
  }

  function parseReps(s) {
    const t = s.trim();
    if (!/^\d+$/.test(t)) return null;
    const v = Number(t);
    return v >= 1 && v <= 999 ? v : null;
  }

  /* ---------- storage ---------- */

  // Ready-made plans, in the app's language: switching LT/EN swaps an unedited preset to the
  // other text. Both texts are kept line for line, so an exercise logged under either name is
  // recognised as the same one (see names()). Add new ones here.
  const PRESETS = [
    {
      name: { en: 'Push Pull Legs', lt: 'Stūmimas Traukimas Kojos' },
      plan: {
        en: `Monday Push
- Shoulder press / Incline press 4x12
- Incline press / Shoulder press 3x12
- Lateral raise 4x15
- Facepull 3x15
- Tricep extension / Overhead tricep extension 4x12

Wednesday Pull
- Lat pulldown 4x12
- Row 3x12
- Upright row 3x12
- Facepull 3x15
- Hammer curl / DB curl 4x12

Friday Legs
- Squat 5x8
- RDL 3x8
- Bulgarian split 3x12
- Leg extension 3x12
- Calf raise 4x20`,
        lt: `Pirmadienis Stūmimas
- Pečių spaudimas / Spaudimas ant pasvirusio suolo 4x12
- Spaudimas ant pasvirusio suolo / Pečių spaudimas 3x12
- Šoniniai kėlimai 4x15
- Lyno trauka prie veido 3x15
- Tricepso tiesimas / Tricepso tiesimas virš galvos 4x12

Trečiadienis Traukimas
- Viršutinio bloko trauka 4x12
- Horizontali trauka 3x12
- Trauka prie smakro 3x12
- Lyno trauka prie veido 3x15
- Plaktuko lenkimas / Hantelių lenkimas 4x12

Penktadienis Kojos
- Pritūpimai 5x8
- Rumuniška mirties trauka 3x8
- Bulgariški įtūpstai 3x12
- Kojų tiesimas 3x12
- Blauzdų kėlimas 4x20`,
      },
    },
    {
      // From "3 Dienų Treniruočių Programa".
      name: { en: '3 Day Program', lt: '3 dienų programa' },
      plan: {
        en: `Monday A
- Barbell squat 3x5-6
- Barbell bench press 3-4x6-8
- Seated cable row 3x8-10
- Machine leg curl 3x10-12
- Standing barbell curl 3x10-12
- Plank 3x45-60

Wednesday B
- Trap bar deadlift 3x5
- Smith machine shoulder press 3x6-8
- Lat pulldown to chest 3-4x8-10
- Machine leg extension 3x10-12
- Dumbbell lateral raise 3x12-15
- Cable triceps pushdown 3x10-12

Friday C
- 30° incline dumbbell press 3-4x8-10
- Leg press 3x10-12
- One-arm dumbbell row 3x8-10
- 45° back extension 3x10-12
- Reverse pec deck 3x12-15
- Hanging leg raise 3x10-12`,
        lt: `Pirmadienis A
- Pritūpimai su štanga 3x5-6
- Štangos spaudimas gulint 3-4x6-8
- Horizontalaus bloko trauka sėdint 3x8-10
- Kojų lenkimas staklėse 3x10-12
- Bicepso lenkimas su štanga stovint 3x10-12
- Lenta (Plank) 3x45-60

Trečiadienis B
- Trap Bar mirties trauka 3x5
- Pečių spaudimas Smito mašinoje 3x6-8
- Viršutinio bloko trauka prie krūtinės 3-4x8-10
- Kojų tiesimas treniruoklyje 3x10-12
- Hantelių kėlimas į šalis 3x12-15
- Tricepso tiesimas prie viršutinio bloko 3x10-12

Penktadienis C
- Hantelių spaudimas 30° kampu 3-4x8-10
- Kojų spaudimas treniruoklyje 3x10-12
- Vienos rankos hantelio trauka atsirėmus 3x8-10
- Nugaros ir sėdmenų tiesimas 45° suoliuke 3x10-12
- Galinės deltinių dalies atvedimas (Reverse Pec Deck) 3x12-15
- Kojų kėlimas kybant 3x10-12`,
      },
    },
  ];
  const presetPlan = p => p.plan[lang()];
  const presetName = p => p.name[lang()];
  // A new phone starts with the first preset, in its language. (No lang() here: this also runs
  // while the saved data is still being read.)
  const defaultPlan = l => PRESETS[0].plan[l === 'lt' || l === 'en' ? l : deviceLang()];
  const PLAN_MAX = 10000;

  // Rest between sets, in seconds (tap the countdown to change it). Between exercises is twice that, at most 5 min.
  const REST_STEPS = [60, 90, 120, 180];
  const empty = () => ({ version: 1, plan: defaultPlan(), filledFrom: null, lastBackup: null, lang: null, name: '', rest: 90, onboarded: false, days: {}, timers: {}, titles: {} });
  let storageOk = true;

  // A target is sets x reps, each optionally a range ("3-4 x 6-8" -> setsTo 4, repsTo 8).
  const validTarget = t => t && typeof t === 'object' &&
    Number.isInteger(t.sets) && t.sets >= 1 && t.sets <= 20 &&
    Number.isInteger(t.reps) && t.reps >= 1 && t.reps <= 999 &&
    (t.setsTo === undefined || (Number.isInteger(t.setsTo) && t.setsTo > t.sets && t.setsTo <= 20)) &&
    (t.repsTo === undefined || (Number.isInteger(t.repsTo) && t.repsTo > t.reps && t.repsTo <= 999));
  const copyTarget = t => Object.assign({ sets: t.sets, reps: t.reps },
    t.setsTo && { setsTo: t.setsTo }, t.repsTo && { repsTo: t.repsTo });
  const fmtTarget = t => `${t.sets}${t.setsTo ? `–${t.setsTo}` : ''} × ${t.reps}${t.repsTo ? `–${t.repsTo}` : ''}`;

  const inRange = (v, lo, hi) => typeof v === 'number' && Number.isFinite(v) && v >= lo && v <= hi;

  // Cardio is logged as minutes and km instead of kg x reps.
  // Rowing, walking lunges and farmer's walks stay strength work.
  const isCardio = name => /\b(run|running|jog|jogging|sprints?|treadmill|bike|biking|cycling|spin|rower|rowing machine|erg|walk|walking|hike|hiking|swim|swimming|elliptical|stair ?master|jump rope|skipping|cardio|hiit)\b|bėg|dvirat|irklavimo treniruokl|ėjimas|plauk|takel|elipt|šokdyn|kardio/i.test(name)
    && !/lunge|įtūpst|farmer|ūkinink|carry|neši/i.test(name);
  // Logged sets decide; the name only decides for an empty exercise.
  const cardioEx = ex => (ex.sets.length ? ex.sets[0].min !== undefined : isCardio(ex.name));
  const fmtCardio = s => `${fmtKg(s.min)} min${s.km ? ` · ${fmtKg(s.km)} km` : ''}`;
  const validAim = a => a && typeof a === 'object' && (inRange(a.min, 0.5, 1000) || inRange(a.km, 0.1, 1000));
  const copyAim = a => Object.assign({}, inRange(a.min, 0.5, 1000) && { min: round2(a.min) }, inRange(a.km, 0.1, 1000) && { km: round2(a.km) });

  // Accepts anything (localStorage or an imported file) and returns clean data, or null.
  function sanitize(input) {
    if (!input || typeof input !== 'object' || !input.days ||
        typeof input.days !== 'object' || Array.isArray(input.days)) return null;
    const days = {};
    for (const k of Object.keys(input.days)) {
      const list = input.days[k];
      if (!isDayKey(k) || !Array.isArray(list)) continue;
      const exs = [];
      for (const e of list) {
        if (!e || typeof e !== 'object' || typeof e.name !== 'string') continue;
        const name = clean(e.name);
        if (!name) continue;
        const sets = [];
        if (Array.isArray(e.sets)) {
          for (const s of e.sets) {
            if (!s || typeof s !== 'object') continue;
            if (s.min !== undefined) {   // a cardio entry
              const min = Number(s.min);
              const km = Number(s.km);
              if (!inRange(min, 0.1, 1000)) continue;
              sets.push({ min: round2(min), km: inRange(km, 0, 1000) ? round2(km) : 0 });
              continue;
            }
            const reps = Number(s.reps);
            const kg = Number(s.kg);
            if (!Number.isInteger(reps) || reps < 1 || reps > 999) continue;
            sets.push({ kg: Number.isFinite(kg) && kg >= 0 && kg <= 1000 ? round2(kg) : 0, reps });
          }
        }
        const ex = validTarget(e.target) ? { name, sets, target: copyTarget(e.target) } : { name, sets };
        if (validAim(e.aim)) ex.aim = copyAim(e.aim);
        exs.push(ex);
      }
      days[k] = exs; // an empty day is kept: it means "started, then cleared" (don't reload the plan)
    }
    return {
      version: 1,
      plan: typeof input.plan === 'string' ? input.plan.slice(0, PLAN_MAX) : defaultPlan(input.lang),
      // Which day the plan last filled, and the plan text it used (see followPlan).
      filledFrom: input.filledFrom && typeof input.filledFrom === 'object' &&
        isDayKey(input.filledFrom.key) && typeof input.filledFrom.plan === 'string'
        ? { key: input.filledFrom.key, plan: input.filledFrom.plan.slice(0, PLAN_MAX) }
        : null,
      // The day of the last export or import (for the backup reminder in History).
      lastBackup: typeof input.lastBackup === 'string' && isDayKey(input.lastBackup) ? input.lastBackup : null,
      lang: input.lang === 'lt' || input.lang === 'en' ? input.lang : null,
      name: typeof input.name === 'string' ? clean(input.name).slice(0, 40) : '',
      rest: REST_STEPS.includes(input.rest) ? input.rest : 90,
      onboarded: input.onboarded === true,
      days,
      timers: cleanTimers(input.timers),
      titles: cleanTitles(input.titles),
    };
  }

  // The workout a day was, fixed when the plan filled it or when it became history:
  // { 'YYYY-MM-DD': 'Push' }, '' for a workout that matched no plan. Changing the plan later
  // doesn't rename what you already did.
  function cleanTitles(t) {
    const out = {};
    if (!t || typeof t !== 'object') return out;
    for (const k of Object.keys(t)) {
      if (isDayKey(k) && typeof t[k] === 'string') out[k] = clean(t[k]).slice(0, 60);
    }
    return out;
  }

  // Workout clocks: { 'YYYY-MM-DD': { start, end } } in ms; end is null while it runs.
  function cleanTimers(t) {
    const out = {};
    if (!t || typeof t !== 'object') return out;
    for (const k of Object.keys(t)) {
      const v = t[k];
      if (!isDayKey(k) || !v || typeof v !== 'object' || !Number.isFinite(v.start) || v.start <= 0) continue;
      const end = Number.isFinite(v.end) && v.end >= v.start ? v.end : null;
      out[k] = { start: Math.round(v.start), end: end == null ? null : Math.round(end) };
    }
    return out;
  }

  function load() {
    let raw;
    try { raw = localStorage.getItem(KEY); } catch (_) { storageOk = false; return empty(); }
    if (raw == null) return empty();
    try {
      const data = sanitize(JSON.parse(raw));
      if (data) return data;
    } catch (_) { /* fall through */ }
    // Never overwrite something we couldn't read: park it under another key first.
    try { localStorage.setItem(`${KEY}.unreadable.${Date.now()}`, raw); } catch (_) { /* ignore */ }
    return empty();
  }

  let db = load();
  let askedPersist = false;

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(db));
      storageOk = true;
    } catch (_) {
      storageOk = false;
    }
    // Show or hide the warning in place, without re-rendering (keeps focus and scroll).
    const warn = app.querySelector('.warn');
    if (warn) warn.hidden = storageOk;
    if (!askedPersist && navigator.storage && navigator.storage.persist) {
      askedPersist = true;
      navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {});
    }
  }

  /* ---------- queries ---------- */

  const sortedKeys = () => Object.keys(db.days).sort();

  // Exercise names from the presets, linked to their translation by position:
  // norm(name) -> { en, lt }. Built on first use.
  let nameMap = null;
  function names() {
    if (nameMap) return nameMap;
    nameMap = new Map();
    const link = (en, lt) => {
      const pair = { en, lt };
      nameMap.set(norm(en), pair);
      nameMap.set(norm(lt), pair);
      nameMap.set(`~${bare(norm(lt))}`, pair);   // "Spaudimas gulint" finds "Štangos spaudimas gulint"
    };
    for (const p of PRESETS) {
      const en = parsePlan(p.plan.en);
      const lt = parsePlan(p.plan.lt);
      en.forEach((r, i) => {
        if (!lt[i]) return;
        r.items.forEach((it, j) => it.names.forEach((n, k) => {
          const other = lt[i].items[j] && lt[i].items[j].names[k];
          if (other) link(n, other);
        }));
      });
    }
    return nameMap;
  }
  // The same exercise whatever language or spelling it was written in: "Squat" = "Pritūpimai",
  // and a barbell is the default ("Bench press" = "Barbell bench press" = "Štangos spaudimas gulint").
  // So switching plans keeps your last sets for every lift the plans share.
  const bare = n => n.replace(/\b(barbell|flat)\b|\bsu štanga\b|(^|\s)štangos(?=\s|$)/g, ' ').replace(/\s+/g, ' ').trim();
  const sameCache = new Map();   // the presets never change, so neither does the answer for a name
  const same = name => {
    let key = sameCache.get(name);
    if (key !== undefined) return key;
    const n = norm(name);
    const pair = names().get(n) || names().get(`~${bare(n)}`);
    key = bare(pair ? norm(pair.en) : n) || n;
    sameCache.set(name, key);
    return key;
  };

  // Most recent earlier day that has sets for this exercise.
  function previous(key, name) {
    const n = same(name);
    const keys = sortedKeys();
    for (let i = keys.length - 1; i >= 0; i--) {
      if (keys[i] >= key) continue;
      const ex = db.days[keys[i]].find(e => same(e.name) === n && e.sets.length);
      if (ex) return { key: keys[i], sets: ex.sets };
    }
    return null;
  }

  // What tapping "+" with empty fields would log: today's last set, else last session's
  // first set (with the planned reps, if the exercise came from the plan).
  function suggestion(key, ex) {
    if (ex.sets.length) return ex.sets[ex.sets.length - 1];
    const cardio = cardioEx(ex);
    const found = previous(key, ex.name);
    const prev = found && (found.sets[0].min !== undefined) === cardio ? found : null;   // same kind only
    if (cardio) return prev ? prev.sets[0] : ex.aim ? { min: ex.aim.min || 0, km: ex.aim.km || 0 } : null;
    if (ex.target) {
      if (!prev) return { kg: 0, reps: ex.target.reps };
      const up = bumpFrom(prev.sets, ex.target);
      return { kg: up ? round2(up + BUMP) : prev.sets[0].kg, reps: ex.target.reps };
    }
    return prev ? prev.sets[0] : null;
  }

  // Every planned set reached the top of the rep range at your working (heaviest) weight: time
  // to go up from it. Returns that weight, or 0. Lighter warm-up sets don't count either way.
  const BUMP = 2.5;
  function bumpFrom(sets, target) {
    const kg = Math.max(...sets.map(s => s.kg || 0));
    const top = target.repsTo || target.reps;
    return kg && sets.filter(s => s.kg === kg && s.reps >= top).length >= target.sets ? kg : 0;
  }

  // Records: a set's estimated one-rep max (Epley), so heavier and more reps both count.
  // Bodyweight sets and cardio don't take part.
  const e1rm = s => (s.min === undefined && s.kg > 0 ? s.kg * (1 + s.reps / 30) : 0);

  function bestBefore(key, name) {
    const n = same(name);
    let best = 0;
    for (const k of Object.keys(db.days)) {
      if (k >= key) continue;
      for (const e of db.days[k]) if (same(e.name) === n) for (const s of e.sets) best = Math.max(best, e1rm(s));
    }
    return best;
  }

  // The sets on this day that beat everything before them. The first time a lift is logged
  // nothing is a record yet.
  function records(key, ex) {
    const out = new Set();
    let best = bestBefore(key, ex.name);
    if (!best) return out;
    for (const s of ex.sets) {
      const v = e1rm(s);
      if (v > best + 1e-9) { out.add(s); best = v; }
    }
    return out;
  }

  // Days with at least one logged set. An exercise added but never done isn't a workout.
  const workoutKeys = days => Object.keys(days).filter(k => days[k].some(e => e.sets.length)).sort();

  function allNames() {
    const seen = new Set();
    const out = [];
    for (const k of sortedKeys().reverse()) {
      for (const e of db.days[k]) {
        if (!e.sets.length) continue;
        const n = same(e.name);
        if (!seen.has(n)) { seen.add(n); out.push(e.name); }
      }
    }
    return out;
  }

  function refreshNames() {
    namesList.textContent = '';
    for (const n of allNames()) namesList.append(el('option', { value: n }));
  }

  // Reuse the spelling from earlier workouts so "bench press" matches "Bench press".
  const canonical = name => (names().has(norm(name)) ? name : allNames().find(n => norm(n) === norm(name)) || name);

  /* ---------- plan ---------- */

  const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const WEEKDAYS_LT = ['sekmadienis', 'pirmadienis', 'antradienis', 'treciadienis', 'ketvirtadienis', 'penktadienis', 'sestadienis'];
  const plain = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z]/g, '');

  // The weekday a heading starts with, else -1. English: any 3+ letter prefix ("Mon", "Monday").
  // Lithuanian: the word must reach "…dien…" ("Pirmadienis"), so "Pirma diena" isn't Monday.
  function weekdayOf(word) {
    const w = plain(word);
    if (w.length < 3) return -1;
    const en = WEEKDAYS.findIndex(d => d.toLowerCase().startsWith(w));
    if (en > -1) return en;
    return w.includes('dien') ? WEEKDAYS_LT.findIndex(d => d.startsWith(w)) : -1;
  }

  // The target at the end of an exercise line: "4x12", "3-4x6-8", "(5x8)". Returns the target
  // and where the name ends, or null (then the whole text stays the name, so nothing vanishes).
  // A sets range is written tight and rising ("3-4x8"); otherwise its first number belongs to the
  // name: "Superset 1 - 3x10" → "Superset 1", "Incline 15-3x10" → "Incline 15", both 3 × 10.
  // A reps range that doesn't rise is ignored: "3x12-10" → 3 × 12.
  function readTarget(body) {
    const m = body.match(/(?:^|[\s(])(\d{1,2})(?:[-–—](\d{1,2}))?\s*[x×X*]\s*(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?\s*\)?\.?\s*$/);
    if (!m) return null;
    const lead = m[0].length - m[0].replace(/^[\s(]/, '').length; // the space or "(" before the numbers
    let cut = m.index;
    const t = { sets: Number(m[1]), reps: Number(m[3]) };
    if (m[2] && Number(m[2]) > t.sets) t.setsTo = Number(m[2]);
    else if (m[2]) {
      t.sets = Number(m[2]);
      cut = m.index + lead + m[1].length + 1; // keep "Incline 15-" as the name; the dash is trimmed later
    }
    if (m[4] && Number(m[4]) > t.reps) t.repsTo = Number(m[4]);
    return validTarget(t) ? { target: t, cut } : null;
  }

  // "Monday Push" starts a routine (the weekday is optional), "- A / B 4x12" adds an exercise.
  function parsePlan(text) {
    const routines = [];
    let cur = null;
    for (const raw of String(text || '').split(/\r?\n/)) {
      const line = raw.trim();
      if (!line) continue;
      const item = line.match(/^[-–—•*]\s*(.*)$/);
      if (item) {
        if (!cur) continue;
        let body = item[1];
        const read = readTarget(body);
        const target = read && read.target;
        if (read) body = body.slice(0, read.cut);
        let aim = null;
        const c = !read && body.match(/(?:^|[\s(])(\d{1,3}(?:[.,]\d+)?)\s*(min|km)\b(?:\s*[·,/]?\s*(\d{1,3}(?:[.,]\d+)?)\s*(min|km)\b)?\s*\)?\.?\s*$/i);
        if (c) {
          aim = {};
          aim[c[2].toLowerCase()] = Number(c[1].replace(',', '.'));
          if (c[3]) aim[c[4].toLowerCase()] = Number(c[3].replace(',', '.'));
          if (validAim(aim) && isCardio(body.slice(0, c.index))) body = body.slice(0, c.index);
          else aim = null;
        }
        // "Squat: 5x8", "Squat - 5x8" and "Squat (5x8)" all mean "Squat".
        const names = body.split('/').map(s => clean(s.replace(/[\s:,·•–—(-]+$/, ''))).filter(Boolean);
        if (names.length) cur.items.push({ names, target, aim });
        continue;
      }
      const [first, ...rest] = line.split(/\s+/);
      const day = weekdayOf(first);
      const name = day > -1 ? clean(rest.join(' ').replace(/^[:·•–—-]+\s*/, '')) || WEEKDAYS[day] : clean(line);
      cur = { name, day: day > -1 ? day : null, items: [] };
      routines.push(cur);
    }
    return routines.filter(r => r.items.length);
  }

  // Alternates ("A / B") take turns: count the earlier sessions of this routine; every slot
  // moves on one step per session and cycles through however many alternates it has.
  function rotation(key, routine) {
    if (!routine.items.some(it => it.names.length > 1)) return 0;
    let sessions = 0;
    for (const k of sortedKeys()) {
      if (k >= key) break;
      if (db.days[k].some(e => e.sets.length) && dayTitle(k) === titleIn(routine.name)) sessions++;
    }
    return sessions;
  }

  // The big title on a day: the name of the planned workout it matches best ("Push"),
  // "Cardio" or "Workout" for anything else, "Rest" when nothing is there.
  function dayTitle(key) {
    const exs = db.days[key] || [];
    if (!exs.length) return T().rest;
    // Finished days keep the name they had; today's follows what's in it.
    if (key < todayKey() && Object.prototype.hasOwnProperty.call(db.titles, key)) return db.titles[key] ? titleIn(db.titles[key]) : offPlanTitle(exs);
    return planTitle(key, exs.map(e => same(e.name))) || offPlanTitle(exs);
  }

  const cardioDay = exs => exs.length > 0 && exs.every(cardioEx);
  const offPlanTitle = exs => (cardioDay(exs) ? T().cardio : T().workout);

  // A preset's workout name in the app's language ("Push" <-> "Stūmimas"); anything else as written.
  let titleMap = null;
  function titleIn(name) {
    if (!titleMap) {
      titleMap = new Map();
      for (const p of PRESETS) {
        const en = parsePlan(p.plan.en);
        const lt = parsePlan(p.plan.lt);
        en.forEach((r, i) => {
          if (!lt[i]) return;
          const pair = { en: r.name, lt: lt[i].name };
          titleMap.set(r.name, pair);
          titleMap.set(lt[i].name, pair);
        });
      }
    }
    const pair = titleMap.get(name);
    return pair ? pair[lang()] : name;
  }

  // The planned workout these exercises match best, by the current plan, or null.
  function planTitle(key, names) {
    const dow = dateOf(key).getDay();
    let best = null;
    let bestScore = 0;
    for (const r of parsePlan(db.plan)) {
      const pool = new Set(r.items.flatMap(it => it.names.map(same)));
      const score = names.filter(n => pool.has(n)).length;
      if (score > bestScore || (score && score === bestScore && r.day === dow && best.day !== dow)) {
        best = r;
        bestScore = score;
      }
    }
    return best && bestScore * 2 >= names.length ? best.name : null;
  }

  // Today's numbers: sets done of planned, exercises finished.
  function dayStats(key) {
    const stats = { sets: 0, planned: 0, done: 0, total: 0 };
    for (const e of db.days[key] || []) {
      stats.total++;
      stats.sets += e.sets.length;
      stats.planned += e.target ? Math.max(e.target.sets, e.sets.length)
        : cardioEx(e) ? Math.max(1, e.sets.length) : e.sets.length;
      if (e.sets.length && e.sets.length >= (e.target ? e.target.sets : 1)) stats.done++;
    }
    return stats;
  }

  // 1:05, 12:40, 1:02:09
  function fmtClock(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const sec = pad(t % 60);
    return h ? `${h}:${pad(m)}:${sec}` : `${m}:${sec}`;
  }
  const elapsed = key => {
    const t = db.timers[key];
    return t ? (t.end || Date.now()) - t.start : 0;
  };
  const running = key => !!db.timers[key] && !db.timers[key].end;

  // Forgot to tap Finish? A clock from an earlier day stops by itself: at most 3 h, never past midnight.
  function settleTimers() {
    const today = todayKey();
    let changed = false;
    for (const [k, t] of Object.entries(db.timers)) {
      if (t.end || k >= today) continue;
      const d = dateOf(k);
      const midnight = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
      t.end = Math.max(t.start, Math.min(t.start + 3 * 3600e3, midnight));
      changed = true;
    }
    if (changed) save();
  }

  function startWorkout(key) {
    if (db.timers[key]) return;
    db.timers[key] = { start: Date.now(), end: null };
    save();
    refreshCard(key);
    syncWake();
  }

  function finishWorkout(key) {
    const t = db.timers[key];
    if (!t || t.end) return;
    t.end = Date.now();
    save();
    rest.stop();
    refreshCard(key);
    syncWake();
  }

  // The screen stays on while today's workout clock runs, so the rest countdown is there to see.
  let wake = null;
  let waking = false;
  async function syncWake() {
    if (!navigator.wakeLock || waking) return;
    const want = running(todayKey()) && document.visibilityState === 'visible';
    if (want && !wake) {
      waking = true;
      try {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      } catch (_) { wake = null; }
      waking = false;
      if (!running(todayKey()) && wake) syncWake();   // finished while asking
    } else if (!want && wake) {
      const w = wake;
      wake = null;
      w.release().catch(() => {});
    }
  }
  // The phone drops the lock whenever the app is hidden; take it again on the way back.
  document.addEventListener('visibilitychange', syncWake);

  // A quiet line for a rest day: "This week 2/3 · 41 sets · 2 h 40 min" (weeks start on Monday).
  function weekSummary(key) {
    const d = dateOf(key);
    const from = keyOf(new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7));
    const keys = workoutKeys(db.days).filter(k => k >= from && k <= key);
    if (!keys.length) return null;
    const t = T();
    const planned = new Set(parsePlan(db.plan).filter(r => r.day != null).map(r => r.day)).size;
    const sets = keys.reduce((n, k) => n + db.days[k].reduce((m, e) => m + e.sets.filter(s => s.min === undefined).length, 0), 0);
    const ms = keys.reduce((n, k) => n + (db.timers[k] && db.timers[k].end ? db.timers[k].end - db.timers[k].start : 0), 0);
    const mins = Math.round(ms / 60000);
    const parts = [t.thisWeek(keys.length, planned)];
    if (sets) parts.push(t.setCount(sets));
    if (mins) parts.push(t.duration(Math.floor(mins / 60), mins % 60));
    return parts.join(' · ');
  }

  // The next planned workout after today, e.g. "Next: Push, Monday".
  function nextWorkout(key) {
    const routines = parsePlan(db.plan);
    const d = dateOf(key);
    for (let i = 1; i <= 7; i++) {
      const next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i);
      const r = routines.find(x => x.day === next.getDay());
      if (r) return T().next(r.name, fmt(keyOf(next), { weekday: 'long' }));
    }
    return null;
  }

  let refreshCard = () => {};
  let clock = null;

  function dayCard(key, isToday) {
    const title = el('h1', { class: 'title' });
    const stat = () => {
      const v = el('div', { class: 'stat-v' });
      const l = el('div', { class: 'stat-l' });
      return { v, l, node: el('div', null, v, l) };
    };
    // Sets and exercises; minutes and km on a day of only cardio.
    const first = stat();
    const second = stat();
    const time = stat();
    time.l.textContent = T().time;
    time.v.classList.add('live');
    const statsRow = el('div', { class: 'stats' }, first.node, second.node, time.node);
    const go = el('button', {
      type: 'button', class: 'go',
      onclick: () => (running(key) ? finishWorkout(key) : startWorkout(key)),
    });
    const week = el('p', { class: 'next' });
    const next = el('p', { class: 'next' });
    const card = el('section', { class: 'card' },
      el('p', { class: 'label' }, el('b', null, '#'), isToday ? T().tabs.today : T().tabs.history),
      title,
      el('p', { class: 'sub' }, fullDate(key)),
      statsRow, go, week, next);

    // The clock ticks once a second while the workout runs, and stops with the view.
    const tickClock = () => {
      if (!card.isConnected) { clearInterval(clock); clock = null; return; }
      time.v.textContent = fmtClock(elapsed(key));
    };
    const update = () => {
      const st = dayStats(key);
      const exs = db.days[key] || [];
      title.textContent = dayTitle(key);
      const active = st.total > 0;
      statsRow.hidden = !active;
      if (active && cardioDay(exs)) {
        const sum = f => fmtKg(exs.reduce((n, e) => n + e.sets.reduce((m, s) => m + (s[f] || 0), 0), 0));
        first.l.textContent = T().minutes;
        first.v.textContent = sum('min');
        second.l.textContent = T().km;
        second.v.textContent = sum('km');
      } else if (active) {
        first.l.textContent = T().sets;
        first.v.textContent = `${st.sets}/${st.planned}`;
        second.l.textContent = T().exercises;
        second.v.textContent = `${st.done}/${st.total}`;
      }
      if (active) {
        time.v.textContent = fmtClock(elapsed(key));
        time.v.style.color = db.timers[key] ? '' : 'var(--faint)';
      }
      // Start and Finish belong to today; a finished workout just shows its time.
      const t = db.timers[key];
      go.hidden = !active || !isToday || !!(t && t.end);
      go.textContent = t ? `${T().finishWorkout} ■` : `${T().startWorkout} ▸`;
      go.classList.toggle('stop', !!t);
      clearInterval(clock);
      clock = running(key) ? setInterval(tickClock, 1000) : null;
      // A rest day: how the week went, and what's next.
      const sofar = !active && isToday ? weekSummary(key) : null;
      week.hidden = !sofar;
      if (sofar) week.textContent = sofar;
      const upcoming = !active && isToday ? nextWorkout(key) : null;
      next.hidden = !upcoming;
      if (upcoming) next.textContent = upcoming;
    };
    update();
    refreshCard = k => { if (k === key && current.view === 'day' && current.key === key) update(); };
    return card;
  }

  function loadRoutine(key, routine) {
    const turn = rotation(key, routine);
    const day = db.days[key] || (db.days[key] = []);
    for (const it of routine.items) {
      const name = canonical(it.names[turn % it.names.length]);
      if (day.some(e => same(e.name) === same(name))) continue;
      const ex = it.target ? { name, sets: [], target: copyTarget(it.target) } : { name, sets: [] };
      if (it.aim) ex.aim = copyAim(it.aim);
      day.push(ex);
    }
    db.filledFrom = { key, plan: db.plan };
    save();
  }

  // Today was filled from an older version of the plan: rebuild it from the current plan's
  // workout for this weekday. Everything you logged stays (with its sets), and so does anything
  // you added yourself; only the old plan's untouched exercises make way. No workout today in
  // the new plan and nothing done: a rest day. Works however the plan was changed: in the app,
  // before closing it, by switching language, or by an import.
  function followPlan(key) {
    const from = db.filledFrom;
    const day = db.days[key];
    if (!from || from.key !== key || from.plan === db.plan) return;
    if (!day || !day.length) return;   // emptied by hand: stays empty
    const dow = dateOf(key).getDay();
    const old = parsePlan(from.plan).find(r => r.day === dow);
    const fromOld = new Set(old ? old.items.flatMap(it => it.names.map(same)) : []);
    const keep = day.filter(e => e.sets.length || !fromOld.has(same(e.name)));
    const routine = parsePlan(db.plan).find(r => r.day === dow);
    if (routine) {
      db.days[key] = keep;
      loadRoutine(key, routine);   // adds what's missing
      // In the plan's order; anything off the plan you already did goes first.
      const at = new Map();
      routine.items.forEach((it, i) => it.names.forEach(n => at.set(same(n), i)));
      db.days[key].sort((a, b) => (at.has(same(a.name)) ? at.get(same(a.name)) : -1) - (at.has(same(b.name)) ? at.get(same(b.name)) : -1));
      return save();
    }
    if (keep.length) db.days[key] = keep;
    else delete db.days[key];
    db.filledFrom = null;
    save();
  }

  // Finished days keep the name they had, whatever the plan becomes. Days from before titles
  // were saved get theirs from the plan in use now (the one they were done with).
  function freezeTitles() {
    const today = todayKey();
    let changed = false;
    for (const k of workoutKeys(db.days)) {
      if (k >= today || Object.prototype.hasOwnProperty.call(db.titles, k)) continue;
      db.titles[k] = planTitle(k, db.days[k].map(e => same(e.name))) || '';
      changed = true;
    }
    if (changed) save();
  }

  /* ---------- "remove" next to the set you tapped ---------- */

  let revealed = null;

  function closeReveal() {
    if (revealed) { revealed.classList.remove('on'); revealed = null; }
  }

  document.addEventListener('pointerdown', e => {
    if (revealed && !e.target.closest('.remove, [data-reveal]')) closeReveal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReveal(); });

  /* ---------- views ---------- */

  let current = {};
  const blocks = new WeakMap();
  const openEx = new WeakSet(); // exercises whose card is open
  const folds = new WeakMap();  // card element -> open/close it

  // After the fold settles, make sure the opened card and its first rows are on screen.
  function bringIntoView(block) {
    setTimeout(() => {
      if (!block.isConnected) return;
      const r = block.getBoundingClientRect();
      const bottom = window.innerHeight - 150;   // above the tab bar and the rest strip
      if (r.top < 12) window.scrollBy({ top: r.top - 12, behavior: 'smooth' });
      else if (r.top > bottom - 160) window.scrollBy({ top: Math.min(r.top - 80, r.bottom - bottom), behavior: 'smooth' });
    }, 360);
  }

  // The Track. mark (the #mark symbol in the page, same geometry as logo.svg).
  function mark() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 98.71 100');
    svg.setAttribute('class', 'mark');
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS(ns, 'use');
    use.setAttribute('href', '#mark');
    svg.append(use);
    return svg;
  }

  // Level by number of workouts logged.
  function level() {
    const n = workoutKeys(db.days).length;
    return T().levels[n < 5 ? 0 : n < 25 ? 1 : n < 100 ? 2 : 3];
  }

  // The mark, your name and level. Tap it for the profile (name and language).
  // Given a redraw (Today), a quiet LT · EN sits on the right too.
  function header(redraw) {
    return el('div', null,
      el('header', null,
        el('a', { href: '#/profile', class: 'profile' },
          el('span', { class: 'avatar' }, mark()),
          el('span', { class: 'who' },
            el('span', { class: `who-name${db.name ? '' : ' empty'}` }, db.name || T().yourName),
            el('span', { class: 'who-level' }, level()))),
        redraw && langSwitch(redraw)),
      el('p', { class: 'warn', hidden: storageOk }, T().cantSave));
  }

  const tabs = {
    history: document.getElementById('tab-history'),
    today: document.getElementById('tab-today'),
    plan: document.getElementById('tab-plan'),
  };

  // Light up the current tab. A past day belongs to History, whose tab leads back to its month,
  // and so does a lift's history.
  function updateTabs() {
    const pastDay = current.view === 'day' && !current.isToday;
    const active = current.view === 'history' || current.view === 'exercise' || pastDay ? 'history' : current.view === 'plan' ? 'plan' : 'today';
    for (const [name, tab] of Object.entries(tabs)) {
      if (name === active) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    }
    tabs.history.setAttribute('href', pastDay ? `#/history/${current.key.slice(0, 7)}` : '#/history');
  }

  // Already on today: the middle button goes back to the top.
  tabs.today.addEventListener('click', e => {
    if (current.view === 'day' && current.isToday) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  // Hide the tab bar only while the on-screen keyboard is actually up. Focus alone isn't enough:
  // Android's back gesture (and its Done key) closes the keyboard but leaves the field focused,
  // which used to leave the bar invisible, so the first tap on it did nothing.
  const vv = window.visualViewport;
  // fullHeight is the keyboard-free height; it's re-measured after a rotation or resize (the
  // layout height doesn't shrink for the keyboard on iOS or current Android Chrome).
  let fullHeight = window.innerHeight;
  let lastWidth = window.innerWidth;
  function syncKeyboard() {
    const el = document.activeElement;
    const typing = !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
    const visible = vv ? vv.height * vv.scale : window.innerHeight;
    if (!typing || window.innerWidth !== lastWidth) {
      lastWidth = window.innerWidth;
      fullHeight = Math.max(window.innerHeight, visible);
    } else {
      fullHeight = Math.max(fullHeight, visible);
    }
    document.body.classList.toggle('kb', typing && visible < fullHeight - 120);
  }
  if (vv) vv.addEventListener('resize', syncKeyboard);
  window.addEventListener('resize', syncKeyboard);
  document.addEventListener('focusin', syncKeyboard);
  document.addEventListener('focusout', () => setTimeout(syncKeyboard, 0));
  // iOS only shows :active (the tap feedback on the tabs) when a touch listener exists.
  document.addEventListener('touchstart', () => {}, { passive: true });

  function mount(view) {
    revealed = null;
    refitPlan = null;
    applyLang();
    app.textContent = '';
    app.append(view);
    updateTabs();
    document.body.classList.toggle('onboarding', current.view === 'onboarding' || current.view === 'profile');
    window.scrollTo(0, 0);
  }

  function renderDay(key, isToday) {
    current = { view: 'day', key, isToday };
    if (isToday) followPlan(key);
    // A planned weekday fills itself in the first time it's opened; any other day is a rest day.
    if (isToday && !Object.prototype.hasOwnProperty.call(db.days, key)) {
      const planned = parsePlan(db.plan).find(r => r.day === dateOf(key).getDay());
      if (planned) loadRoutine(key, planned);
    }
    const exs = db.days[key] || [];
    const list = el('section', { class: 'list', 'aria-label': T().exercises });
    for (const ex of exs) list.append(exerciseBlock(key, ex));
    // Today: the first exercise that isn't finished is open, ready to log.
    if (isToday && !exs.some(e => openEx.has(e))) {
      const first = exs.find(e => e.sets.length < (e.target ? e.target.sets : 1));
      if (first) blocks.get(first).toggle(true, true);
    }
    mount(el('div', { class: 'view' },
      header(isToday && (() => renderDay(key, isToday))),
      dayCard(key, isToday),
      list,
      addExerciseForm(key, list)));
  }

  function exerciseBlock(key, ex) {
    const label = ex.name;
    const sets = el('div', { class: 'sets' });
    const nextPrev = el('span', { class: 'prev' });
    const num = el('span', { class: 'n', 'aria-hidden': 'true' });
    const kg = el('input', {
      class: 'kg', inputmode: 'decimal', enterkeyhint: 'next',
      autocomplete: 'off', 'aria-label': T().weight(label),
      onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); reps.focus(); } },
    });
    const reps = el('input', {
      class: 'reps', inputmode: 'numeric', pattern: '[0-9]*', enterkeyhint: 'done',
      autocomplete: 'off', 'aria-label': T().reps(label),
      onkeydown: e => { if (e.key === 'Enter') tapped = false; },
    });
    for (const input of [kg, reps]) input.addEventListener('keydown', e => { if (e.key === 'Escape' && editing) stopEdit(); });

    // Tapping "+" logs and closes the keyboard; Enter keeps focus for fast typing.
    let tapped = false;
    const plus = el('button', {
      class: 'act plus', 'aria-label': T().addSet(label),
      onpointerdown: () => { tapped = true; },
      onpointercancel: () => { tapped = false; },
    }, '+');
    // A logged set you tapped to change: its numbers are in the fields and "+" saves it in place.
    let editing = null;

    // Cardio: the two fields are minutes and km.
    const cardio = cardioEx(ex);
    if (cardio) {
      reps.className = 'km';
      reps.setAttribute('inputmode', 'decimal');
      reps.removeAttribute('pattern');
      kg.setAttribute('aria-label', `${label}: min`);
      reps.setAttribute('aria-label', `${label}: km`);
    }
    const entry = cardio
      ? el('form', { class: 'row entry cardio', novalidate: true, onsubmit: addSet },
        num, kg, el('span', { class: 'u' }, 'min'), reps, el('span', { class: 'u' }, 'km'), nextPrev, plus)
      : el('form', { class: 'row entry', novalidate: true, onsubmit: addSet },
        num, kg, el('span', { class: 'u' }, 'kg'), el('span', { class: 'u' }, '×'), reps, nextPrev, plus);

    const meta = el('span', { class: 'ex-meta' });
    const card = el('button', { type: 'button', class: 'ex-card', 'aria-expanded': 'false', onclick: () => toggle() },
      el('span', { class: 'ex-info' },
        el('span', { class: 'ex-name' }, label),
        ex.target && el('span', { class: 'ex-sub' }, fmtTarget(ex.target)),
        ex.aim && el('span', { class: 'ex-sub' }, fmtCardio({ min: ex.aim.min || 0, km: ex.aim.km || 0 }).replace(/^0 min · /, '')),
        meta));
    const hist = el('a', { href: `#/ex/${encodeURIComponent(label)}` }, T().history);
    const removeEx = el('button', {
      type: 'button', 'aria-label': T().removeExercise(label), onclick: removeExercise,
    }, T().removeExerciseText);
    const body = el('div', { class: 'ex-body' }, el('div', { class: 'ex-fold' }, el('div', { class: 'ex-pad' },
      sets, entry, el('div', { class: 'ex-foot' }, hist, removeEx))));
    body.inert = true;
    const block = el('article', { class: 'ex' }, card, body);
    blocks.set(ex, { block, toggle, focus: () => { toggle(true, true); kg.focus({ preventScroll: true }); bringIntoView(block); } });
    folds.set(block, open => toggle(open));
    if (openEx.has(ex)) toggle(true, true);
    paint(false);
    return block;

    // One card open at a time: opening this one folds the others shut.
    function toggle(open = !block.classList.contains('open'), quiet = false) {
      if (open === block.classList.contains('open')) return;
      if (!open && editing) stopEdit();
      if (open && block.parentElement) {
        for (const other of block.parentElement.querySelectorAll('.ex.open')) {
          if (other !== block && folds.has(other)) folds.get(other)(false);
        }
      }
      body.inert = !open;
      card.setAttribute('aria-expanded', String(open));
      block.classList.toggle('open', open);
      if (open) openEx.add(ex);
      else openEx.delete(ex);
      if (open && !quiet) bringIntoView(block);
    }

    function paint(added) {
      if (editing && !ex.sets.includes(editing)) editing = null;
      const before = previous(key, ex.name);
      const ref = before ? before.sets : [];
      const prs = records(key, ex);
      if (revealed && sets.contains(revealed)) revealed = null;
      sets.textContent = '';
      ex.sets.forEach((s, i) => sets.append(setRow(s, i, added && i === ex.sets.length - 1, ref[i], prs.has(s))));
      // The entry row: the next set, or the one being changed.
      const at = editing ? ex.sets.indexOf(editing) : ex.sets.length;
      num.textContent = at + 1;
      fillPrev(nextPrev, ref[at]);
      plus.textContent = editing ? '✓' : '+';
      plus.classList.toggle('save', !!editing);
      plus.setAttribute('aria-label', editing ? T().saveSet(at + 1) : T().addSet(label));
      const sug = !editing ? suggestion(key, ex)
        : cardio ? { min: editing.min, km: 0 } : { kg: 0, reps: editing.reps };   // what an emptied field saves
      const lastSet = ex.sets[ex.sets.length - 1];
      if (cardio) {
        kg.placeholder = sug && sug.min ? fmtKg(sug.min) : '0';
        reps.placeholder = sug && sug.km ? fmtKg(sug.km) : '0';
        const mins = ex.sets.reduce((m, s) => m + (s.min || 0), 0);
        const kms = ex.sets.reduce((m, s) => m + (s.km || 0), 0);
        meta.textContent = ex.sets.length ? fmtCardio({ min: mins, km: kms }) : '0 min';
      } else {
        kg.placeholder = sug && sug.kg ? fmtKg(sug.kg) : '0';
        reps.placeholder = sug ? String(sug.reps) : '0';
        const want = ex.target ? ex.target.sets : 0;
        meta.textContent = `${ex.sets.length}${want ? `/${want}` : ''} ${T().sets}` + (lastSet ? ` · ${setText(lastSet)}` : '');
      }
      block.classList.toggle('done', key === todayKey() && !unfinished(ex));
      hist.hidden = !(ex.sets.length || before);
      refreshCard(key);
    }

    // Tap a logged set to change it (its numbers go up into the fields); tap it again to leave it.
    function startEdit(s) {
      editing = s;
      if (s.min !== undefined) {
        kg.value = fmtKg(s.min);
        reps.value = s.km ? fmtKg(s.km) : '';
      } else {
        kg.value = s.kg ? fmtKg(s.kg) : '';
        reps.value = String(s.reps);
      }
      paint(false);
    }

    function stopEdit() {
      editing = null;
      kg.value = '';
      reps.value = '';
      paint(false);
    }

    function fillPrev(span, s) {
      span.textContent = '';
      if (s) span.append(el('span', { class: 'sr' }, T().lastTime), setText(s));
      return span;
    }

    // Tap the row to change the set; "remove" shows up next to it. The button is always
    // reachable by keyboard and screen readers.
    function setRow(s, i, fresh, then, pr) {
      const rm = el('button', {
        type: 'button', class: 'act remove', 'aria-label': T().removeSet(i + 1),
        onclick: () => {
          const j = ex.sets.indexOf(s);
          if (j > -1) ex.sets.splice(j, 1);
          if (editing === s) { editing = null; kg.value = ''; reps.value = ''; }
          save();
          paint(false);
        },
      }, T().remove);
      const isEditing = editing === s;
      if (isEditing) {
        closeReveal();
        rm.classList.add('on');
        revealed = rm;
      }
      const cls = `row set${s.min !== undefined ? ' cardio' : ''}${fresh ? ' fresh' : ''}${isEditing ? ' editing' : ''}`;
      const onclick = e => {
        if (e.target.closest('.remove')) return;
        if (isEditing) stopEdit();
        else startEdit(s);
      };
      const record = pr && el('span', { class: 'pr' }, el('span', { class: 'sr' }, T().pr), el('span', { 'aria-hidden': 'true' }, 'PR'));
      if (s.min !== undefined) {
        return el('div', { class: cls, 'data-reveal': '', onclick },
          el('span', { class: 'n' }, i + 1),
          el('span', { class: 'w' }, fmtKg(s.min)),
          el('span', { class: 'u' }, 'min'),
          el('span', { class: 'w' }, s.km ? fmtKg(s.km) : ''),
          el('span', { class: 'u' }, s.km ? 'km' : ''),
          rm,
          then && fillPrev(el('span', { class: 'prev' }), then));
      }
      return el('div', { class: cls, 'data-reveal': '', onclick },
        el('span', { class: 'n' }, i + 1),
        el('span', { class: 'w' }, s.kg ? fmtKg(s.kg) : ''),
        el('span', { class: 'u' }, s.kg ? 'kg' : 'bw'),
        el('span', { class: 'u' }, '×'),
        el('span', null, s.reps),
        rm,
        then && fillPrev(el('span', { class: 'prev' }), then),
        record);
    }

    function nudge(input) {
      input.classList.remove('nope');
      void input.offsetWidth; // restart the animation
      input.classList.add('nope');
      input.focus();
      input.select();
    }

    function addSet(e) {
      e.preventDefault();
      const viaTap = tapped;
      tapped = false;
      if (editing) return saveEdit(viaTap);
      const sug = suggestion(key, ex);
      if (cardio) {
        const m = kg.value.trim() ? parseKg(kg.value) : (sug ? sug.min : null);
        const d = reps.value.trim() ? parseKg(reps.value) : (sug ? sug.km || 0 : 0);
        if (m == null || m < 0.1) return nudge(kg);
        if (d == null) return nudge(reps);
        ex.sets.push({ min: m, km: d });
      } else {
        const w = kg.value.trim() ? parseKg(kg.value) : (sug ? sug.kg : 0);
        const r = reps.value.trim() ? parseReps(reps.value) : (sug ? sug.reps : null);
        if (w == null) return nudge(kg);
        if (r == null) return nudge(reps);
        ex.sets.push({ kg: w, reps: r });
      }
      save();
      if (ex.sets.length === 1) refreshNames();
      kg.value = '';
      reps.value = '';
      closeReveal();
      paint(true);
      afterSet(key, ex);
      if (viaTap && document.activeElement && entry.contains(document.activeElement)) document.activeElement.blur();
    }

    // The changed numbers replace the set's own. An emptied weight (or distance) means none;
    // emptied reps (or minutes) stay as they were, as the grey placeholder shows.
    function saveEdit(viaTap) {
      const s = editing;
      if (s.min !== undefined) {
        const m = kg.value.trim() ? parseKg(kg.value) : s.min;
        const d = reps.value.trim() ? parseKg(reps.value) : 0;
        if (m == null || m < 0.1) return nudge(kg);
        if (d == null) return nudge(reps);
        s.min = m;
        s.km = d;
      } else {
        const w = kg.value.trim() ? parseKg(kg.value) : 0;
        const r = reps.value.trim() ? parseReps(reps.value) : s.reps;
        if (w == null) return nudge(kg);
        if (r == null) return nudge(reps);
        s.kg = w;
        s.reps = r;
      }
      save();
      if (viaTap && document.activeElement && entry.contains(document.activeElement)) document.activeElement.blur();
      stopEdit();
    }

    function removeExercise() {
      // Logged sets go with it, so ask first; an untouched exercise just goes.
      if (ex.sets.length && !confirm(T().removeAsk(label, ex.sets.length))) return;
      const day = db.days[key];
      if (day) {
        const i = day.indexOf(ex);
        if (i > -1) day.splice(i, 1); // an emptied day stays, so the plan doesn't refill it
      }
      save();
      closeReveal();
